# Traefik dynamic configuration
# File is watched — changes apply instantly without restarting Traefik.
#
# All HTTP services require the Cloudflare DNS record to be PROXIED (orange cloud).
# Game servers (TCP/UDP) require DNS-only (grey cloud).
#
# Backend URL = socat container name : socat LISTEN port (NOT the home port)
# socat forwards: VPS listen port → 10.8.0.2:home-exposed-port → app
#
# socat container         listen  →  home exposed  →  app internal
# socat-hp-hellpot        :8084   →  10.8.0.2:8090  (hellpot :8090 -- the
#                                     raw port until #1908 split the two
#                                     ways in onto separate ports, so the
#                                     enrichment worker can tell a proxied
#                                     request from a direct one. Fronting
#                                     hellpot at all is intentional --
#                                     #1509, catches the bare/www/static
#                                     hosts, was a dead `socat-static`
#                                     bridge to a "(nginx)" backend that
#                                     hasn't existed in years)
# socat-hp-galah          :8085   →  10.8.0.2:8890  (galah :8890, #1511 --
#                                     Cloudflare doesn't proxy galah's own
#                                     raw port, so this backs a real
#                                     subdomain instead. :8890 and not the
#                                     raw :8888 since #1891 -- a port only
#                                     this bridge reaches is what lets the
#                                     enrichment worker tell a proxied
#                                     request from a direct one)
# (socat-hp-wordpot :8086 → 10.8.0.2:8091 went with wordpot's retirement,
# #2381.)
# socat-hp-http           :8081   →  10.8.0.2:19081 (http-honeypot :8080)
# socat-hp-snare          :8082   →  10.8.0.2:19082 (snare :8080)
# socat-hp-dashboard-next :8092   →  10.8.0.2:19092 (default; override with
#                                     DASHBOARD_CANDIDATE_HOST/PORT; standalone
#                                     Xore/apiary-dashboard :3000, the
#                                     staging path; historical name, no
#                                     longer dashboard-next)
# socat-hp-kibana         :5601   →  10.8.0.2:19601 (kibana :5601)
# socat-hp-tanner         :8091   →  10.8.0.2:19091 (tanner_web :8091)
# socat-hp-evebox         :5636   →  10.8.0.2:19636 (evebox :5636)
# socat-hp-arkime         :8005   →  10.8.0.2:19080 (arkime viewer :8005)
# socat-hp-revdeck        :5000   →  10.8.0.2:19500 (revdeck :5000, ghidra stack)
# socat-hp-unsloth        :8899   →  10.8.0.2:8899  (Unsloth Studio :8000 published [swarm stack edge-unsloth, #3595]
#                                     on UNSLOTH_BIND, arcane/home/unsloth; #3689)
# socat-hp-keycloak       :8080   →  10.8.0.2:18080 (Keycloak :8080)
# socat-hp-arcane         :3552   →  10.8.0.2:3552  (arcane :3552, host infra
#                                     with root-equivalent /var/run/docker.sock
#                                     access -- not a scoped UI like the rest.
#                                     #1185's Dockge replacement; native OIDC,
#                                     joins the shared `proxy` network
#                                     directly, no oidc-<app> gateway)
#
# Traefik dashboard — localhost only:
#   curl http://localhost:8080/dashboard/
#   curl http://localhost:8080/api/rawdata
#
# #1185: adding a genuinely NEW router (a hostname Traefik has never served
# before) can 421 "Misdirected Request" on some/most requests even though
# this file is watched and reloads without a restart -- confirmed live: the
# file provider picked up the new router+service fine (RouterName matched
# correctly in the access log, OriginStatus:0 -- Traefik itself rejected the
# request before ever contacting the backend), but its internal HTTP/2
# muxer's per-host TLS-options cache didn't get rebuilt for the new host by
# the hot reload alone. A full `docker compose restart traefik` (not just
# editing this file) fixed it immediately, with zero config change. If a
# newly added Host(...) here 421s intermittently or consistently right after
# being added, restart the container before assuming the router config
# itself is wrong.

http:

  routers:

    # Traefik dashboard — localhost only (traefik-local entrypoint)
    traefik-api:
      rule: "PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      entryPoints: [traefik-local]
      service: api@internal
      middlewares: [local-only]

    traefik-api-oidc-upstream:
      rule: "PathPrefix(`/`)"
      entryPoints: [traefik-oidc]
      service: api@internal

    dashboard-oidc-upstream:
      rule: "PathPrefix(`/`)"
      entryPoints: [dashboard-oidc]
      service: honeypot-dashboard

    # Same api@internal service as traefik-api above, on the public entrypoint
    # instead of loopback-only traefik-local. No socat bridge needed — unlike
    # every other honeypot-revdeck-style router, this points at a service that
    # lives inside this same Traefik instance, not something on the other end
    # of the WireGuard tunnel. api.insecure is still false in traefik.yml, and
    # Traefik's dashboard API has no write/mutate endpoints — it only reads
    # back the routing config this file already defines — but that config
    # (backend URLs, service/middleware names) is still information a random
    # visitor shouldn't get, hence OIDC rather than leaving this open.
    # Matches the whole host, not just /api and /dashboard like the
    # loopback-only traefik-api router above — a visitor going straight to
    # https://traefik.<domain>/ (the obvious thing to type) hit a bare
    # Host+PathPrefix rule with no match at all, which Traefik answers with a
    # flat 421 Misdirected Request (caught live: an operator saw exactly this
    # after DNS started resolving). traefik-dashboard-redirect below sends
    # that one path to /dashboard/; api@internal handles /api and /dashboard
    # itself same as before, everything else under this host still 404s from
    # api@internal, same as it always would have.
    traefik-dashboard:
      rule: "Host(`traefik.honeypot.example`)"
      entryPoints: [websecure]
      service: oidc-traefik
      tls:
        options: modern
      middlewares: [security-headers, traefik-dashboard-redirect]

    keycloak:
      rule: "Host(`auth.honeypot.example`)"
      entryPoints: [websecure]
      service: keycloak-candidate
      tls:
        options: modern
      middlewares: [security-headers, rate-limit-auth]

    # Keycloak's admin SPA embeds these narrowly scoped session/cookie-check
    # endpoints from itself. The general DENY header blocks framing outright
    # (even same-origin), so this more-specific router allows just these two
    # paths to be framed. #1028: admin and issuer are the same origin now
    # (auth.honeypot.example), so this is a same-origin exception only --
    # no cross-host CSP allowlist needed any more.
    #
    # Realm-agnostic (`[^/]+`, not a hardcoded `apiary`): the admin console
    # runs this same cookie check against whichever realm the current admin
    # session is in, including the built-in `master` realm (e.g. while still
    # on the bootstrap-admin login, before a named apiary-realm admin exists
    # -- see KEYCLOAK-OPERATIONS.md's step 2). The original apiary-only rule
    # never matched `/realms/master/...`, so master-realm admin sessions hit
    # the general DENY header and got "Timeout when waiting for 3rd party
    # check iframe message" -- caught live, was already broken before #1028,
    # not something #1028 introduced.
    keycloak-embedded-frames:
      rule: "Host(`auth.honeypot.example`) && PathRegexp(`^/realms/[^/]+/protocol/openid-connect/(3p-cookies/|login-status-iframe\\.html)`)"
      priority: 120
      entryPoints: [websecure]
      service: keycloak-candidate
      tls:
        options: modern
      middlewares: [security-headers-keycloak-frame, rate-limit-auth]

    # #1028: admin console now serves from the same host as the issuer
    # (KC_HOSTNAME_ADMIN is unset, so Keycloak defaults it under /admin on
    # KC_HOSTNAME) instead of a separate keycloak-admin.* host. This
    # PathPrefix-scoped router exists only to give the admin SPA's bootstrap
    # burst (dozens of modules/fonts/localization files loaded concurrently)
    # the larger rate-limit-keycloak-admin budget; every other path on this
    # host -- login, token, realm discovery -- keeps the tighter
    # brute-force-resistant rate-limit-auth via the plain `keycloak` router
    # below. Keycloak's realm-admin login and mandatory MFA remain the actual
    # authorization boundary, same as when this had its own hostname.
    #
    # /admin alone only covers the SPA shell -- caught live: its actual JS
    # bundle loads from /resources/<build-fingerprint>/admin/keycloak.v2/
    # assets/..., which fell through to the tighter rate-limit-auth and hit
    # 429s loading two dozen chunks at once. The fingerprint segment is
    # opaque/build-specific, hence the regex rather than a literal path.
    # Scoped to the admin theme specifically (.../admin/...), not all of
    # /resources, so login/account theme assets keep the tighter budget.
    keycloak-admin-console:
      rule: "Host(`auth.honeypot.example`) && (PathPrefix(`/admin`) || PathRegexp(`^/resources/[^/]+/admin/`))"
      priority: 110
      entryPoints: [websecure]
      service: keycloak-candidate
      tls:
        options: modern
      middlewares: [security-headers, rate-limit-keycloak-admin]

    # #1028: same problem, different console -- the self-service Account
    # Console (/realms/<realm>/account/...) makes its own REST calls (e.g.
    # .../account/sessions/devices for the Device Activity tab) that also
    # aren't login/token brute-force targets, since they require an already-
    # authenticated session. Caught live hitting rate-limit-auth's 429 the
    # same way the admin assets did. Reuses rate-limit-keycloak-admin's
    # budget rather than inventing a third tier for what's functionally the
    # same "authenticated interactive SPA, not a login attempt" case.
    keycloak-account-console:
      rule: "Host(`auth.honeypot.example`) && PathRegexp(`^/realms/[^/]+/account`)"
      priority: 110
      entryPoints: [websecure]
      service: keycloak-candidate
      tls:
        options: modern
      middlewares: [security-headers, rate-limit-keycloak-admin]

    # #1509: was `static-site`, routing to a dead `socat-static` bridge --
    # see socat-hp-hellpot's own header comment in vps/docker-compose.yml
    # for the full story. Middlewares match every other honeypot-facing
    # router (honeypot-http/-snare/-canarytokens) now: plain
    # `[security-headers]`, no `rate-limit` -- that middleware belongs to
    # this file's personal/dev routes, not a decoy meant to absorb
    # unlimited scanner traffic.
    honeypot-hellpot-root:
      rule: "Host(`www.honeypot.example`) || Host(`honeypot.example`) || Host(`static.honeypot.example`)"
      entryPoints: [websecure]
      service: honeypot-hellpot
      tls:
        options: modern
      middlewares: [security-headers]

    # #1511: Cloudflare's proxy only carries a fixed allowlist of
    # non-standard ports for orange-cloud records -- galah's own raw port
    # (8889) isn't on it, confirmed live (unreachable through this domain
    # regardless of any VPS/ufw config). This subdomain gives it a real
    # path via 443, always proxied. Deliberately generic name, not
    # `galah`/`llm`/`ai` -- same reasoning as `cdn`/`decoy`/`snare`.
    honeypot-galah:
      rule: "Host(`hub.honeypot.example`)"
      entryPoints: [websecure]
      service: honeypot-galah
      tls:
        options: modern
      middlewares: [security-headers]

    # (honeypot-wordpot's news.honeypot.example router went with wordpot's
    # retirement, #2381.)

    python-api:
      rule: "Host(`api.honeypot.example`)"
      entryPoints: [websecure]
      service: python-api
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

    redis-api:
      rule: "Host(`redis-api.honeypot.example`)"
      entryPoints: [websecure]
      service: redis-api
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

    node-api:
      rule: "Host(`node.honeypot.example`)"
      entryPoints: [websecure]
      service: node-api
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

    uptime-kuma:
      rule: "Host(`status.honeypot.example`)"
      entryPoints: [websecure]
      service: uptime-kuma
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

    filebrowser:
      rule: "Host(`files.honeypot.example`)"
      entryPoints: [websecure]
      service: filebrowser
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

    vui-blog:
      rule: "Host(`vui.honeypot.example`)"
      entryPoints: [websecure]
      service: vui-blog
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

    vui-blog-auth:
      rule: "Host(`blog-auth.honeypot.example`)"
      entryPoints: [websecure]
      service: vui-blog-auth
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

    honeypot-http:
      rule: "Host(`decoy.honeypot.example`)"
      entryPoints: [websecure]
      service: honeypot-web
      tls:
        options: modern
      middlewares: [security-headers]

    honeypot-web:
      rule: "HostRegexp(`^.+$`)"
      priority: 1
      entryPoints: [websecure]
      service: honeypot-web
      tls:
        options: modern
      middlewares: [security-headers]

    honeypot-snare:
      rule: "Host(`www-portal.honeypot.example`) || Host(`snare.honeypot.example`)"
      entryPoints: [websecure]
      service: honeypot-snare
      tls:
        options: modern
      middlewares: [security-headers]

    # #1487: self-hosted Canarytokens' switchboard HTTP channel (bridged via
    # socat-hp-canarytokens -> 10.8.0.2:19427). Unauthenticated like
    # honeypot-http/-snare above -- this is what fires when a
    # dashboard-created PDF/Word/Excel/image/QR/Windows-Folder token is
    # opened anywhere on the internet, not an operator-facing route.
    #
    # Wildcard, not a fixed Host(): canarydrop.generate_random_hostname()
    # prepends each token's own random value as a subdomain
    # (<token>.honeypot.example), so a flat Host() match here (the original
    # #1487 config) never actually caught a real trigger request -- every
    # planted artifact's embedded action silently 404'd against this
    # router, confirmed live. Matching a bare `*.honeypot.example` (rather
    # than giving canarytokens its own dedicated subdomain, e.g. cdn.*)
    # is deliberate too: Cloudflare's free Universal SSL only certs the
    # apex plus one wildcard level (`*.honeypot.example`), not a nested one
    # (`*.cdn.honeypot.example`) -- confirmed live, TLS handshake fails at
    # Cloudflare's edge for the nested form. Riding the same wildcard every
    # other single-label subdomain here already uses is what keeps this on
    # the free tier.
    #
    # priority sits deliberately between honeypot-web's catch-all (1) and
    # every named router above (Traefik auto-prioritizes those by rule
    # length, comfortably higher): a real token's random label must beat
    # the honeypot decoy catch-all, but every actual reserved subdomain
    # (dashboard, auth, kibana, ...) must still win its own exact Host()
    # match first. Don't lower this below 1 or raise it near/above the
    # shortest named Host() rule's auto-priority without re-checking that
    # ordering still holds.
    #
    # The rule below leaves "honeypot.example"'s own internal dot
    # unescaped (only the separator dot before it is `\.`) so
    # scripts/install-vps.sh's `sed s/honeypot\.example/${DOMAIN}/g`
    # still finds and replaces the literal placeholder text verbatim --
    # an escaped `honeypot\.example` wouldn't match that sed pattern and
    # would silently never get templated to the real domain. The
    # imprecision (an unescaped `.` also matches any single character,
    # not just a literal dot) is harmless here: this is a routing
    # convenience match, not a security boundary, and no real trigger
    # hostname will ever collide with it by accident.
    honeypot-canarytokens:
      rule: "HostRegexp(`^[a-z0-9]+\\.honeypot\\.example$`)"
      priority: 5
      entryPoints: [websecure]
      service: honeypot-canarytokens
      tls:
        options: modern
      middlewares: [security-headers]

    # dashboard.honeypot.example redirects here rather than sharing this
    # router: the dashboard's own native OIDC runtime (#1026) has
    # OIDC_EXTERNAL_URL hardcoded to a single host (honeypot.honeypot.example)
    # -- that's the only redirect_uri registered with the Keycloak client, and
    # the only host its own session cookie is scoped to. A login started on
    # dashboard.* would bounce through Keycloak back to a callback on
    # honeypot.* (the only registered redirect_uri) with no valid session
    # state for that host. Redirecting dashboard.* to the canonical host
    # before the dashboard's own OIDC flow ever starts keeps the whole round
    # trip on one host. Historically the same constraint existed one layer
    # down, in oidc-dashboard's own OAUTH2_PROXY_REDIRECT_URL/CSRF-cookie
    # scoping (e8bba20) -- the compatibility gateway this router used before
    # #1026's cutover.
    honeypot-dashboard:
      rule: "Host(`honeypot.honeypot.example`)"
      entryPoints: [websecure]
      service: honeypot-dashboard
      tls:
        options: modern
      # #1026: routes directly to the dashboard's own native OIDC runtime.
      # No proxy identity headers -- the dashboard validates tokens and owns
      # its session itself (docs/KEYCLOAK-CUTOVER.md's route matrix). The
      # oidc-dashboard compatibility gateway this used to route through was
      # retired outright (no router has referenced it since #1026); only the
      # oidc-dashboard network remains, for socat-hp-dashboard/-b and
      # Traefik itself to reach the dashboard replicas directly.
      #
      # #1897: SAMEORIGIN rather than DENY. The dashboard frames its own
      # PDFs and reports, and the three path-specific exceptions added for
      # that (#211, #309, #1237) all matched Go-era URLs the port moved --
      # so each broke silently and the modal came back with "Refused to
      # display ... X-Frame-Options: deny". A fourth path exception would
      # break the same way on the next rename; the framing policy is the
      # thing to fix, not the path list. SAMEORIGIN still refuses framing
      # from any third-party origin, which is the actual clickjacking
      # threat -- the same reasoning #1028 already applied to Keycloak.
      middlewares: [security-headers-dashboard-frame]

    honeypot-dashboard-canonical-redirect:
      rule: "Host(`dashboard.honeypot.example`)"
      entryPoints: [websecure]
      service: honeypot-dashboard
      tls:
        options: modern
      middlewares: [security-headers, dashboard-canonical-redirect]

    honeypot-kibana:
      rule: "Host(`kibana.honeypot.example`)"
      entryPoints: [websecure]
      service: oidc-kibana
      tls:
        options: modern
      middlewares: [security-headers]

    honeypot-tanner:
      rule: "Host(`tanner.honeypot.example`)"
      entryPoints: [websecure]
      service: oidc-tanner
      tls:
        options: modern
      middlewares: [security-headers]

    honeypot-evebox:
      rule: "Host(`evebox.honeypot.example`)"
      entryPoints: [websecure]
      service: oidc-evebox
      tls:
        options: modern
      middlewares: [security-headers]

    honeypot-arkime:
      rule: "Host(`arkime.honeypot.example`)"
      entryPoints: [websecure]
      service: oidc-arkime
      tls:
        options: modern
      middlewares: [security-headers]

    honeypot-revdeck:
      rule: "Host(`rev.honeypot.example`)"
      entryPoints: [websecure]
      service: oidc-revdeck
      tls:
        options: modern
      middlewares: [security-headers]

    # #3689: Unsloth Studio, same isolated-gateway shape as revdeck above.
    honeypot-unsloth:
      rule: "Host(`unsloth.honeypot.example`)"
      entryPoints: [websecure]
      service: oidc-unsloth
      tls:
        options: modern
      middlewares: [security-headers]

    # #1185: Arcane (Dockge's replacement, now decommissioned) authenticates
    # natively against Keycloak -- no oidc-<app> gateway hop, this routes
    # straight to its own socat bridge (service defined below, same shape as
    # svelte-blog's own direct passthrough).
    honeypot-arcane:
      rule: "Host(`arcane.honeypot.example`)"
      entryPoints: [websecure]
      service: honeypot-arcane
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

    svelte-blog:
      rule: "Host(`svelte.honeypot.example`)"
      entryPoints: [websecure]
      service: svelte-blog
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

    csharp-api:
      rule: "Host(`csharp.honeypot.example`)"
      entryPoints: [websecure]
      service: csharp-api
      tls:
        options: modern
      middlewares: [security-headers, rate-limit-api]

    go-api:
      rule: "Host(`go.honeypot.example`)"
      entryPoints: [websecure]
      service: go-api
      tls:
        options: modern
      middlewares: [security-headers, rate-limit-api]

    rust-api:
      rule: "Host(`rust.honeypot.example`)"
      entryPoints: [websecure]
      service: rust-api
      tls:
        options: modern
      middlewares: [security-headers, rate-limit-api]

    upstream:
      rule: "Host(`ha.honeypot.example`)"
      entryPoints: [websecure]
      service: upstream
      tls:
        options: modern
      middlewares: [security-headers, rate-limit]

  services:
    oidc-kibana:
      loadBalancer:
        servers: [{url: "http://oidc-kibana:4180"}]
        passHostHeader: true

    oidc-evebox:
      loadBalancer:
        servers: [{url: "http://oidc-evebox:4180"}]
        passHostHeader: true

    oidc-arkime:
      loadBalancer:
        servers: [{url: "http://oidc-arkime:4180"}]
        passHostHeader: true

    oidc-tanner:
      loadBalancer:
        servers: [{url: "http://oidc-tanner:4180"}]
        passHostHeader: true

    oidc-revdeck:
      loadBalancer:
        servers: [{url: "http://oidc-revdeck:4180"}]
        passHostHeader: true

    oidc-unsloth:
      loadBalancer:
        servers: [{url: "http://oidc-unsloth:4180"}]
        passHostHeader: true

    oidc-traefik:
      loadBalancer:
        servers: [{url: "http://oidc-traefik:4180"}]
        passHostHeader: true

    oidc-dashboard:
      loadBalancer:
        servers: [{url: "http://oidc-dashboard:4180"}]
        passHostHeader: true

    honeypot-hellpot:
      loadBalancer:
        servers:
          - url: "http://socat-hp-hellpot:8084"
        passHostHeader: true

    honeypot-galah:
      loadBalancer:
        servers:
          - url: "http://socat-hp-galah:8085"
        passHostHeader: true

    python-api:
      loadBalancer:
        servers:
          - url: "http://socat-python-api:5000"
        passHostHeader: true

    redis-api:
      loadBalancer:
        servers:
          - url: "http://socat-redis-api:5001"
        passHostHeader: true

    node-api:
      loadBalancer:
        servers:
          - url: "http://socat-node-api:3000"
        passHostHeader: true

    uptime-kuma:
      loadBalancer:
        servers:
          - url: "http://socat-uptime-kuma:3001"
        passHostHeader: true

    filebrowser:
      loadBalancer:
        servers:
          - url: "http://socat-filebrowser:8070"
        passHostHeader: true

    vui-blog:
      loadBalancer:
        servers:
          - url: "http://socat-vui-blog:3000"
        passHostHeader: true

    vui-blog-auth:
      loadBalancer:
        servers:
          - url: "http://socat-vui-blog-auth:3000"
        passHostHeader: true

    # Keycloak is reachable only through its WireGuard bridge.
    keycloak-candidate:
      loadBalancer:
        servers:
          - url: "http://socat-hp-keycloak:8080"
        passHostHeader: true

    honeypot-web:
      loadBalancer:
        servers:
          - url: "http://socat-hp-http:8081"
        passHostHeader: true

    honeypot-snare:
      loadBalancer:
        servers:
          - url: "http://socat-hp-snare:8082"
        passHostHeader: true

    honeypot-canarytokens:
      loadBalancer:
        servers:
          - url: "http://socat-hp-canarytokens:8083"
        passHostHeader: true

    # #3749: the dashboard is Xore-Inc/apiary-dashboard, through the
    # socat-hp-dashboard-next bridge (historical name; DASHBOARD_CANDIDATE_*).
    # The legacy dashboard-next and its socat-hp-dashboard bridge are gone.
    # The healthCheck stays: Traefik polls /healthz directly and serves a
    # clean 502 instead of hanging connections during a redeploy recreate.
    honeypot-dashboard:
      loadBalancer:
        servers:
          - url: "http://socat-hp-dashboard-next:8092"
        healthCheck:
          path: /healthz
          interval: "5s"
          timeout: "3s"
        passHostHeader: true

    honeypot-kibana:
      loadBalancer:
        servers:
          - url: "http://socat-hp-kibana:5601"
        passHostHeader: true

    honeypot-tanner:
      loadBalancer:
        servers:
          - url: "http://socat-hp-tanner:8091"
        passHostHeader: true

    honeypot-evebox:
      loadBalancer:
        servers:
          - url: "http://socat-hp-evebox:5636"
        passHostHeader: true

    honeypot-arkime:
      loadBalancer:
        servers:
          - url: "http://socat-hp-arkime:8005"
        passHostHeader: true

    honeypot-revdeck:
      loadBalancer:
        servers:
          - url: "http://socat-hp-revdeck:5000"
        passHostHeader: true

    honeypot-arcane:
      loadBalancer:
        servers:
          - url: "http://socat-hp-arcane:3552"
        passHostHeader: true

    svelte-blog:
      loadBalancer:
        servers:
          - url: "http://socat-svelte-blog:4174"
        passHostHeader: true

    csharp-api:
      loadBalancer:
        servers:
          - url: "http://socat-csharp-api:5002"
        passHostHeader: true

    go-api:
      loadBalancer:
        servers:
          - url: "http://socat-go-api:5003"
        passHostHeader: true

    rust-api:
      loadBalancer:
        servers:
          - url: "http://socat-rust-api:5004"
        passHostHeader: true

    upstream:
      loadBalancer:
        servers:
          - url: "http://socat-upstream:8123"
        passHostHeader: true

  middlewares:

    local-only:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
          - "::1/128"

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    # Identical to security-headers except X-Frame-Options: SAMEORIGIN in
    # place of DENY. #1897: now attached to the general honeypot-dashboard
    # router rather than to a list of individual PDF paths -- those paths
    # moved with the port and every exception broke. SAMEORIGIN still
    # refuses framing from any third-party origin, which is the threat; it
    # only allows the dashboard to frame its own content.
    #
    # frame-ancestors 'self' is the CSP-level equivalent, kept for browsers
    # that honour it preferentially, matching security-headers-keycloak-frame
    # below.
    security-headers-dashboard-frame:
      headers:
        customFrameOptionsValue: "SAMEORIGIN"
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentSecurityPolicy: "frame-ancestors 'self'; object-src 'none'"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    # #1028: SAMEORIGIN (not a blanked-out header relying on CSP alone) now
    # that the admin SPA and the issuer paths it frames are the same origin
    # -- matches this file's own security-headers-dashboard-pdf pattern.
    # frame-ancestors 'self' is the CSP-level equivalent, kept for browsers
    # that honor CSP frame-ancestors preferentially.
    security-headers-keycloak-frame:
      headers:
        customFrameOptionsValue: "SAMEORIGIN"
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentSecurityPolicy: "frame-ancestors 'self'; object-src 'none'"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    rate-limit-api:
      rateLimit:
        average: 30
        burst: 60
        period: 1s

    # Only attached to the Traefik dashboard router. oauth2-proxy handles
    # authentication before forwarding a request that can reach this redirect.
    # Catches the bare root (/ or nothing) and /dashboard with no trailing
    # slash -- Traefik's dashboard 404s without the slash (verified live:
    # /dashboard -> 404, /dashboard/ -> the real UI; true even for the
    # original loopback-only access, not something this added). Anchored so
    # it does NOT match /dashboard/ itself (already correct) or /api/... --
    # the optional (dashboard)? group followed immediately by $ means an
    # already-trailing-slash path has one more character than this pattern
    # allows and falls through untouched, avoiding a redirect loop.
    traefik-dashboard-redirect:
      redirectRegex:
        regex: "^https://([^/]+)/(dashboard)?$"
        replacement: "https://${1}/dashboard/"
        permanent: false

    # See honeypot-dashboard-canonical-redirect's router comment above.
    # Dots deliberately unescaped (not "\." for a strict literal match): the
    # router's own Host() rule above already exact-matched the hostname
    # before any request reaches this middleware, and keeping the domain as
    # one plain contiguous string here is what lets deploy.yml's
    # `sed s/honeypot\.example/$DOMAIN/g` substitution find and replace it
    # -- an escaped "honeypot\.example" would not match that sed pattern's
    # literal text and would deploy with the placeholder domain still in it.
    dashboard-canonical-redirect:
      redirectRegex:
        regex: "^https://dashboard.honeypot.example(/.*)?$"
        replacement: "https://honeypot.honeypot.example${1}"
        permanent: true

    rate-limit-auth:
      rateLimit:
        average: 8
        burst: 16
        period: 10s
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

    rate-limit-keycloak-admin:
      rateLimit:
        # The React admin console fetches several dozen modules, fonts, and
        # localization resources concurrently during bootstrap.
        average: 20
        burst: 100
        period: 1s
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

