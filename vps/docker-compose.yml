# VPS — Traefik reverse proxy + socat bridges
# Every socat service must be on the 'proxy' network so Traefik can reach it.
# The socat command forwards from the proxy network into the WireGuard tunnel (10.8.0.2).
#
# Identity is provided by the homeserver Keycloak stack. Protected upstreams
# use native OIDC or one isolated oauth2-proxy gateway per application.
#
# Home server WireGuard IP: 10.8.0.2
# Each port here must match the port the app binds to on the home server.
#
# Suricata runs here on the VPS and sniffs the public interface.
# Logs are written to /opt/stacks/apiary/logs/suricata/ on the VPS.
# EveBox on the home server reads them via sshfs/NFS mount over WireGuard:
#   sshfs root@10.8.0.1:/opt/stacks/apiary/logs/suricata \
#         /opt/stacks/apiary/logs/suricata -o ro,allow_other

x-oidc-gateway: &oidc-gateway
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  environment: &oidc-gateway-environment
    OAUTH2_PROXY_PROVIDER: keycloak-oidc
    OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL in the VPS environment}
    OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    # #3120: oauth2-proxy answers its default /ping path unauthenticated,
    # ahead of its own auth handler -- a property of oauth2-proxy, not of
    # any one Traefik host, so all six gateways sharing this anchor (kibana,
    # tanner, evebox, arkime, revdeck, traefik) exposed it. Neither
    # healthcheck in this file depends on the default path: Traefik's own
    # liveness check hits the loopback traefik-local entrypoint directly
    # (not through this gateway), and oauth2-proxy's container healthcheck
    # runs `--version`, not an HTTP call. One line here closes all six at
    # once instead of a per-host Traefik deny router.
    OAUTH2_PROXY_PING_PATH: /__apiary_ping
    OAUTH2_PROXY_EMAIL_DOMAINS: "*"
    # The realm has no self-registration or email-verification flow at all --
    # "Administrators create every human account" (docs/KEYCLOAK-CUTOVER.md)
    # directly via kcadm/the admin console, not through a verify-your-email
    # signup. oauth2-proxy's default behavior rejects any ID token whose
    # email_verified claim isn't true, which every one of those admin-created
    # accounts fails by default -- caught live: "Error redeeming code during
    # OAuth2 callback: email in id_token () isn't verified", a full login
    # failure on every gateway-fronted app, not just one. Verified email
    # isn't a meaningful signal in this trust model (Keycloak login + the
    # realm's own account provisioning is the actual authorization boundary,
    # not whether an operator clicked a confirmation link that was never
    # sent), so this check is disabled rather than making emailVerified=true
    # a manual step every future admin has to remember when creating a user.
    OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
    # Same root cause, one layer deeper: admin-created accounts in this
    # realm aren't required to have an email at all, so the ID token has no
    # email claim to even be unverified -- caught live right after the
    # above fix: "could not enrich oidc session: neither the id_token nor
    # the profileURL set an email". oauth2-proxy needs *some* claim as its
    # user-identity key; preferred_username is what Keycloak always sets
    # for every account regardless of whether an email was ever configured,
    # unlike email which is optional here.
    OAUTH2_PROXY_OIDC_EMAIL_CLAIM: preferred_username
    OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    OAUTH2_PROXY_COOKIE_SECURE: "true"
    OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
    OAUTH2_PROXY_COOKIE_SAMESITE: lax
    # #1178: was 12h -- live-tested (test-oauth2-proxy-gateway-resilience.sh's
    # outage scenario) and confirmed a real gap: oauth2-proxy fails OPEN
    # through a Keycloak network outage past its own refresh cadence -- a
    # failed refresh due to unreachability (as opposed to an explicit
    # rejection, which IS enforced correctly, see #979's own revocation
    # test) doesn't invalidate the still-cookie-valid session. That meant a
    # session established right before an outage kept working, fully, for
    # up to the old 12h cookie lifetime regardless of whether Keycloak ever
    # came back. 30m doesn't touch active users at all -- COOKIE_REFRESH
    # below silently renews the cookie every 2m as long as Keycloak is
    # reachable -- it only bounds the worst case: an outage now forces
    # re-login after at most 30m of inactivity instead of up to 12h.
    OAUTH2_PROXY_COOKIE_EXPIRE: 30m
    # #979: was 30m -- live-tested and confirmed a real gap, not theoretical:
    # an admin-revoked session (POST .../users/{id}/logout) and a naturally
    # expired access token (accessTokenLifespan=300s in apiary-realm.json)
    # both remained fully functional against Kibana/EveBox/Arkime for the
    # entire refresh window, because oauth2-proxy only re-validates against
    # Keycloak on its own refresh cadence, not per-request or against the
    # token's own exp claim. 2m keeps the window close to the access token's
    # own 5-minute lifespan instead of six times longer than it.
    OAUTH2_PROXY_COOKIE_REFRESH: 2m
    OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
    OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST_LIMIT: "8"
    OAUTH2_PROXY_REVERSE_PROXY: "true"
    OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
    OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
    # Both already oauth2-proxy's own defaults -- pinned explicitly rather
    # than left implicit because Arkime's #979 header-trust auth
    # (the viewer's config.ini on the homeserver sets authMode=header+digest)
    # specifically depends on
    # this pair: PASS_USER_HEADERS is what injects the verified
    # X-Forwarded-User/X-Forwarded-Email Arkime trusts, and
    # SKIP_AUTH_STRIP_HEADERS is what strips any client-supplied copy of
    # those exact header names before injecting oauth2-proxy's own. A
    # silent upstream default change here would be a real, easy-to-miss
    # security regression for the one gateway that actually reads these
    # headers -- every other gateway ignores them, so this is a harmless
    # no-op for the rest.
    OAUTH2_PROXY_PASS_USER_HEADERS: "true"
    OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"
    # Without this, /oauth2/sign_out only clears this gateway's own cookie --
    # the user's Keycloak SSO session (KEYCLOAK_SESSION cookie on the auth
    # host) stays alive, and the very next visit to this or any other
    # gateway-fronted app silently re-authenticates via SSO with no
    # login/MFA prompt. {id_token} is oauth2-proxy's own placeholder,
    # substituted with the session's real ID token at logout time.
    OAUTH2_PROXY_BACKEND_LOGOUT_URL: "${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL in the VPS environment}/protocol/openid-connect/logout?id_token_hint={id_token}"
  healthcheck:
    test: ["CMD", "/bin/oauth2-proxy", "--version"]
    interval: 30s
    timeout: 5s
    retries: 3
  deploy:
    resources:
      limits: {cpus: "0.25", memory: 128M}

services:

  # ===== TRAEFIK =====
  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: traefik
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
      - "25565:25565"
      - "27015:27015/udp"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/etc/traefik/certs:ro
      # #1739: the access log now goes to a file so Filebeat can ship it.
      # Same logs/ tree as portbridge and Suricata, so the existing
      # homeserver-side mount picks it up with no new transport.
      - /opt/stacks/apiary/logs/traefik:/var/log/traefik
    networks:
      - proxy
      - oidc-kibana
      - oidc-evebox
      - oidc-arkime
      - oidc-tanner
      - oidc-revdeck
      - oidc-traefik
      - oidc-dashboard
    # #117: `traefik healthcheck` does a full binary re-exec (new Go runtime
    # init, config parse) rather than a lightweight HTTP call. Measured
    # 6-9s per invocation under this container's 0.5 CPU limit, so it never
    # completed inside a 5s timeout and the container was permanently
    # reported unhealthy despite serving real traffic the whole time. `wget`
    # against the ping entrypoint (traefik.yml: ping.entryPoint =
    # traefik-local, bound to 127.0.0.1:8080) does the same liveness check
    # in well under 100ms.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    # #2762: labeled despite being the reverse-proxy itself -- a healthcheck-
    # unhealthy Traefik has already stopped serving the /ping liveness check
    # it exists to answer, so it is already failing every request behind it.
    # A restart triggered by that state is strictly better than leaving it
    # wedged; `restart: unless-stopped` already covers a hard crash, this
    # covers the "process alive but not answering" gap that leaves open.
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
  # #1742/S5: Zeek, the depth engine. Sniffs the same public interface
  # Suricata does, via AF_PACKET fanout so neither steals packets from the
  # other -- they are complementary, not alternatives (#1727 §0).
  #
  # Measured in dev/sensing-lab over 199 MB of this interface's real traffic:
  # 21 log types and 14 285 connections, with community_id on 100% of them,
  # ja4t on 88.7%, hassh on 98.6% of SSH, and -- against an ICS-filtered
  # sample -- 74 267 modbus_detailed transaction records where Suricata
  # produces a single alert row.
  zeek:
    # dockerfile is explicit because the file is named Containerfile:
    # podman accepts either name, docker only looks for Dockerfile, and
    # developing against podman hid that until the VPS build failed.
    build:
      context: ./zeek
      dockerfile: Containerfile
    image: xore-zeek:local
    container_name: hp-zeek
    restart: unless-stopped
    network_mode: host
    read_only: false          # Zeek writes its logs and state under /logs/zeek
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    # ZEEK_SITE_SCRIPT selects the policy. Default extracts nothing; setting
    # it to local-extract.zeek turns on wire-level file extraction (#1738),
    # which writes live attacker payloads to disk. Kept as a whole-file switch
    # rather than a flag so that "are we storing malware right now?" is
    # answerable from one line of compose config.
    command:
      - -i
      # #1929: the fallback is a last resort, not a guess worth trusting --
      # detect-capture-interface.service should have written the real name
      # into .env before Docker started. Zeek fails loudly on a missing
      # interface, which is what makes this safe to have a default at all.
      - af_packet::${CAPTURE_INTERFACE:-eth0}
      - ${ZEEK_SITE_SCRIPT:-/usr/local/share/zeek-site/local.zeek}
    volumes:
      - /opt/stacks/apiary/logs/zeek:/logs/zeek
      - /opt/stacks/apiary/logs/zeek-extract:/logs/zeek-extract
    deploy:
      resources:
        limits:
          # The VPS has 2 cores and Suricata already runs here. Zeek gets one
          # of them; if it drops packets under load the fix is a fanout worker
          # count, not an unbounded limit on a box that also fronts every
          # honeypot.
          cpus: "1.0"
          memory: 1G

  # #1738: total-size cap for extracted files. extract.zeek caps each file at
  # 16 MB, which bounds one transfer but not a slow drip -- this bounds the
  # directory. Oldest-first, because the newest artefact is the one most likely
  # to still be unanalysed.
  #
  # Behind a profile: it only makes sense alongside ZEEK_SITE_SCRIPT pointing
  # at local-extract.zeek, and starting a pruner for a directory nothing writes
  # to would be misleading.
  zeek-extract-prune:
    image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: hp-zeek-extract-prune
    restart: unless-stopped
    profiles: ["file-extract"]
    command:
      - sh
      - -c
      - |
        cap=$${ZEEK_EXTRACT_MAX_BYTES:-2147483648}
        while true; do
          d=/logs/zeek-extract
          if [ -d "$$d" ]; then
            used=$$(du -sb "$$d" 2>/dev/null | cut -f1)
            while [ "$${used:-0}" -gt "$$cap" ]; do
              oldest=$$(ls -1tr "$$d" 2>/dev/null | head -1)
              [ -n "$$oldest" ] || break
              rm -f "$$d/$$oldest"
              used=$$(du -sb "$$d" 2>/dev/null | cut -f1)
            done
          fi
          sleep 120
        done
    volumes:
      - /opt/stacks/apiary/logs/zeek-extract:/logs/zeek-extract
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 32M }

  # #1742/S5: per-flow fingerprinting sidecar. Sniffs the same public
  # interface Suricata and Zeek do -- passively, so it sees blackholed
  # scanners that never reach portbridge, which an inline fingerprinter
  # could not.
  #
  # host networking because it needs the real interface, and NET_RAW/NET_ADMIN
  # for the capture. Everything else is dropped: this parses hostile traffic
  # for a living, so it gets the capability it needs and nothing more.
  #
  # Output is already de-duplicated per flow by the sidecar (raw output ran
  # 193x redundant on tcp_syn_ack against real capture), so this writes what
  # survives that filter, not the raw stream.
  huginn-sidecar:
    build: ./huginn-sidecar
    image: xore-huginn-sidecar:local
    container_name: hp-huginn-sidecar
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - /opt/stacks/apiary/logs/huginn:/logs/huginn
    # --out rather than a shell redirect, because the sidecar has to own the
    # file to rotate it safely. A redirect leaves the fd on whatever inode the
    # shell opened, so nothing but an external copy-truncate could rotate it --
    # and copy-truncate is what made portbridge ship every line twice (#1776):
    # truncation resets the tailing harvester to offset 0 while the rewritten
    # head hashes to a new fingerprint and starts a second one. The binary now
    # rotates by rename-and-reopen, the same way portbridge does.
    command: ["--interface", "${CAPTURE_INTERFACE:-eth0}", "--out", "/logs/huginn/huginn.json", "--max-bytes", "33554432"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  # #1739: Traefik has no log rotation of its own, and an unrotated access log
  # on a 116 GB VPS that is also holding ~50 GB of pcap is a slow outage.
  # Same copy-truncate approach and cadence as portbridge-log-rotate rather
  # than a second mechanism -- Filebeat already tolerates it for that log.
  traefik-log-rotate:
    image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: hp-traefik-log-rotate
    restart: unless-stopped
    # Shares Traefik's PID namespace so it can signal it without a Docker
    # socket. Handing the internet-facing host's log rotator the socket would
    # be a far larger grant than rotating a file needs.
    pid: "service:traefik"
    command:
      - sh
      - -c
      - |
        # Rename-and-signal, NOT copy-truncate. Truncating a file Filebeat is
        # tailing splits its registry: the truncation resets the live harvester
        # to offset 0 while the rewritten head hashes to a new fingerprint and
        # starts a second harvester, and both then ship every appended line.
        # That was measured on portbridge at 99.9% duplicates (#1776).
        #
        # Traefik reopens its access log on SIGUSR1, so renaming first and
        # signalling second gives a clean new file with no window where lines
        # are written to a path nothing is reading. Traefik is PID 1 in the
        # namespace this container joins.
        f=/logs/traefik/access.json
        while true; do
          if [ -f "$$f" ] && [ $$(stat -c %s "$$f") -gt 33554432 ]; then
            mv "$$f" "$$f.1" && kill -USR1 1
          fi
          sleep 60
        done
    volumes:
      - /opt/stacks/apiary/logs/traefik:/logs/traefik
    depends_on:
      - traefik
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

  socat-python-api:
