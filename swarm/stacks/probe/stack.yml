# Throwaway proof stack for #3590: exercises the GitOps sync, a versioned
# config, an external versioned secret (_FILE pattern), healthcheck-gated
# rolling update and automatic rollback. Not a service; removed before merge.
services:
  web:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sh", "-c", "test -s \"$$PROBE_TOKEN_FILE\" && exec httpd -f -p 8080 -h /www"]
    environment:
      PROBE_TOKEN_FILE: /run/secrets/probe_token
    secrets:
      - source: probe_token
        target: probe_token
        mode: 0400
    configs:
      - source: index
        target: /www/index.html
        mode: 0444
    healthcheck:
      # Healthy only while the served page carries the marker.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ | grep -q 'probe ok'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.role == manager
          - node.labels.sensor == false
      restart_policy:
        condition: any
        delay: 5s
        window: 30s
      update_config:
        parallelism: 1
        delay: 2s
        monitor: 30s
        failure_action: rollback
        max_failure_ratio: 0
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 0s
        monitor: 20s
        failure_action: pause
        order: start-first
      labels:
        apiary.pause: safe
        apiary.pause.reason: "#3590 proof stack; nothing depends on it"

secrets:
  probe_token:
    external: true
    name: probe_token_v2

configs:
  index:
    name: probe_index_v4
    file: ./configs/index.html
