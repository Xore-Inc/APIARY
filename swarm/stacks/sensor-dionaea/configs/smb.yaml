- name: smb
  config:
    os_type: 4
    primary_domain: MERIDIAN
    oem_domain_name: MERIDIAN
    server_name: LEGACY-SVC-02
    native_os: Windows Server 2008 R2 Standard 7601 Service Pack 1
    native_lan_manager: Windows Server 2008 R2 6.1
    shares:
      ADMIN$:
        comment: Remote Admin
        path: C:\Windows
        type: disktree
      C$:
        comment: Default Share
        path: C:\
        type: [disktree, special]
      DataExchange:
        comment: ERP integration exchange
        path: D:\DataExchange
        type: disktree
      Scans:
        comment: Warehouse scanner imports
        path: D:\Scans
        type: disktree
      IPC$:
        comment: Remote IPC
        type: ipc
