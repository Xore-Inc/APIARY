# #3593 (phase 6): the SonicWall SMA1000 decoy hp-sonicwall-sma-honeypot as a
# sensor stack, pinned to the homeserver. Same container as the
# sonicwall-sma-honeypot service in
# arcane/home/honeypot-sonicwall-sma/compose.yml, which stays defined as the
# rollback (see README.md next to this file).
#
# Differences a stack forces, and what covers them:
# - The port publishes in `mode: host` on every node address (Compose bound
#   10.8.0.2 only). home-swarm-host-guard.sh drops NEW flows to 8543 unless
#   they come from the VPS hub on wg0; the port is listed in
#   ops/firewall/hosts/homeserver-swarm-host-ports.txt. 8543 is a unique host
#   port and no container calls it (the decoy's own AMC relay goes out to
#   10.8.0.2:18083, which is not guarded), so the guard's port match cannot
#   hit unrelated traffic (#3769).
# - `security_opt` is not supported. Gate for moving before the homeserver
#   gets daemon-wide no-new-privileges (#3593): non-root (65534), cap_drop
#   ALL, read_only, and no setuid/setgid file in the image (FROM scratch,
#   checked on this digest 2026-11-06).
# - The healthcheck is restated (the image's HEALTHCHECK is the same) because
#   the lint requires it in the stack.
# - autoheal does not act on swarm tasks; the restart policy and the
#   healthcheck replace it.
#
# Reached from the VPS on public 8543 (portbridge, PROXY header).
services:
  sonicwall-sma:
    image: ghcr.io/xore-inc/honeypot-sonicwall-sma-honeypot@sha256:de7270b6d6acf268ff3219333bc788f9304ce66df0cc8fce274ffa7dc501acb1
    ports:
      - target: 8443
        published: 8543
        protocol: tcp
        mode: host
    volumes:
      - type: bind
        source: /opt/stacks/apiary/logs/sonicwall-sma-honeypot
        target: /var/log/honeypot
      - type: bind
        source: /opt/stacks/apiary/state/init-markers
        target: /markers
        read_only: true
    environment:
      LISTEN_ADDR: ":8443"
      LOG_FILE: /var/log/honeypot/sonicwall-sma-honeypot.json
      PROXY_PROTOCOL: "1"
      # Fixed relay target for the CVE-2026-83548 SSRF hop (api-honeypot's
      # cloud-metadata surface, still on Compose). Never read from a request.
      AMC_RELAY_URL: http://10.8.0.2:18083/latest/meta-data/iam/security-credentials/worker-node
      TZ: Europe/Berlin
    read_only: true
    cap_drop: [ALL]
    networks: [decoy]
    healthcheck:
      test: ["CMD", "/sonicwall-sma-honeypot", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.sensor == true
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
      update_config:
        parallelism: 1
        delay: 5s
        monitor: 100s
        failure_action: rollback
        max_failure_ratio: 0
        # Host-mode port: two tasks must never contend for 8543.
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 0s
        monitor: 100s
        failure_action: pause
        order: stop-first
      labels:
        apiary.pause: safe
        apiary.pause.reason: "standalone SMA decoy, no dependents (scripts/honeypot-pause.sh)"
networks:
  decoy:
    driver: overlay
    # Pinned inside the fleet pool (#3763); unique across stacks.
    ipam:
      config:
        - subnet: 10.200.11.0/24
    driver_opts:
      com.docker.network.driver.mtu: "1310"
