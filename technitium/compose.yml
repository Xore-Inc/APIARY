# Source of truth for the homeserver's LAN DNS stack (Technitium DNS Server,
# replacing Pi-hole — user decision 2026-09-03). Binding to every interface
# would collide with dns-honeypot on the WireGuard address (see
# scripts/install-homeserver.sh and #518), so DNS binds only to the LAN IP
# via ${LAN_IP} interpolation, set via this stack's own .env (see
# .env.example). Same mechanism every other stack in this repo already uses
# for host-specific config.
#
# Technitium handles its own encrypted upstreams (DoH/DoT/DoQ are configured
# in the server's zone/settings UI and persisted in ./config), so the old
# dnscrypt-proxy sidecar is gone — one service, one container.

name: technitium

services:
  technitium:
    # 15.x, not 11.5.1. This node is the SECONDARY of a two-node cluster whose
    # primary runs 15.x, and Technitium's on-disk config files are versioned:
    # an 11.5.1 server refuses config written by a 15.x peer outright --
    #   System.IO.InvalidDataException: DnsServer log config version not supported.
    # -- and crash-loops. Restoring this node's own backed-up state onto the
    # pinned 11.5.1 image reproduced exactly that on the 2026-09-04 rebuild.
    # Cluster members have to agree on major version; pin both, and move them
    # together.
    image: technitium/dns-server:15.6.0@sha256:1045db38fd2f2e4d9578f9168b7eb4862575469ed0ffc79e03f36bdc772a93b5
    container_name: technitium-dns
    restart: unless-stopped
    ports:
      - "${LAN_IP:-127.0.0.1}:53:53/tcp"
      - "${LAN_IP:-127.0.0.1}:53:53/udp"
      - "${LAN_IP:-127.0.0.1}:5380:5380/tcp"
      # Cluster replication. The primary (hermes) reaches this node on 53443 to
      # push zones and settings; the image only EXPOSEs the port, so without an
      # explicit publish nothing binds it on the host and the primary reports
      #   Error! No route to host (supermicro.cluster.xore.lan:53443)
      # -- "no route" rather than "refused" because firewalld REJECTs it, while
      # 53 and 5380 are reachable only because Docker's own DNAT/FORWARD rules
      # bypass the firewalld zone. Publishing it here bypasses firewalld the
      # same way, so no zone change is needed. The primary runs with
      # network_mode: host and already listens on 53443 for the reverse
      # direction.
      - "${LAN_IP:-127.0.0.1}:53443:53443/tcp"
    environment:
      # The built-in DNS_SERVER_ADMIN_PASSWORD var only applies on first
      # bootstrap; afterwards the password lives in ./config and this var is
      # ignored (documented upstream). Required on first boot so a fresh
      # install is never left with the default "admin" password.
      DNS_SERVER_ADMIN_PASSWORD: "${TECHNITIUM_PASSWORD:?set TECHNITIUM_PASSWORD in .env}"
      DNS_SERVER_DOMAIN: "${DNS_SERVER_DOMAIN:-homeserver.lan}"
      DNS_SERVER_PREFER_IPV6: "false"
      DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES: ""
    volumes:
      # All server state (zones, settings, blocklists, logs config) lives here.
      #
      # The target is /etc/dns, NOT /etc/dns/config. Technitium's config folder
      # IS /etc/dns -- it says so on every boot ("Using config folder:
      # /etc/dns") and the healthy cluster peer mounts it that way. Mounting a
      # level deeper left the server reading its own ephemeral container layer
      # instead: every restart started from a default config, the
      # forwarders.config the installer provisions was never read, and no zone
      # or setting ever survived a `compose up --force-recreate`. The node
      # answered nothing at all -- `dig @127.0.0.1` inside the container timed
      # out, so its healthcheck could never pass. Confirmed live on the
      # 2026-09-04 rebuild by listing both paths inside the container: /etc/dns
      # held a fresh 275-byte dns.config while the whole real state sat unread
      # under /etc/dns/config.
      - ./config:/etc/dns
    # Port 53 requires the standard binding capability; no NET_ADMIN needed.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          # Raised from 1GB: measured at 750.9 MiB / 1 GiB (73%) on the live
          # node once it was actually serving its restored zones and
          # blocklists -- the second-tightest container on the host.
          memory: 2GB
    healthcheck:
      # A response to a cache-busting recursive query proves the complete
      # path is working (same pipeline principle as the old Pi-hole check).
      # NXDOMAIN is a valid external DNS response; a timeout produces no
      # status line and fails the pipeline.
      test:
        - CMD-SHELL
        - 'dig @127.0.0.1 "$(date +%s).healthcheck.example.com" A +time=3 +tries=1 +noall +comments | grep -Eq "status: (NOERROR|NXDOMAIN)"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
