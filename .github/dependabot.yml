version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, github-actions]

  - package-ecosystem: gomod
    # #1502: repointed at arcane/home/honeypot-<name>/ for every directory
    # whose stack migrated there. portbridge/vps/portbridge are VPS-side,
    # out of #1502's scope, unchanged.
    directories:
      - /arcane/home/honeypot-dnp3/dnp3-honeypot
      - /arcane/home/honeypot-http/http-honeypot
      - /arcane/home/honeypot-multipot/multipot
      - /portbridge
      - /arcane/home/honeypot-dionaea/tftp-relay
      - /vps/portbridge
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Berlin
    groups:
      go-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name
    labels: [dependencies, go]

  - package-ecosystem: cargo
    directory: /arcane/home/honeypot-dashboard/backend-service
    schedule:
      interval: weekly
      day: monday
      time: "04:35"
      timezone: Europe/Berlin
    groups:
      backend-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  # #154 phase 4: was only these 7 (a leftover of gomod's own directory
  # list above, never extended past it) -- every other Dockerfile in this
  # tree got zero automated base-image update coverage at all. Now every
  # directory with a real `FROM <image>:<tag>` this tree has (`FROM
  # scratch` stages need nothing). /sandbox/ghosts is included for
  # completeness but its Dockerfile is non-standard-named
  # (Dockerfile.client-win, not Dockerfile) -- left in since including it
  # costs nothing if Dependabot's docker ecosystem doesn't discover that
  # filename, but pulled out here rather than silently assumed to work.
  - package-ecosystem: docker
    # #1502: repointed at arcane/home/honeypot-<name>/ for every directory
    # whose stack migrated there. analysis/ghidra, auth-events-worker,
    # llm-worker, ml-worker, sandbox/ghosts stayed at their existing path
    # (already self-contained before #1502); portbridge/vps/p0f/
    # vps/portbridge are VPS-side, out of scope, unchanged.
    directories:
      - /arcane/home/honeypot-agent-intrusion-worker/analysis/agent-intrusion-corpus
      - /arcane/home/honeypot-dashboard/analysis/es-results-importer
      - /analysis/ghidra/service
      - /analysis/ghidra/statictools
      - /arcane/home/honeypot-payload-analysis/analysis/yara
      - /auth-events-worker
      - /arcane/home/honeypot-cisco-asa-honeypot/cisco-asa-honeypot
      - /arcane/home/honeypot-citrix-honeypot/citrix-honeypot
      - /arcane/home/honeypot-conpot/conpot
      - /arcane/home/honeypot-cowrie/cowrie
      - /arcane/home/honeypot-dicompot/dicompot
      - /arcane/home/honeypot-dionaea/dionaea
      - /arcane/home/honeypot-dnp3/dnp3-honeypot
      - /arcane/home/honeypot-dns-honeypot/dns-honeypot
      - /arcane/home/honeypot-endlessh/endlessh-honeypot
      - /arcane/home/honeypot-http/http-honeypot
      - /arcane/home/honeypot-dashboard/backend-service
      - /llm-worker
      - /ml-worker
      - /arcane/home/honeypot-multipot/multipot
      - /portbridge
      - /arcane/home/honeypot-rdp-honeypot/rdp-honeypot
      - /arcane/home/honeypot-sonicwall-sma/sonicwall-sma-honeypot
      - /arcane/home/honeypot-utilities/reporter
      - /sandbox/ghosts
      - /sandbox/windows/gateway/inetsim
      - /arcane/home/honeypot-dashboard/services-adapter
      - /arcane/home/honeypot-tanner/tanner/phpox
      - /arcane/home/honeypot-tanner/tanner/redis
      - /arcane/home/honeypot-tanner/tanner/sandbox
      - /arcane/home/honeypot-dionaea/tftp-relay
      - /vps/p0f
      - /vps/portbridge
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Berlin
    groups:
      container-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name
    labels: [dependencies, containers]

  # #1116 (third occurrence of the same regression -- previously #1075 for
  # snare, #1076/f6b5a97 for tanner): Dependabot's docker group treats
  # python's two-part tags (3.11 -> 3.14) as a minor bump, so it sails
  # straight through the shared group's update-types: [minor, patch]
  # filter above and silently overwrites these two Dockerfiles' own
  # documented, verified-live pins -- snare needs <=3.11 (no prebuilt
  # aiohttp==3.8.6 wheel past cp311), tanner needs exactly 3.10
  # (pylibinjection's pre-generated Cython C targets the pre-3.11
  # PyCode_New ABI). Same fix as ml-worker/auth-events-worker below: split
  # out of the shared group and ignore the dependency outright, since a
  # comment documenting a compatibility constraint is invisible to
  # Dependabot and it will keep proposing the exact same disproven bump
  # indefinitely otherwise.
  - package-ecosystem: docker
    directories:
      - /arcane/home/honeypot-init/snare  # #1502
      - /arcane/home/honeypot-tanner/snare  # #2316: byte-identical twin of
        # honeypot-init/snare's Dockerfile, verified blob-equal -- was
        # absent from every dependabot entry, so the exact #1116 regression
        # this entry exists to prevent was still reachable through it.
      - /arcane/home/honeypot-tanner/tanner/tanner  # #1502
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Berlin
    groups:
      container-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name
    ignore:
      - dependency-name: python
    labels: [dependencies, containers]

  - package-ecosystem: pip
    # es-results-importer and llm-worker also carry their own
    # requirements.txt with no pip coverage here -- a pre-existing gap,
    # not introduced by this list; flagged rather than silently fixed here
    # since auditing every pip-based directory is a separate piece of work
    # from what added agent-intrusion-corpus's own requirements.txt (#154).
    directories:
      - /arcane/home/honeypot-agent-intrusion-worker/analysis/agent-intrusion-corpus  # #1502
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    # #2090: same doctrine as ml-worker/auth-events-worker below. This
    # directory lived the failure mode from both sides -- dependabot put a
    # 9.x client here while the server was 8.x (#872), a human reverted it
    # hours before the server moved to 9.x (#1377 vs #1408/#1410), and the
    # re-bump landed correct-only-by-timing (#1516), each flip contradicting
    # whatever the file's comment said at the time. The pin now sits at
    # 9.5.0 against the deployed 9.5.1 server (verified live, recorded in
    # docs/runtime-compatibility-record.md) and moves only with a fresh
    # recorded verification -- it may follow the server's major, never
    # lead it.
    ignore:
      - dependency-name: elasticsearch
    labels: [dependencies, python]

  # #174: split out of the shared pip entry below specifically so the
  # ignore rules here apply only to ml-worker's own requirements.txt.
  # agent-intrusion-corpus's separate pip entry carries its own
  # elasticsearch ignore rule now too (#2090), with that directory's own
  # version of the same story.
  #
  # numpy/elasticsearch here have both been silently re-bumped back to a
  # version their own in-file comments already document as broken, twice
  # each (#593 first found and reverted both; #174 found them re-broken a
  # second time -- PR #850 for numpy, PR #851 for elasticsearch, both
  # "python-compatible" grouped minor/patch bumps that fit right through
  # the update-types filter with nothing to stop them). A code comment
  # documenting a compatibility constraint is invisible to Dependabot,
  # which only reads version ranges -- it will keep proposing the exact
  # same disproven bump indefinitely otherwise. Ignored entirely rather
  # than range-limited: both need a real compatibility re-verification
  # (numpy jointly with numba/llvmlite; elasticsearch client against
  # whatever server version is actually deployed), not just "a slightly
  # newer version might work this time."
  - package-ecosystem: pip
    directory: /ml-worker
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: numpy
      - dependency-name: elasticsearch
    labels: [dependencies, python]

  # #1066: same elasticsearch==8.19.3 pin, same reason, as ml-worker above
  # -- split into its own entry for the same reason ml-worker's is split
  # from the shared pip entry (an ignore rule scoped to one directory's
  # requirements.txt, not every Python stack's).
  - package-ecosystem: pip
    directory: /auth-events-worker
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: elasticsearch
    labels: [dependencies, python]

  # #2221: es-results-importer and llm-worker were the pre-existing pip
  # coverage gap the shared entry above flagged but never filed. Both pin
  # elasticsearch==8.19.3 with the same in-file compatibility doctrine as
  # ml-worker/auth-events-worker above (re-verified live against the 9.5.1
  # server, #2090) -- same split-entry-with-ignore treatment, not a range
  # limit, for the same reason: a code comment is invisible to Dependabot.
  - package-ecosystem: pip
    directory: /arcane/home/honeypot-dashboard/analysis/es-results-importer
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: elasticsearch
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /llm-worker
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      python-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: elasticsearch
    labels: [dependencies, python]
