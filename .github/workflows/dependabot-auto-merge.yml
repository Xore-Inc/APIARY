name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# #3313: nothing at the workflow level. The one job below is the only thing
# here that needs a token and it declares what it spends -- approving, arming
# auto-merge and commenting -- so a job or step added later starts with no
# token rather than inheriting two write scopes by accident.
permissions: {}

jobs:
  compatible-update:
    # #3314: zizmor flags github.actor as spoofable on its own; it is not the
    # only test here -- the PR author must also be dependabot[bot], which a
    # third party cannot fake, and both must hold.
    if: >- # zizmor: ignore[bot-conditions]
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # #3311: under semver, 0.y.z has no stability promise -- a 0.9 -> 0.10
      # bump is a major change, and Cargo's caret rules treat it as one.
      # fetch-metadata still labels it semver-minor, which is how rand
      # 0.9 -> 0.10 and sha2 0.10 -> 0.11 qualified for auto-merge and landed
      # on main with a broken backend build (#3287, #3289). Hold any update
      # that moves a 0.x dependency's minor version (grouped PRs: any member).
      - name: Hold 0.x minor bumps for manual review
        id: zero-major
        env:
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          held="$(jq -r '[.[] | select(.updateType == "version-update:semver-minor"
                                   and ((.prevVersion // "") | startswith("0.")))
                             | "\(.dependencyName) \(.prevVersion) -> \(.newVersion)"] | join(", ")' <<<"${DEPS:-[]}")"
          if [ -n "$held" ]; then
            echo "hold=true" >>"$GITHUB_OUTPUT"
            echo "held=$held" >>"$GITHUB_OUTPUT"
            echo "::notice::0.x minor bump(s), not auto-merging: $held"
          fi

      - name: Check out the PR head
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # #2741's npm-lockfile gate checked frontend-next's package-lock.json
      # under node:26-alpine's npm. It left with frontend-next (#3749): this
      # repo has no other npm project with a Dockerfile-pinned npm.
      - name: Approve patch and minor updates
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.zero-major.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable squash auto-merge after required checks
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.zero-major.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Arm GitHub's native auto-merge so the PR merges once its required
          # checks pass. This needs branch protection (or a ruleset) on the base
          # branch; without it the enablePullRequestAutoMerge mutation returns
          # "Protected branch rules not configured for this branch". Treat only
          # that specific case as non-fatal -- a human still merges manually --
          # instead of failing this required check on every dependabot PR.
          if err="$(gh pr merge --auto --squash "$PR_URL" 2>&1)"; then
            echo "$err"
            exit 0
          fi
          echo "$err"
          if printf '%s' "$err" | grep -q "Protected branch rules not configured"; then
            echo "::warning::Auto-merge could not be armed: the base branch has no branch protection / ruleset. Merge this dependabot PR manually once its checks pass."
            gh pr comment "$PR_URL" --body \
              "Auto-merge is unavailable because the base branch has no branch protection or ruleset configured, so GitHub cannot arm \`--auto\`. This compatible dependabot update is fine to merge manually once its checks pass. (Configuring a branch-protection rule or ruleset on the default branch would restore automatic merging.)" || true
            exit 0
          fi
          exit 1

      - name: Leave the 0.x minor bump for a human
        if: steps.zero-major.outputs.hold == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HELD: ${{ steps.zero-major.outputs.held }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Not auto-merging: this moves the minor version of a 0.x dependency ($HELD). Under semver that is a breaking change even though Dependabot labels it semver-minor (#3311). Check the changelog and merge by hand once the required checks pass."
