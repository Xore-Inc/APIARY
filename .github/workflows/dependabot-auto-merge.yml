name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# #3313: nothing at the workflow level. The one job below is the only thing
# here that needs a token and it declares what it spends -- arming auto-merge
# and commenting -- so a job or step added later starts with no token rather
# than inheriting two write scopes by accident.
permissions: {}

jobs:
  compatible-update:
    # #3314: zizmor flags github.actor as spoofable on its own; it is not the
    # only test here -- the PR author must also be dependabot[bot], which a
    # third party cannot fake, and both must hold.
    if: >- # zizmor: ignore[bot-conditions]
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # #3964: dispatching main's CI after the merge lands (workflow_dispatch
      # is the one event a workflow token can trigger).
      actions: write
    steps:
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The lockfile check below diffs the PR's base and head commits, so the
      # checkout needs their history. The token is not persisted: nothing after
      # this step pushes.
      - name: Check out the PR history
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Every reason a person should merge this one by hand is decided here,
      # and any reason holds it:
      # - a GitHub Actions bump: the action runs on main with secrets and write
      #   scopes, and no required check exercises the new action code;
      # - a 0.x minor or major bump (#3311): under semver it is breaking, even
      #   though Dependabot labels it semver-minor, and an update to a 0.x
      #   dependency can be a major change (#3287, #3289). Only direct
      #   dependencies appear in updated-dependencies-json, so the lockfiles are
      #   checked too (#3946: lopdf 0.44 -> 0.47 was a transitive move);
      # - any 0.x minor-line move in Cargo.lock, requirements*.txt or go.sum,
      #   as reported by the base-side copy of the checker.
      # The checker is read from the base commit, so a PR cannot change it.
      - name: Hold updates a person should review
        id: hold
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reasons=()
          if [ "$ECOSYSTEM" = "github_actions" ]; then
            reasons+=("GitHub Actions bump (runs with secrets and write scopes on main; no required check exercises the new action code)")
          fi
          zero="$(jq -r '[.[] | select((.updateType == "version-update:semver-minor" or .updateType == "version-update:semver-major")
                                   and ((.prevVersion // "") | startswith("0.")))
                             | "\(.dependencyName) \(.prevVersion) -> \(.newVersion)"] | join(", ")' <<<"${DEPS:-[]}")"
          if [ -n "$zero" ]; then
            reasons+=("0.x minor bump: $zero")
          fi
          if [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            git show "$BASE_SHA:scripts/check-dependabot-lockfiles.py" >"$RUNNER_TEMP/check-dependabot-lockfiles.py"
            moves="$(python3 "$RUNNER_TEMP/check-dependabot-lockfiles.py" "$BASE_SHA" "$HEAD_SHA")"
            if [ -n "$moves" ]; then
              reasons+=("0.x lockfile move: ${moves//$'\n'/; }")
            fi
          fi
          if [ "${#reasons[@]}" -gt 0 ]; then
            held="$(printf '%s; ' "${reasons[@]}")"
            held="${held%; }"
            echo "hold=true" >>"$GITHUB_OUTPUT"
            echo "held=$held" >>"$GITHUB_OUTPUT"
            echo "::notice::Not auto-merging: $held"
          fi

      # Arm GitHub's native auto-merge so the PR merges once its required
      # checks pass. This needs branch protection (or a ruleset) on the base
      # branch; without it the enablePullRequestAutoMerge mutation returns
      # "Protected branch rules not configured for this branch". Treat only
      # that specific case as non-fatal -- a human still merges manually --
      # instead of failing this required check on every dependabot PR.
      - name: Enable squash auto-merge after required checks
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.hold.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if err="$(gh pr merge --auto --squash "$PR_URL" 2>&1)"; then
            echo "$err"
            exit 0
          fi
          echo "$err"
          if printf '%s' "$err" | grep -q "Protected branch rules not configured"; then
            echo "::warning::Auto-merge could not be armed: the base branch has no branch protection / ruleset. Merge this dependabot PR manually once its checks pass."
            gh pr comment "$PR_URL" --body \
              "Auto-merge is unavailable because the base branch has no branch protection or ruleset configured, so GitHub cannot arm \`--auto\`. This compatible dependabot update is fine to merge manually once its checks pass. (Configuring a branch-protection rule or ruleset on the default branch would restore automatic merging.)" || true
            exit 0
          fi
          exit 1

      # #3964: the merge above is performed by GitHub after the required checks
      # pass, and a merge made with this workflow token starts no push
      # workflows. So wait here for the PR to merge, then dispatch Quality,
      # Containers and CodeQL on main. The script comes from the base commit,
      # like the lockfile check above, so a PR cannot change what runs here.
      - name: Dispatch main CI once the merge lands
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.hold.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:scripts/dispatch-main-ci-after-merge.sh" >"$RUNNER_TEMP/dispatch-main-ci-after-merge.sh"
          bash "$RUNNER_TEMP/dispatch-main-ci-after-merge.sh" "$PR_NUMBER"

      - name: Leave the update for a human
        if: steps.hold.outputs.hold == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HELD: ${{ steps.hold.outputs.held }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Not auto-merging: $HELD. Check the changelog and merge by hand once the required checks pass. Auto-merge holds GitHub Actions bumps, 0.x minor and major bumps, and 0.x minor-line moves in a lockfile (#3311, #3946)."
