name: CI executor router

# Reusable homeserver-first routing decision, shared by every workflow that
# can execute jobs on the homeserver's honeypot-ci runner (containers.yml,
# security.yml, pages.yml, quality.yml -- #2571 migrated quality.yml's own
# copy onto this one). The full rationale for the decision procedure is
# documented here and in docs/CI-CD.md; the short form:
#
#   1. Trust gate. Fork PRs are attacker-controlled input and must never
#      become process execution on home-network infrastructure, so they are
#      never routed to the homeserver (the caller passes CI_HOMESERVER_PRS
#      through, and empty means pull_request is never trusted). push to
#      main and workflow_dispatch are trusted by construction.
#   2. Liveness is measured, not read. GET /actions/runners answers HTTP
#      403 to GITHUB_TOKEN under every permission shape (live-verified
#      2026-08-27), so availability is proven by dispatching the ci-heartbeat
#      canary at a real ref -- the triggering branch, or a same-repo PR's
#      head branch (the "<n>/merge" merge ref GITHUB_REF_NAME holds for
#      pull_request runs backs no branch and dispatches refuse with 422) --
#      and requiring a fresh run to complete inside the decision windows.
#      Anything else -- box off, paused, unregistered, service wedged --
#      times out and the caller's jobs fall back to GitHub-hosted.
#   3. Manual override. force_github_hosted="true" forces the fallback
#      direction regardless of trust or liveness -- e.g. Quality's own
#      force_github_hosted workflow_dispatch input while servicing the
#      homeserver.
#
# Fail-safe: every error path resolves to homeserver=false, so routing can
# degrade CI's speed, never its pass/fail correctness.
#
# Caller obligation: every calling workflow MUST grant `actions: write` at
# its workflow-level permissions -- a called reusable workflow can never
# exceed the caller's envelope, and under-granting it startup-fails the
# whole run as "Invalid workflow file" (the route job below requests
# actions:write solely for the heartbeat dispatch).

on:
  workflow_call:
    inputs:
      ci_homeserver_prs:
        description: >-
          Value of vars.CI_HOMESERVER_PRS at the caller. Retained for
          caller compatibility but ignored: every pull_request stays on
          GitHub-hosted runners, as unreviewed PR content must never
          execute on the persistent self-hosted runner.
        type: string
        required: false
        default: ""
      force_github_hosted:
        description: >-
          "true" forces the fallback direction regardless of trust or
          liveness -- e.g. a caller's own manual override input while
          servicing the homeserver. Anything else routes normally.
        type: string
        required: false
        default: ""
    outputs:
      homeserver:
        description: "'true' when the honeypot-ci runner may execute this run, else 'false'"
        value: ${{ jobs.route.outputs.homeserver }}

permissions:
  contents: read

jobs:
  route:
    name: Pick CI executor
    runs-on: ubuntu-latest
    # Must comfortably outlive the heartbeat windows below
    # (dispatch + appear-wait + terminal-wait + API slack; worst case
    # 120s + 420s plus slack).
    timeout-minutes: 15
    # actions:write exists solely to launch the ci-heartbeat canary.
    permissions:
      contents: read
      actions: write
    outputs:
      # Always written ('true'/'false', never empty) so downstream
      # `== 'true'` comparisons cannot misread an absent string as truthy.
      homeserver: ${{ steps.route.outputs.homeserver }}
    env:
      GH_TOKEN: ${{ github.token }}
      CI_HOMESERVER_PRS: ${{ inputs.ci_homeserver_prs }}
      FORCE_GITHUB_HOSTED: ${{ inputs.force_github_hosted }}
    steps:
      - id: route
        shell: bash
        run: |
          set -euo pipefail

          # The runner always exposes the webhook payload natively as
          # GITHUB_EVENT_PATH; there is no github.event_path expression to
          # map through env (the key silently vanishes and, under set -u,
          # reading the bare name aborts the step -- seen live on a PR run).
          EVENT_PATH="${EVENT_PATH:-${GITHUB_EVENT_PATH:-}}"

          # Defaults are the fallback path; the guards below may only set
          # them to true.
          trusted=false
          online=false

          case "$GITHUB_EVENT_NAME" in
            push)
              # Callers' push triggers are branch/tag scoped to
              # already-reviewed commits (main, v* tags).
              trusted=true ;;
            workflow_dispatch)
              trusted=true ;;
            schedule)
              trusted=true ;;
            pull_request)
              # A pull request is never trusted for the persistent
              # self-hosted runner. Same-repository identity proves only
              # that the author holds write access; it establishes no
              # review, branch protection or commit immutability, so a PR
              # (workflows, scripts, npm lifecycle and build code) would
              # run unreviewed on the honeypot-ci host. CI_HOMESERVER_PRS
              # is therefore deliberately ignored for pull_request events;
              # they always fall back to GitHub-hosted runners.
              trusted=false ;;
          esac

          # Decision-window knobs: env-overridable so local unit tests run
          # in seconds while production keeps these defaults. The two
          # windows together bound worst-case router cost well under this
          # job's own timeout-minutes.
          # GH_TOKEN arrives via the job-level env mapping above and is
          # therefore always present -- no shell-side default guard here,
          # which scripts/check-public-leaks.py would flag as a literal
          # credential assignment.

          # 120s appear: seen live on #2568 -- the dispatch is accepted and
          # the canary still not visible in /runs 45s later while GitHub's
          # run indexing lags, so the window must cover API lag, not just
          # dispatch latency (the loop exits early when the run appears,
          # so the cost is paid only in the worst case).
          # 420s decide: the canary is tiny, but it rides a queue behind
          # whatever else the box is executing.
          appear_window="${HEARTBEAT_APPEAR_SECONDS:-120}"   # event->run-object lag (API indexing included)
          decide_window="${HEARTBEAT_DECIDE_SECONDS:-420}"   # queue+exec budget on the box
          poll_every="${HEARTBEAT_POLL_SECONDS:-10}"

          # #2849: how long a canary result stays usable as evidence for a
          # *different* router. This is the knob that stops the probe storm.
          #
          # The probe measures the box, not the branch, so one canary can
          # vouch for every router running against that box in its wake.
          # Without this, every workflow on every PR dispatches its own:
          # a 20-PR fan-out over ~4 routing workflows is ~80 canaries, all
          # queued on the same executors as the jobs they gate, so the
          # busier the box the more likely each router is to time out and
          # declare it *offline* -- backwards, and self-reinforcing. That
          # is #2849, and it is why an all-self-hosted-capable run went
          # entirely GitHub-hosted while five runners sat there executing
          # jobs and every canary completed successfully.
          #
          # The cost of reuse is staleness: a box that dies immediately
          # after a successful canary keeps being vouched for until the
          # window expires, and jobs routed there queue until their own
          # timeout. 300s bounds that, and is still long enough to collapse
          # a fan-out onto one probe. Fail-safe is preserved in the
          # direction that matters -- no *failed* or absent canary is ever
          # reused as evidence of life.
          fresh_window="${HEARTBEAT_FRESH_SECONDS:-300}"    # reuse TTL for another router's canary

          if [[ "$trusted" == "true" && "${FORCE_GITHUB_HOSTED}" != "true" ]]; then
            api="repos/$GITHUB_REPOSITORY/actions/workflows/ci-heartbeat.yml"
            # The dispatch API needs a real ref. For pull_request runs
            # GITHUB_REF_NAME is the ephemeral "<n>/merge" merge ref that no
            # branch backs, so dispatching there is refused with 422 "No ref
            # found for" -- seen live on #2568, and it would have routed
            # every same-repo PR to the fallback forever. Same-repo PRs
            # therefore dispatch at the PR's head branch (whose
            # ci-heartbeat.yml is the branch's own; fork PRs never get this
            # far, trusted=false). push/workflow_dispatch/schedule carry a
            # real branch in GITHUB_REF_NAME already.
            # Never dispatch at a pull request's head ref: that would let
            # the PR supply the workflow definition run on the persistent
            # runner. Only trusted (reviewed) events reach this block, and
            # for those GITHUB_REF_NAME is a real branch or tag.
            dispatch_ref="$GITHUB_REF_NAME"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              dispatch_ref=""
            fi

            # #2849 phase 0: before dispatching anything, look for a canary
            # that already answers the question. Two shapes count, and the
            # ref they ran on deliberately does not matter -- ci-heartbeat
            # is a no-op job whose only output is "a honeypot-ci runner
            # picked this up", which is a fact about the box.
            #
            # Cross-ref reuse does widen one thing worth naming: a
            # same-repo branch that edits ci-heartbeat.yml can now vouch
            # for other refs' routers, not just its own. That is bounded by
            # the trust gate above -- fork PRs never reach this code, and a
            # same-repo author could already self-vouch by editing the
            # canary on their own branch, which the router has always
            # dispatched at the PR head. So this changes who a bad canary
            # can mislead, not whether one can exist.
            # Both initialised here, not just on the paths that assign
            # them: under `set -u` a later read of an unbound name kills
            # the step, and #2568 was exactly that failure mode in this
            # block. The wait guard below reads both.
            adopted=""
            http=""
            reuse_cutoff="$(date -u -d "$fresh_window seconds ago" +%FT%TZ)"
            runs_json="$(gh api "$api/runs?per_page=50" 2>/dev/null || true)"

            # (a) A recent SUCCESS -- strongest and cheapest evidence.
            # updated_at on a completed run is its completion time, so this
            # asks "did the box finish a canary in the last fresh_window",
            # not "was one started then".
            reusable="$(printf '%s' "$runs_json" | jq -r --arg cutoff "$reuse_cutoff" '
              [.workflow_runs[]
               | select(.event == "workflow_dispatch"
                        and .status == "completed"
                        and .conclusion == "success"
                        and .updated_at >= $cutoff)
               | .id][0] // ""' 2>/dev/null || true)"

            if [[ -n "$reusable" ]]; then
              online=true
              echo "heartbeat: reusing successful canary $reusable (finished within ${fresh_window}s); no dispatch"
            else
              # (b) One already in flight -- adopt it rather than adding to
              # the queue it is sitting in. Waiting on a sibling's canary is
              # strictly better than dispatching a second one that must
              # queue behind it.
              adopted="$(printf '%s' "$runs_json" | jq -r --arg cutoff "$reuse_cutoff" '
                [.workflow_runs[]
                 | select(.event == "workflow_dispatch"
                          and .status != "completed"
                          and .run_started_at >= $cutoff)
                 | .id][0] // ""' 2>/dev/null || true)"

              http=""
              if [[ -n "$adopted" ]]; then
                echo "heartbeat: canary $adopted already in flight (started within ${fresh_window}s); waiting on it instead of dispatching"
              else
                # (c) Nothing usable: dispatch our own.
                echo "heartbeat: dispatching ci-heartbeat on ${dispatch_ref:-<none>}"
                if [[ -n "$dispatch_ref" ]]; then
                  # No -f: a refused dispatch must land its HTTP code in $http,
                  # not abort the capture (with -f a 422 printed as "422X").
                  http="$(curl -sS -o "${RUNNER_TEMP:-/tmp}/hb-disp.out" -w '%{http_code}' -X POST \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H 'Accept: application/vnd.github+json' \
                    "$GITHUB_API_URL/$api/dispatches" \
                    -d "{\"ref\":\"${dispatch_ref}\"}" || true)"
                fi
                [[ "$http" == "204" ]] \
                  && echo "heartbeat: dispatch accepted" \
                  || { echo "::warning::heartbeat dispatch refused (HTTP ${http:-none}); routing fallback"; http=""; }
              fi
            fi

            # cutoff predates the dispatch by 2min so minor runner/GitHub
            # clock skew cannot out-veto a real fresh run. Must be assigned
            # BEFORE the wait loop -- under set -u an unbound $cutoff kills
            # the pipeline subshell every poll iteration and the result
            # silently stays empty (live on #2568: canaries succeeded while
            # every router still concluded offline because this line was
            # dropped in the dispatch-ref edit).
            cutoff="$(date -u -d '2 minutes ago' +%FT%TZ)"

            # #2849: one wait, for the thing actually being waited on -- a
            # canary that reaches SUCCESS after the cutoff. This replaces
            # the previous appear-then-follow pair, which latched onto the
            # first in-flight run object it saw and then tracked only that
            # id: if the run it picked was a sibling's that later failed or
            # was cancelled, the router concluded offline while a different
            # canary succeeded seconds later. Asking the question directly
            # ("has any canary succeeded since the cutoff?") is both
            # simpler and strictly more accurate, and it means an adopted
            # in-flight run needs no separate code path.
            #
            # The window is the sum of the two former phases, so the
            # worst-case router cost is unchanged and still bounded well
            # inside this job's timeout-minutes.
            #
            # ci-heartbeat.yml deliberately carries no concurrency group:
            # cancelling a sibling's canary would un-vouch exactly the
            # evidence some other router is waiting on here.
            if [[ "$online" != "true" ]]; then
              if [[ -z "$adopted" && "$http" != "204" ]]; then
                # Nothing in flight to wait for and our own dispatch was
                # refused, so no canary is coming. Waiting the full window
                # for a run that cannot exist just burns router minutes.
                echo "heartbeat: no canary dispatched or adopted; not waiting"
              else
                deadline=$(( $(date +%s) + appear_window + decide_window ))
                while [[ "$(date +%s)" -lt "$deadline" ]]; do
                  # system jq (not `gh api --jq`, which cannot bind
                  # variables) so the cutoff is a proper parameter.
                  runs_json="$(gh api "$api/runs?per_page=50" 2>/dev/null || true)"
                  ok="$(printf '%s' "$runs_json" | jq -r --arg cutoff "$cutoff" '
                    [.workflow_runs[]
                     | select(.event == "workflow_dispatch"
                              and .status == "completed"
                              and .conclusion == "success"
                              and .updated_at >= $cutoff)
                     | .id][0] // ""' 2>/dev/null || true)"
                  if [[ -n "$ok" ]]; then
                    online=true
                    echo "heartbeat: canary $ok succeeded"
                    break
                  fi
                  sleep "$poll_every"
                done
              fi
            fi
            echo "heartbeat verdict: online=$online"
          fi

          homeserver=false
          if [[ "$trusted" == "true" && "$online" == "true"
                && "${FORCE_GITHUB_HOSTED}" != "true" ]]; then
            homeserver=true
          fi

          {
            echo "trusted=$trusted"
            echo "online=$online"
            echo "forced_cloud=${FORCE_GITHUB_HOSTED:-<unset>}"
            echo "executor=$( [[ "$homeserver" == true ]] && echo honeypot-ci || echo ubuntu-latest )"
          } >>"$GITHUB_STEP_SUMMARY"

          echo "homeserver=$homeserver" >>"$GITHUB_OUTPUT"
