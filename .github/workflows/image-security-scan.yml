name: Container base image security scan

# #2316: closes the "nothing watches container base images for advisories"
# gap Dependabot's docker updater cannot close on its own. Confirmed against
# this repo's own Dependabot PR history: every digest-pinned docker-ecosystem
# PR examined (#1813, #1518, #1116, #1070, #855, #854, #853, #852) paired a
# digest change with a tag/version-string change -- none was a same-tag
# digest-only refresh. A base image rebuilt under an unchanged tag (a
# security patch to alpine:3.24, say) is invisible to Dependabot forever.
# Trivy scans the resolved image directly, so it catches that class of drift
# regardless of whether a newer tag exists.
#
# scripts/list-docker-base-images.py walks every Dockerfile/Containerfile in
# the tree itself (not dependabot.yml's `directories:` list), so this also
# covers every directory #2316 found missing from dependabot's docker
# section, and the vendored/floating-tag cases (sandbox/ghosts's vendored
# dotnet SDK images) that a tag-based updater cannot pin without breaking
# VENDORED.md's verbatim-upstream protocol -- scanning whatever they
# currently resolve to still catches a known CVE in wide use.

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile*"
      - "**/Containerfile*"
      - "scripts/list-docker-base-images.py"
      - ".github/workflows/image-security-scan.yml"
  # #3923: on a pull request the gate is PR-scoped (see the listing step),
  # so it also runs when a compose file changes: a compose `image:` the PR
  # adds is a base image the PR adds. Push to main and the schedule keep the
  # Dockerfile-only trigger plus the full scan.
  # #3964: no path filter here. The gate is a required check, and a required
  # check that a path filter skips never reports, which leaves the PR pending
  # forever. A PR that adds or changes no image reference finishes the scan
  # job in seconds with nothing to measure.
  pull_request:
  schedule:
    # Same slot as dependabot.yml's docker section (Monday 04:45
    # Europe/Berlin) so a base-image advisory and a tag-bump proposal land
    # in the same operator sweep instead of two different days.
    - cron: "45 3 * * 1"

# #3313: workflow level defaults to none; each job declares what it spends.
# The ci-target router dispatches the ci-heartbeat canary with GITHUB_TOKEN,
# and a called reusable workflow can never exceed the caller's envelope --
# under-granting it startup-fails the whole run as "Invalid workflow file",
# so that one grant stays on ci-target and reaches no other job.
permissions: {}

jobs:
  ci-target:
    name: Pick CI executor
    uses: ./.github/workflows/ci-router.yml
    permissions:
      contents: read
      actions: write
    with:
      ci_homeserver_prs: ${{ vars.CI_HOMESERVER_PRS || '' }}

  scan:
    name: Scan base images${{ needs.ci-target.outputs.homeserver != 'true' && ' (GitHub-hosted)' || '' }}
    needs: [ci-target]
    runs-on: ${{ needs.ci-target.outputs.homeserver == 'true' && fromJSON('["self-hosted", "linux", "x64", "honeypot-ci"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: ${{ needs.ci-target.outputs.homeserver == 'true' && 60 || 360 }}
    permissions:
      contents: read
    steps:
      # #3923: a pull request is scanned against its merge-base, so the
      # checkout is the PR head (not the synthetic merge commit, whose tree
      # also carries whatever main gained since the branch point) with the
      # history merge-base needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      # #2763: compose_pulled_images() needs PyYAML to parse compose files
      # correctly (anchors, multi-line values) rather than a regex that would
      # rot the same way the coverage gap it closes did.
      #
      # Install only if it is actually missing. The weekly cron is
      # trusted=true, so it routes to the self-hosted runner, whose
      # interpreter is PEP 668 externally-managed
      # (/usr/lib/python3.14/EXTERNALLY-MANAGED). There, a plain
      # `pip install` refuses and exits non-zero -- which under this step
      # would kill the job before it listed a single image. PyYAML 6.0.3 is
      # already present on that host, so the guard makes this a no-op there
      # and a real install on the GitHub-hosted runner.
      - name: Ensure PyYAML is available
        run: |
          if python3 -c 'import yaml' 2>/dev/null; then
            python3 -c 'import yaml; print("PyYAML " + yaml.__version__ + " already present")'
          else
            pip install --quiet pyyaml
          fi

      # #3321: the pin lives in scripts/install-trivy.sh, shared with the
      # digest-bound SBOM scan in containers.yml. The script installs into
      # $RUNNER_TEMP, which the self-hosted honeypot-ci runner can write to.
      # It runs before the gate step on purpose: the gate calls trivy.
      - name: Install trivy
        run: scripts/install-trivy.sh

      # #3964: one script, two scopes, no exemptions. See
      # scripts/check-base-image-gate.py and docs/CI-CD.md ("Base-image CVE
      # gate").
      # - pull_request: each image reference the PR adds is scanned and must
      #   be clean; each reference it changes (same repository, new tag or
      #   digest) is scanned at both digests and passes only if the new one has
      #   no more fixable CRITICAL/HIGH findings and no CRITICAL CVE the old one
      #   lacked. A PR that touches no image reference measures nothing.
      # - push to main / schedule / manual: every base image the repo pulls
      #   must be clean. Upstream drift on unchanged pins turns this red (#3923).
      # The PR head is checked out, not GitHub's synthetic merge commit, so the
      # "added" set is what the PR itself introduces.
      - name: Measure base images and apply the gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base-image-gate"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            merge_base=$(git merge-base "$PR_BASE_SHA" HEAD)
            echo "PR gate: refs added or changed since merge-base $merge_base"
            python3 scripts/check-base-image-gate.py --mode pr --base-rev "$merge_base" \
              --workdir "$RUNNER_TEMP/base-image-gate" \
              --report "$RUNNER_TEMP/base-image-gate/report.json"
          else
            python3 scripts/check-base-image-gate.py --mode full \
              --workdir "$RUNNER_TEMP/base-image-gate" \
              --report "$RUNNER_TEMP/base-image-gate/report.json"
          fi

  # #3964: the required check. `scan` is skipped or red on its own when the
  # runner or the router breaks, and a skipped job counts as passing for
  # GitHub, so this aggregate fails unless every needed job succeeded.
  scan-gate:
    name: Base-image scan gate
    if: always()
    needs: [ci-target, scan]
    runs-on: ubuntu-latest
    # No permissions block on purpose, as in containers-gate: the job reads
    # only the two `needs:` results.
    steps:
      - name: Fail unless the router and the base-image scan succeeded
        env:
          ROUTER: ${{ needs.ci-target.result }}
          SCAN: ${{ needs.scan.result }}
        run: |
          if [ "$ROUTER" != "success" ] || [ "$SCAN" != "success" ]; then
            echo "::error::ci-target=$ROUTER scan=$SCAN"
            exit 1
          fi
