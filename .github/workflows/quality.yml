              #
              # Run in the scanner's own base image rather than against the runner's
              # apt yara: "does it compile" is only a useful answer from the
              # compiler that will actually load it, and the two versions differ.
              # The image is read from the Dockerfile so a base bump moves CI too.
              image="$(awk '/^FROM /{print $2; exit}' arcane/home/honeypot-payload-analysis/analysis/yara/Dockerfile)"
              echo "validating against $image"
              docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/w" -w /w "$image" sh -c '
                apk add --no-cache bash git yara >/dev/null
                yara --version
                scripts/check-yara-corpus.sh
                yara -w arcane/home/honeypot-payload-analysis/analysis/yara/rules/index.yar /dev/null
                arcane/home/honeypot-payload-analysis/analysis/yara/tests/test_sync_yara.sh
              '

          - name: Rev-eng benchmark corpus is reproducible and safe (#159)
            home: true
            run: |
              # Runs in the corpus's own documented build environment
              # (debian:trixie-slim, matching corpus/README.md's "Rebuilding"
              # section exactly), not the runner's own toolchain — the whole
              # point is verifying that THIS environment reproduces the
              # committed manifest.json byte-for-byte, which only means
              # something if it is the same environment the corpus claims
              # provenance against.
              # -e PYTHONDONTWRITEBYTECODE=1: the container runs as root against
              # this bind-mounted workspace, and root-owned __pycache__ left
              # behind here breaks actions/checkout's clean step for every later
              # job on this runner (EACCES on unlink). ci_verify.sh exports it
              # too -- belt and braces, since it is equally true of any other
              # caller that runs it as root in a mount.
              docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/w" -w /w debian:trixie-slim bash -c '
                analysis/ghidra/benchmarks/corpus/ci_verify.sh
              '

          - name: Validate home and VPS Compose
            home: true
            run: |
              cp .env.example .env
              cp vps/.env.example vps/.env
              docker compose -f docker-compose.yml config --quiet
              # honeypot-init is a separate Dockge stack (#111) that attaches to
              # APIARY's honeynet network and two of its named volumes by
              # external reference; config validation does not require those to
              # actually exist, so no APIARY setup is needed here either.
              docker compose -f arcane/home/honeypot-init/compose.yml config --quiet
              # The modernization-port ("next" profile) services validate
              # along with the rest — config resolves every service
              # regardless of profile gating, profiles only affect `up`.
              # Split apart since #1622: honeypot-dashboard-backend
              # resolves backend-service:8081 against the sibling stack by
              # bare service-name DNS at runtime (shared honeynet
              # network), which config validation doesn't need to prove.
              docker compose -f arcane/home/honeypot-dashboard/compose.yml config --quiet
              docker compose -f arcane/home/honeypot-dashboard-backend/compose.yml config --quiet
              docker compose -f vps/docker-compose.yml config --quiet
              # The sandbox gateway is never started here — it answers live malware
              # on an isolated bridge that does not exist on a CI runner. Validating
              # it still matters: run_sample.py shells out to this file mid-detonation,
              # and a syntax error would surface as a failed run on the analysis host.
              docker compose -f docker-compose.sandbox.yml config --quiet
              # Same reasoning for the analysis host: not started here, but
              # install-analysis-host.sh runs it unattended on a box with a GPU and
              # captured malware on it. Both the base file and the GPU overlay,
              # because the overlay is only ever used on top of the base one.
              docker compose -f analysis/ghidra/docker-compose.ghidra.yml config --quiet
              docker compose -f analysis/ghidra/docker-compose.ghidra.yml \
                -f analysis/ghidra/docker-compose.ghidra.gpu.yml config --quiet
              # #66's base file is synthetic and network-isolated. Validate both
              # #83 overlays, but start neither worker nor model in CI.
              docker compose -f llm-worker/docker-compose.yml config --quiet
              docker compose -f llm-worker/docker-compose.yml \
                -f llm-worker/docker-compose.synthetic-canary.yml config --quiet
              docker compose -f llm-worker/docker-compose.yml \
                -f llm-worker/docker-compose.production-session-canary.yml config --quiet
              docker compose -f llm-worker/docker-compose.yml \
                -f llm-worker/docker-compose.captured-data.yml config --quiet
              # #2225: docker-compose.captured-data-deploy.yml (#1751) is the
              # entrypoint live redeploys authorized under #83 actually run --
              # `include:`, not a stacked `-f base -f overlay` pair, so
              # neither line above proves anything about it. Unvalidated, a
              # bad include path or an invalid key sails through both and
              # first surfaces as a failed (or silently mis-scoped) live
              # redeploy, which is how #1751's incident happened.
              docker compose -f llm-worker/docker-compose.captured-data-deploy.yml config --quiet
              # Syntactic validity alone isn't enough: stripping an include
              # (e.g. losing docker-compose.captured-data.yml) still resolves
              # to valid, synthetic-only config. So does keeping both includes
              # but listing them as two separate `include:` entries instead of
              # one list-valued `path:` -- separate entries are independent
              # models, the first to claim services.llm-worker keeps it, and
              # the base's deliberate `ES_HOST: ''` wins. That is what this
              # check caught on its first run. Resolve exactly the one file
              # the live deploy points at -- adding `-f base -f overlay`
              # alongside it would supply the authorization from the command
              # line and prove nothing about the include chain. Assert the
              # resolved model still carries what this file exists to record.
              resolved="$(docker compose -f llm-worker/docker-compose.captured-data-deploy.yml config --format json)"
              es_host="$(jq -r '.services["llm-worker"].environment.ES_HOST // empty' <<<"$resolved")"
              if [ -z "$es_host" ]; then
                echo "::error::captured-data-deploy.yml resolved with empty ES_HOST -- the captured-data authorization overlay is not being applied (#2225)"
                exit 1
              fi
              for net in honeypot-llm-data honeypot-llm; do
                if ! jq -e --arg n "$net" '.networks | to_entries[] | select(.value.name == $n)' <<<"$resolved" >/dev/null; then
                  echo "::error::captured-data-deploy.yml resolved without the $net network attached -- the captured-data authorization overlay is not being applied (#2225)"
                  exit 1
                fi
              done
              for target in /payloads/cowrie /payloads/scripts; do
                if ! jq -e --arg t "$target" '.services["llm-worker"].volumes[]? | select(.target == $t and .read_only == true)' <<<"$resolved" >/dev/null; then
                  echo "::error::captured-data-deploy.yml resolved without a read-only mount at $target -- the captured-data authorization overlay is not being applied (#2225)"
                  exit 1
                fi
              done

          # #2981: these used to be named individually, the same shape #2878
          # fixed for sandbox/windows/orchestrate and sandbox/ghosts/orchestrate
          # -- test_install_ci_runner_instances.py sat unwired and red for days
          # because nothing ran it, and two more files in this directory
          # (test_arcane_retry_failed_sync.py, test_audit_sensor_event_coverage.py)
          # were never run by CI at all. Discovery instead, so the next
          # test_*.py dropped in scripts/tests/ is picked up without a
          # workflow edit.
          - name: scripts/tests suite
            home: true
            run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Needed below by the two dashboard-binary Keycloak integration tests
      # (`go run .` against the real dashboard) -- same version floor as the
      # go-test job, see that job's own go-version comment. Every matrix
      # entry pays this setup cost even though only two of them use it --
      # simpler and more robust than threading a per-entry needs-go flag
      # through the matrix, and setup-go is fast.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
          # Cache only on the GitHub-hosted path -- mirror of this job's
          # own runs-on expression. On the homeserver runners the module
          # cache is already on disk and setup-go's restore cannot unpack
          # over it; see the go-fmt job for the full account.
          cache: ${{ !(matrix.home == true && needs.ci-target.outputs.homeserver == 'true') }}
      - name: ${{ matrix.name }}
        shell: bash
        run: ${{ matrix.run }}

  scripts-and-compose-complete:
    name: Scripts and Compose
    if: always()
    needs: [scripts-and-compose]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check failed
        if: needs.scripts-and-compose.result != 'success'
        run: exit 1

  # #3329: no AI/assistant attribution in PR commits, title or body. A
  # policy that held only by convention -- main collected 461 attributed
  # commits between 2026-08-01 and 2026-09-26. Reads the PR from the event
  # file and its commits from the API, so no PR text passes through a shell
  # and no deep fetch is needed. pull_request only; quality-gate accepts its
  # skip on every other event.
  ai-attribution:
    name: No AI attribution in PR metadata (#3329)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-ai-attribution.py
          sparse-checkout-cone-mode: false
      - name: Check commits, title and body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-ai-attribution.py

  # #3311: the one required status check for this workflow. main's ruleset
  # requires a context that reports on every PR; the jobs above come in
  # homeserver/GitHub-hosted pairs whose names change with the executor, so
  # none of them individually is a stable context. Mirrors
  # go-modules-complete's rule for every pair: the homeserver twin succeeded,
  # or it was skipped and its GitHub-hosted twin succeeded. A new job pair
  # must be added to both `needs:` and PAIRS below, or it is not gated.
  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - ci-target
      - public-safety
      - public-safety-cloud
      - design-lab-readonly
      - design-lab-readonly-cloud
      - go-modules-complete
      - frontend-next
      - frontend-next-cloud
      - frontend-next-browser
      - frontend-next-browser-cloud
      - backend-service
      - backend-service-cloud
      - vendored-theme
      - vendored-theme-cloud
      - scripts-and-compose-complete
      - ai-attribution
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gated job, or its fallback twin, succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          result() { jq -r --arg j "$1" '.[$j].result' <<<"$NEEDS"; }
          fail=0
          single() {
            local r; r="$(result "$1")"
            [[ "$r" == "success" ]] && return 0
            echo "::error::$1: expected success, got $r"; fail=1
          }
          pair() {
            local hs cloud; hs="$(result "$1")"; cloud="$(result "$1-cloud")"
            [[ "$hs" == "success" ]] && return 0
            [[ "$hs" == "skipped" && "$cloud" == "success" ]] && return 0
            echo "::error::$1: expected success or skip+fallback-success; got $hs / $cloud"; fail=1
          }
          single ci-target
          # #3329: pull_request-only by design, so a skip is fine elsewhere.
          if [[ "$EVENT" == "pull_request" ]]; then
            single ai-attribution
          elif [[ "$(result ai-attribution)" != "skipped" ]]; then
            single ai-attribution
          fi
          single go-modules-complete
          single scripts-and-compose-complete
          for p in public-safety design-lab-readonly frontend-next frontend-next-browser backend-service vendored-theme; do
            pair "$p"
          done
          exit "$fail"
