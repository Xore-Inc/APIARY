          # #3314: .github/actionlint.yaml existed but nothing ran actionlint.
          # Blocking. SHELLCHECK_OPTS matches the repo's "high-severity
          # ShellCheck" policy: info-level notes in run: blocks do not fail.
          # Archive checksum is upstream's (actionlint_1.7.7_checksums.txt).
          - name: "Workflow lint (actionlint, #3314)"
            home: true
            run: |
              set -euo pipefail
              tgz="$RUNNER_TEMP/actionlint.tgz"
              curl -fsSL -o "$tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
              echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $tgz" | sha256sum -c -
              tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
              SHELLCHECK_OPTS="-S warning" "$RUNNER_TEMP/actionlint" -color
              # A plain-scalar `name: Foo (bar, #123)` is valid YAML that silently
              # truncates at " #" (a comment) -- eight names were shipping as
              # "Foo (bar," before #3314. actionlint cannot see it; this can.
              if grep -nE '^[[:space:]]*(- )?name: [^"'"'"'].* #' .github/workflows/*.yml; then
                echo "::error::unquoted name: containing ' #' -- quote it, YAML reads the rest as a comment"
                exit 1
              fi
              # #3313: every SHA-pinned third-party `uses:` must carry a full
              # `# vX.Y.Z` comment. zizmor's unpinned-uses audit reads the SHA
              # and ignores the comment entirely, so a pin can be perfectly
              # well-formed and still say the wrong thing: two pins here were
              # labelled `# v7` where the SHA is v7.0.0, and one was labelled
              # `# v6` for a v4.6.2 SHA. A reviewer reading the comment is
              # misled about what a job actually runs, which defeats the point
              # of recording it. Offline and deterministic -- no network, so it
              # cannot flake. Dependabot rewrites both halves of a pin on a
              # bump, so this stays satisfied as versions move.
              if grep -nEo 'uses: +[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+@[0-9a-f]{40}( *# *[^ ]+)?' \
                   .github/workflows/*.yml \
                 | grep -vE '@[0-9a-f]{40} *# *v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::action pin without a full '# vX.Y.Z' comment -- SHA is pinned but its version is not stated, or is stated as a bare major"
                exit 1
              fi

          # #3314: zizmor security audit of the workflows. Fails on every
          # medium+ finding EXCEPT the two rules left in ADVISORY below.
          # #3313 landed the other three (unpinned-uses, excessive-permissions
          # and artipacked) across the whole tree, so they are now dropped
          # from ADVISORY and a regression in any of them is blocking. zizmor
          # publishes no checksum file; the pin below was recorded on first
          # download (2026-09-26).
          - name: "Workflow security audit (zizmor, #3314)"
            home: true
            run: |
              set -euo pipefail
              tgz="$RUNNER_TEMP/zizmor.tgz"
              curl -fsSL -o "$tgz" https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
              echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  $tgz" | sha256sum -c -
              tar -xzf "$tgz" -C "$RUNNER_TEMP" zizmor
              "$RUNNER_TEMP/zizmor" --offline --min-severity medium --format json .github/workflows > "$RUNNER_TEMP/zizmor.json" || true
              python3 - "$RUNNER_TEMP/zizmor.json" <<'PY'
              import collections, json, sys
              # Both remaining advisory rules are Low/High-by-rule but not
              # exploitable as written, and neither is a checkout/pin/permission
              # property -- so #3313 does not own them:
              #
              #   self-repository: the five `uses: ./.github/workflows/ci-router.yml`
              #   calls. zizmor wants the explicit owner/repo/path@ref form; the
              #   local-path form is GitHub's own first-party-reusable-workflow
              #   syntax and is what makes the router pick up edits to the
              #   shared router without a second SHA to bump. Every one of the
              #   five is triggered by pull_request/push/schedule, never by
              #   pull_request_target, so the called workflow is always the
              #   default branch's own file.
              #
              #   dangerous-triggers: main-health-watch.yml's `workflow_run`. It
              #   runs the default branch's copy of the script and never reads
              #   the triggering event: every value it reports comes from a
              #   main-scoped `gh api`/`gh run list` read, and the only
              #   untrusted-looking text it echoes is main's own commit
              #   subjects. Changing the trigger would blind the #3324 alarm
              #   that exists precisely to catch runs nobody started.
              ADVISORY = {"self-repository", "dangerous-triggers"}
              findings = json.load(open(sys.argv[1]))
              by_rule = collections.Counter(f["ident"] for f in findings)
              for rule, n in sorted(by_rule.items()):
                  print(f"{'advisory' if rule in ADVISORY else 'BLOCKING'}  {n:3d}  {rule}")
              blocking = [f for f in findings if f["ident"] not in ADVISORY]
              for f in blocking:
                  loc = f["locations"][0]["symbolic"]
                  print(f"::error::zizmor {f['ident']}: {f['desc']} ({loc['key']})")
              sys.exit(1 if blocking else 0)
              PY

          # #3320: Dockerfile lint, separate from image-security-scan's CVE
          # check. Policy (and why package-version pins are exempt) lives in
          # .hadolint.yaml; fails on warnings and errors. Pinned binary,
          # checksum pinned here -- not fetched next to the download.
          - name: "Dockerfile lint (hadolint, #3320)"
            home: true
            run: |
              set -euo pipefail
              bin="$RUNNER_TEMP/hadolint"
              curl -fsSL -o "$bin" https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
              echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  $bin" | sha256sum -c -
              chmod +x "$bin"
              git ls-files -z | grep -zE '(^|/)Dockerfile[^/]*$' | xargs -0 "$bin" --config .hadolint.yaml

          # #3501: fail CI on a real credential anywhere in FULL git history.
          # scripts/check-git-secrets.py landed in 8cc55aa9 with nothing calling
          # it -- `grep -rn gitleaks .github/workflows/` was empty -- so that
          # commit's "fail CI on a real credential" claim was untrue. This row
          # is what makes it true, and it is the only place gitleaks is on PATH.
          #
          # Its own lane rather than a row on the public-leak side: that check
          # walks `git ls-files`, so it can only ever see the checked-out tree.
          # A credential committed once and deleted in the next commit is
          # still a credential, and this is the gate that sees it.
          - name: "Full-history secret scan (gitleaks, #3501)"
            home: true
            env:
              # #3314 zizmor: never expand an Actions expression into a run: body.
              PR_MERGE_REF: ${{ github.event.number }}
            run: |
              set -euo pipefail
              # The scan's entire claim is FULL history, and actions/checkout
              # defaults to fetch-depth 1 -- so on a pull_request the
              # merge-commit checkout hands gitleaks exactly one commit and the
              # gate passes vacuously. That is the worst failure mode a secret
              # scanner has: green, having measured nothing. Unshallow first,
              # then prove the history is really there before believing a pass.
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                git fetch --unshallow --no-tags origin
              fi
              commits="$(git rev-list --count HEAD)"
              if [ "$commits" -lt 100 ]; then
                echo "::error::secret-scan: only $commits commit(s) under HEAD -- refusing to report a clean scan of a truncated history"
                exit 1
              fi
              echo "secret-scan: scanning $commits commits of full history"
              # Purge remote-tracking refs so the scan's view of history is the
              # commit it was told to scan. checkout's `git clean -ffdx` removes
              # leftover FILES and never stale REFS, so on a reused honeypot-ci
              # workspace refs from earlier PRs survive and both
              # `git log --all` (in the allowlist probe) and gitleaks' object
              # walk read them: two clones of one identical tree measured 120
              # findings (62 under the two allowlisted historical paths) against
              # 23 and 0 for the same tree without them.
              #
              # No pipeline here on purpose. Under `set -o pipefail` a `grep -v`
              # that selects nothing exits 1, which killed the job on a CLEAN
              # runner -- the exact case this exists to make work. Read the refs
              # into a variable instead; an empty one is a valid state, not an
              # error. origin/HEAD stays because update-ref refuses deletes
              # through a symref, and this PR's own merge ref stays because it
              # is the ref the job just checked out.
              #
              # PR_MERGE_REF comes in via env, not inline: zizmor blocks
              # template-injection (an Actions expression in a run: body), and
              # #3314 gates on it. An env: value is a string, not a shell
              # fragment, so nothing is expanded into the script.
              pr_merge_ref="refs/remotes/pull/${PR_MERGE_REF:-}/merge"
              stale_refs="$(git for-each-ref --format='%(refname)' refs/remotes \
                | grep -v -e 'origin/HEAD$' -e "^${pr_merge_ref}$" || true)"
              for ref in $stale_refs; do
                if ! git update-ref -d "$ref"; then
                  echo "::error::secret-scan: failed to delete stale ref $ref"
                  exit 1
                fi
              done
              # Prove the purge did what it claims, so a failed delete can never
              # read as a clean scan.
              leftover="$(git for-each-ref --format='%(refname)' refs/remotes \
                | grep -c -v -e 'origin/HEAD$' -e "^${pr_merge_ref}$" || true)"
              if [ "$leftover" -ne 0 ]; then
                echo "::error::secret-scan: $leftover stale remote-tracking ref(s) survived the purge -- the scan would measure a history this job was not asked to check"
                exit 1
              fi
              # Pinned version + sha256 verified before extraction, unpacked
              # into $RUNNER_TEMP because the self-hosted honeypot-ci runner
              # cannot write /usr/local/bin -- the constraint
              # scripts/install-trivy.sh already works under, and the reason
              # `home: true` is right here: checkout, this workflow's own
              # setup-python, a download into a writable temp dir. No docker,
              # no host state, nothing the metal cannot do.
              # The install has to reach THIS step, not a later one. Each `run:`
              # is its own process, and GITHUB_PATH is applied by the runner to
              # *subsequent* steps -- so `scripts/install-gitleaks.sh` writing
              # it (install-gitleaks.sh:123) left the very next line scanning
              # with a PATH that never had gitleaks on it, which is the exit 2
              # #3516's CI run reported. --print-path names the binary the pin
              # verified; exporting its directory puts it on PATH for the rest
              # of this block. The GITHUB_PATH write stays in the script for
              # later steps -- it is right there, it is just not enough here.
              export PATH="$(dirname "$(scripts/install-gitleaks.sh --print-path)"):$PATH"
              # Prove the propagation before the scan, so a broken PATH fails
              # as "gitleaks missing" next to the install, not as an opaque
              # exit 2 from a scan that never ran.
              command -v gitleaks
              # check-git-secrets.py exits 2 when gitleaks fails TO RUN and 1
              # when it finds something unallowlisted. Both are failures here
              # and neither is softened: under `set -euo pipefail` an exit 2
              # cannot be mistaken for a clean scan, which is the flagged vs
              # unresolved split #2763 forced for trivy. Nothing in this step
              # appends `|| true` or pipes the status away.
              python3 scripts/check-git-secrets.py
              # The gate's own regression suite. It lives in tests/docs/ and
              # the docs-regression row above already collects it, but its
              # four gitleaks-backed tests skip on a box with no binary -- and
              # the docs row has none. This row does, so this is the only place
              # they actually execute in CI; without it the suite would skip
              # forever and quietly stop guarding the gate (#2981's shape).
              python -m pip install pytest
              python -m pytest tests/docs/test_3501_secret_scan_allowlist.py -q

          - name: Shell syntax and high-severity ShellCheck
            home: true
            run: |
              # #2389: use whatever shellcheck already exists -- the
              # honeypot-ci host ships it for its runner user, so the
              # self-hosted leg never touches sudo; only an image without
              # the binary pays apt. No privilege class is added anywhere;
              # the install path is unchanged where it was required.
              command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y shellcheck; }
              # A couple of sandbox/windows/packer/pxe/*.sh files are actually
              # Python (named .sh to match their sibling shell scripts' calling
              # convention, e.g. `packer trigger-callback... .sh`) -- filter to
              # files whose own shebang names a shell, rather than assuming
              # every *.sh is one, so bash -n/shellcheck don't choke on them.
              shell_scripts=()
              while IFS= read -r -d '' f; do
                read -r shebang < "$f" || true
                case "$shebang" in
                  '#!'*/sh|'#!'*/bash|'#!'*env\ sh|'#!'*env\ bash) shell_scripts+=("$f") ;;
                esac
              done < <(find . -name '*.sh' -type f -print0)
              if [ "${#shell_scripts[@]}" -gt 0 ]; then
                printf '%s\0' "${shell_scripts[@]}" | xargs -0 -n1 bash -n
                printf '%s\0' "${shell_scripts[@]}" | xargs -0 shellcheck --severity=error
              fi

