name: Containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# #3313: workflow level defaults to none; each job declares what it spends.
# packages: write belongs to the build job alone -- it is what pushes the
# 18 images to ghcr, and the gate below needs no token at all. The ci-target
# router dispatches the ci-heartbeat canary with GITHUB_TOKEN, and a called
# reusable workflow can never exceed the caller's envelope -- under-granting
# it startup-fails the whole run as "Invalid workflow file" (quality.yml's
# inline router instead elevates at its own job level), so that grant stays
# on ci-target and reaches no other job.
permissions: {}

jobs:
  # Executor routing ("homeserver first, GitHub-hosted fallback") -- the
  # same ci-target decision quality.yml documents in full: trusted events
  # (push to main, tags, workflow_dispatch; same-repo pull_request only
  # when repo variable CI_HOMESERVER_PRS=true) may run on the homeserver,
  # and only if a fresh ci-heartbeat canary proves a honeypot-ci runner
  # actually executable right now. Fork pull_request runs never reach the
  # box and land on GitHub-hosted exactly as before.
  #
  # Unlike quality.yml there is a single matrix job rather than PAIR twins:
  # every row is executor-agnostic (buildx builds and -- on non-PR events
  # -- ghcr pushes work identically under either runner), so the one job
  # just picks its runs-on off the router output. The matrix name carries
  # the "(GitHub-hosted)" suffix on fallback days per quality.yml's pair-
  # naming rule, so a degraded day reads honestly in the checks list.
  # Matrix rows serialize behind the single registered runner instance;
  # the 120-min per-row ceiling only fires on a wedged pickup, mirroring
  # the timeout-minutes-on-homeserver-only convention.
  ci-target:
    name: Pick CI executor
    uses: ./.github/workflows/ci-router.yml
    permissions:
      contents: read
      actions: write
    with:
      ci_homeserver_prs: ${{ vars.CI_HOMESERVER_PRS || '' }}

  # #3597: which of the `scoped: true` rows a pull request has to build.
  # The matrix now holds one row per compose build context (~50 images) and
  # only about nine runners exist, so a PR that touches one context must not
  # queue every image. This job diffs the PR against its base and hands the
  # build job the list of scoped images to build; everything outside a
  # pull_request builds in full. Fail-safe by construction: an unreadable diff
  # or a change to this workflow selects every row. A skipped row still
  # occupies a runner for the few seconds its checkout takes, but runs no
  # buildx setup and no build. The older, unscoped rows are not affected.
  scope:
    name: Scope image builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs the PR's base commit, which a depth-1 checkout
          # does not have.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Select the scoped rows to build
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          python3 -m pip install -q pyyaml
          python3 scripts/check-swarm-images.py scope --event "$EVENT" --base "$BASE_SHA"

  build:
    name: ${{ matrix.image }}${{ needs.ci-target.outputs.homeserver != 'true' && ' (GitHub-hosted)' || '' }}
    needs: [ci-target, scope]
    runs-on: ${{ needs.ci-target.outputs.homeserver == 'true' && fromJSON('["self-hosted", "linux", "x64", "honeypot-ci"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: ${{ needs.ci-target.outputs.homeserver == 'true' && 120 || 360 }}
    permissions:
      contents: read
      # What docker/build-push-action spends on the ghcr push
      # (push: ${{ github.event_name != 'pull_request' }}). Held here
      # rather than workflow-wide so the router job and the gate below
      # carry no package-write token; on a pull_request the rows do not
      # push, and GitHub downgrades the grant to read for fork PRs anyway.
      packages: write
    strategy:
      fail-fast: false
      # #1502: contexts below repointed at arcane/home/honeypot-<name>/ for
      # every image whose stack migrated there (build context now lives
      # self-contained next to its own compose.yml, not at repository
      # root) -- llm-worker/portbridge/vps-portbridge are untouched, their
      # stacks either stayed at their existing self-contained path or are
      # VPS-side and out of #1502's scope entirely.
      matrix:
        include:
          - image: agent-intrusion-worker
            context: arcane/home/honeypot-agent-intrusion-worker/analysis/agent-intrusion-corpus
          - image: backend-service
            context: arcane/home/honeypot-dashboard/backend-service
            # #3321: the two images whose contents had no inventory, so
            # "are we affected?" for a dashboard CVE meant rebuilding or
            # exec-ing into the running container. `sbom: true` opts the row
            # into the digest-keyed CycloneDX + Trivy steps below. Absent on
            # the other sixteen rows, so they build exactly as before.
            sbom: true
            # #3315: the dashboard images (this one only since dashboard-next
            # left with #3749) that now report which commit
            # they were built from -- one compiled into the binary (where
            # /livez and its /healthz alias answer it as `revision`) or baked
            # into the served /build.json, and both on the image's
            # org.opencontainers.image.revision label. Only these two
            # Dockerfiles declare `ARG GIT_SHA`, so only these two rows pass
            # it; the other sixteen would take an unused-build-arg warning
            # per build for an arg they do not read.
            stamp: true
            # #3316: ...and the two images that are actually deployed as
            # long-lived HTTP services are also started and waited on
            # below. `boot_smoke: true` is the reason a build row needs a
            # local image to run, which is a different requirement on each
            # event -- see the `load:` input's comment. The remaining rows
            # are one-shot capture daemons whose whole job is to stay up;
            # there is no entrypoint contract to break and no endpoint to
            # answer, so they keep building exactly as before. (No count
            # here on purpose: #3131 grew this matrix after #3321's
            # comments named a number, and a stale number reads as a
            # fresh fact. The smoke tests assert the row names instead.)
            boot_smoke: true
          - image: cisco-asa-honeypot
            context: arcane/home/honeypot-cisco-asa-honeypot/cisco-asa-honeypot
          - image: citrix-honeypot
            context: arcane/home/honeypot-citrix-honeypot/citrix-honeypot
          - image: conpot
            context: arcane/home/honeypot-conpot/conpot
          - image: dicompot
            context: arcane/home/honeypot-dicompot/dicompot
          - image: dionaea
            context: arcane/home/honeypot-dionaea/dionaea
          - image: dnp3-honeypot
            context: arcane/home/honeypot-dnp3/dnp3-honeypot
          - image: dns-honeypot
            context: arcane/home/honeypot-dns-honeypot/dns-honeypot
          - image: endlessh-honeypot
            context: arcane/home/honeypot-endlessh/endlessh-honeypot
          - image: http-honeypot
            context: arcane/home/honeypot-http/http-honeypot
          - image: llm-worker
            context: llm-worker
          - image: multipot
            context: arcane/home/honeypot-multipot/multipot
          - image: portbridge
            context: portbridge
          - image: rdp-honeypot
            context: arcane/home/honeypot-rdp-honeypot/rdp-honeypot
          - image: sonicwall-sma-honeypot
            context: arcane/home/honeypot-sonicwall-sma/sonicwall-sma-honeypot
          - image: tftp-relay
            context: arcane/home/honeypot-dionaea/tftp-relay
          - image: vps-portbridge
            context: vps/portbridge
          # ---------------------------------------------------------------
          # #3597 (epic #3587): every other compose `build:` context in the
          # repository. Swarm ignores `build:` and a worker node cannot pull a
          # local tag, so each stack has to run `ghcr.io/<owner>/honeypot-<image>`
          # by digest; the rows above only covered part of the tree.
          #
          # `scoped: true` -- on a pull_request these rows build only when the
          # `scope` job finds a changed path inside their context (or this
          # file changed). On main, tags and workflow_dispatch they all build
          # and push, which is what the digest manifest job reads. The older
          # rows above are deliberately not scoped and build every time.
          # `dockerfile:` is relative to the context, exactly as in compose.
          # `also_contexts:` names byte-identical copies that compose builds
          # from a second path; scripts/check-swarm-images.py proves the copy
          # has not drifted. That script also proves, on every PR, that each
          # row builds what its compose `build:` block builds (Dockerfile,
          # target, build args) and that no compose context lacks a row.
          # ---------------------------------------------------------------
          - image: attacker-identity-worker
            context: arcane/home/honeypot-attacker-identity-worker/attacker-identity-worker
            scoped: true
          - image: auth-events-worker
            context: auth-events-worker
            scoped: true
          - image: beelzebub
            context: arcane/home/honeypot-beelzebub/beelzebub
            scoped: true
          - image: canarytokens
            context: arcane/home/honeypot-canarytokens/canarytokens
            scoped: true
          - image: canarytokens-adapter
            context: arcane/home/honeypot-canarytokens/canarytokens-adapter
            scoped: true
          - image: canarytokens-http-router
            context: arcane/home/honeypot-canarytokens/canarytokens-http-router
            scoped: true
          - image: correlator-worker
            context: arcane/home/honeypot-correlator-worker/correlator-worker
            scoped: true
          - image: cowrie
            context: arcane/home/honeypot-cowrie/cowrie
            scoped: true
          - image: elasticpot
            context: arcane/home/honeypot-elasticpot/elasticpot
            scoped: true
          - image: galah
            context: arcane/home/honeypot-galah/galah
            scoped: true
          - image: galah-llm-broker
            context: arcane/home/honeypot-galah/galah-llm-broker
            scoped: true
          - image: ghidra
            context: analysis/ghidra/service
            scoped: true
          - image: ghidra-statictools
            context: analysis/ghidra/statictools
            scoped: true
          - image: ghosts-api
            context: sandbox/ghosts
            dockerfile: Dockerfile.api-prep
            scoped: true
          - image: ghosts-client
            context: sandbox/ghosts
            dockerfile: Dockerfile.client-prep
            scoped: true
          - image: hellpot
            context: arcane/home/honeypot-hellpot/hellpot
            scoped: true
          - image: honeyfs-implant
            context: arcane/home/honeypot-cowrie/honeyfs-implant
            scoped: true
          - image: inetsim
            context: sandbox/windows/gateway/inetsim
            scoped: true
          - image: mailoney
            context: arcane/home/honeypot-mailoney/mailoney
            scoped: true
          - image: ml-worker
            context: ml-worker
            scoped: true
          - image: payload-inventory-worker
            context: arcane/home/honeypot-payload-inventory-worker/payload-inventory-worker
            scoped: true
          - image: reporter
            context: arcane/home/honeypot-utilities/reporter
            scoped: true
          - image: sentrypeer
            context: arcane/home/honeypot-sentrypeer/sentrypeer
            scoped: true
          - image: services-adapter
            context: arcane/home/honeypot-dashboard/services-adapter
            scoped: true
          - image: snare
            context: arcane/home/honeypot-tanner/snare
            also_contexts: arcane/home/honeypot-init/snare
            scoped: true
          - image: tanner
            context: arcane/home/honeypot-tanner/tanner/tanner
            scoped: true
          - image: tanner-phpox
            context: arcane/home/honeypot-tanner/tanner/phpox
            scoped: true
          - image: tanner-redis
            context: arcane/home/honeypot-tanner/tanner/redis
            scoped: true
          - image: tanner-sandbox
            context: arcane/home/honeypot-tanner/tanner/sandbox
            scoped: true
          - image: vault-worker
            context: vault-worker
            scoped: true
          - image: vps-huginn-sidecar
            context: vps/huginn-sidecar
            scoped: true
          - image: vps-p0f
            context: vps/p0f
            scoped: true
          - image: vps-zeek
            context: vps/zeek
            dockerfile: Containerfile
            scoped: true
          - image: yara-scanner
            context: arcane/home/honeypot-payload-analysis/analysis/yara
            scoped: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # #2819: point buildkit at the self-hosted executor's Docker Hub
      # pull-through cache when there is one. This has to be buildkit's
      # own config -- the docker-container driver runs its own containerd
      # and never reads the host daemon's /etc/docker/daemon.json, so a
      # mirror configured there would be silently ignored. The address
      # comes from repo variable CI_REGISTRY_MIRROR (host:port) and is
      # applied ONLY when ci-target actually routed us to the homeserver:
      # a GitHub-hosted fallback runner cannot reach that address, and a
      # mirror it cannot dial turns every base-image resolve into a
      # timeout instead of a pull. Written as a file rather than an
      # inline expression because the "no mirror" case still needs a
      # valid (empty) config -- an unset buildkitd-config would be one
      # more conditional step to keep in sync.
      #
      # #3380 adds a second, stronger gate. The gate above asks "is this a
      # self-hosted executor?"; it cannot ask "does this executor have the
      # mirror?", because CI_REGISTRY_MIRROR is one global value describing
      # a per-host fact and the honeypot-ci pool now spans two boxes. The
      # address is therefore probed here, on the box that is about to use
      # it, and the mirror is written into the config only if it answers.
      # See the comment in the script for why a dead mirror degrades loudly
      # instead of silently.
      - name: Compose the buildkit registry config
        id: buildkit
        env:
          MIRROR: ${{ needs.ci-target.outputs.homeserver == 'true' && vars.CI_REGISTRY_MIRROR || '' }}
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/buildkitd.toml"

          # #3380: CI_REGISTRY_MIRROR is a repo VARIABLE but the fact it
          # names -- "this executor runs a Docker Hub pull-through cache at
          # this address" -- is a property of the BOX. A variable can only
          # be global, and the `honeypot-ci` pool is not one box: since
          # #3379 `precision` is registered into the same pool as a
          # --build-only executor, so the router's homeserver=true can land
          # on either. An address that answers on the homeserver is a dead
          # address on precision, where 172.16.0.1 is precision's own docker0
          # gateway with nothing listening on it.
          #
          # That is what #3380 found: the variable said 172.16.0.1:5555, no
          # executor in the pool had run install-registry-mirror.sh, and
          # buildkit quietly fell back to docker.io -- so the #2819 cache was
          # never in effect, every run pulled every base from Hub directly,
          # and each of the 74 non-scratch FROM lines first paid a
          # connect-refused round trip. Green run, no cache, nothing said so.
          #
          # So the only trustworthy source for a per-host fact is the host:
          # probe the address here, on the executor that is about to use it,
          # before buildkit is told to trust it. `/v2/` is the Docker Registry
          # API base and is exactly the check install-registry-mirror.sh
          # already gates its own success on, so this asks the installer the
          # question it answered, rather than a second, weaker question.
          #
          # A non-200 is treated as "not a usable mirror" rather than
          # "maybe": something else can hold a port (on the homeserver 5555
          # is also where the multipot honeypot listens, on the WireGuard
          # address), and a wrong mirror is worse than none.
          #
          # A dead mirror DEGRADES, it does not fail the run. The cache is an
          # accelerator; the authenticated Hub login below is what actually
          # protects against `toomanyrequests`. Turning a missing accelerator
          # into a red main would be a worse regression than the one #3380
          # reports, and it would contradict the router's own documented
          # fail-safe ("routing can degrade CI's speed, never its pass/fail
          # correctness"). So the config written is the honest empty one and
          # the disagreement is announced -- loudly, in both the run's
          # annotations and its summary -- rather than absorbed silently.
          mirror=""
          if [ -n "$MIRROR" ]; then
            probe="$(curl -sS -o /dev/null -w '%{http_code}' \
              --connect-timeout 5 --max-time 15 "http://$MIRROR/v2/" 2>/dev/null)" \
              || probe="000"
            echo "registry mirror probe: http://$MIRROR/v2/ -> ${probe:-000}"
            if [ "$probe" = "200" ]; then
              mirror="$MIRROR"
            else
              {
                echo "### Docker Hub pull-through cache not in effect"
                echo
                echo "CI_REGISTRY_MIRROR=\`$MIRROR\` is set, but \`http://$MIRROR/v2/\`"
                echo "answered \`${probe:-000}\` on this executor (\`$RUNNER_NAME\`,"
                echo "\`$RUNNER_OS\`). The #2819 pull-through cache is therefore NOT"
                echo "in effect: every base image is being pulled from Docker Hub"
                echo "directly, behind the authenticated login below."
                echo
                echo "The address is a property of the box, not of the repository."
                echo "Either deploy the mirror on this host:"
                echo
                echo '```bash'
                echo "sudo scripts/github-ci-runner/install-registry-mirror.sh \\"
                echo "    --username <hub-user> --token <hub-read-only-PAT>"
                echo '```'
                echo
                echo "or, if no host runs one, say so honestly:"
                echo
                echo '```bash'
                echo "gh variable delete CI_REGISTRY_MIRROR --repo \$GITHUB_REPOSITORY"
                echo '```'
              } >>"$GITHUB_STEP_SUMMARY"
              echo "::warning title=Docker Hub pull-through cache inactive::CI_REGISTRY_MIRROR=$MIRROR is set but http://$MIRROR/v2/ answered ${probe:-000} on this executor, so the #2819 pull-through cache is not in effect and every base image is pulled from Hub directly. Deploy the mirror on this host (scripts/github-ci-runner/install-registry-mirror.sh), or unset CI_REGISTRY_MIRROR so the config honestly says 'no mirror'."
            fi
          fi

          if [ -n "$mirror" ]; then
            # http = true: the mirror is a plain-HTTP service bound to a
            # container-only address on the executor, not a public
            # registry, so there is no certificate to verify. Built with
            # printf rather than a heredoc because a heredoc terminator
            # has to sit at column 0, which is outside this YAML block
            # scalar's indentation.
            printf '%s\n' \
              '[registry."docker.io"]' \
              "  mirrors = [\"$mirror\"]" \
              "[registry.\"$mirror\"]" \
              '  http = true' >"$cfg"
            echo "using registry mirror $mirror"
            cat "$cfg"
          else
            echo '# no registry mirror on this executor' >"$cfg"
            if [ -z "$MIRROR" ]; then
              echo '# CI_REGISTRY_MIRROR is unset -- no executor is claimed to run one'
            fi
          fi
          echo "config=$cfg" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # #3597: a scoped row the PR did not touch skips buildx setup and the
        # build below. Always true for the unscoped rows and for every event
        # that is not a pull_request (the scope job lists them all there).
        if: matrix.scoped != true || contains(fromJSON(needs.scope.outputs.images), matrix.image)
        with:
          # Concurrent matrix rows share the single self-hosted runner
          # instance; without an explicit stop+rm at job end, a builder
          # left mid-flight after a graceful_stop aborts the next row's
          # GHA cache export against the same builder (#2639).
          cleanup: true
          buildkitd-config: ${{ steps.buildkit.outputs.config }}
      # #2819: authenticate to Docker Hub, INCLUDING on pull_request --
      # that is precisely the event where the gap bites. Docker Hub meters
      # anonymous pulls per source IP, all 18 matrix rows leave the
      # homeserver through one address, and the tree carries 74 non-scratch
      # Hub FROM lines, so a single cold run spends roughly three quarters
      # of the ~100/6h anonymous budget and the run after it 429s. The
      # layer cache does not help here: #2771's type=gha scopes store our
      # own layers, never the base image, so every run re-resolves every
      # FROM against the registry. Guarded on the secret being non-empty
      # so a fork pull_request -- which by design cannot see secrets --
      # keeps building anonymously rather than failing on empty creds.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/honeypot-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # #2822: the type=gha layer cache measured 10.59 GB against GitHub's
      # 10 GB per-repository ceiling -- over quota means GitHub is
      # continuously LRU-evicting while the cache is in use, so it was not
      # occasionally missing, it was being actively deleted between runs.
      # On the homeserver executor (the common case -- see ci-target above)
      # there is a persistent local disk right there, so export to
      # type=local under /var/buildx-cache/<runner>/<image> instead: it never
      # touches the GHA quota, never crosses the network, and that box has
      # 7.0 TB free on /var (measured 2026-09-02). The GitHub-hosted
      # fallback path has no persistent disk between runs, so it keeps
      # type=gha -- a cold cache there is the expected cost of falling
      # back, not a regression. type=local has no eviction of any kind, so
      # the prune step below bounds it; without that step this trades one
      # unbounded-growth incident for a slower one.
      - name: Pick cache backend
        id: cache
        run: |
          # scripts/github-ci-runner/provision-buildx-cache.sh (#3606) owns
          # creating /var/buildx-cache for the runner users (/var itself
          # is root:root 0755, so this step cannot create it). Degrade to
          # type=gha rather than `bash -e`-failing all 18 matrix rows if
          # that step has not run on this box yet -- losing the local cache
          # is a slow build, failing here is a Containers outage.
          # A runner executes one job at a time, so its own cache cannot be
          # pruned while another job exports the same image (#3605).
          dir="/var/buildx-cache/$RUNNER_NAME/${{ matrix.image }}"
          # Keep the runner's directories group-writable for cache repair
          # and future runner-account changes on this host.
          umask 002
          if [ "${{ needs.ci-target.outputs.homeserver }}" = "true" ] \
             && mkdir -p "$dir" 2>/dev/null && [ -w "$dir" ]; then
            {
              echo "from=type=local,src=$dir"
              echo "to=type=local,dest=$dir,mode=max"
              echo "dir=$dir"
            } >> "$GITHUB_OUTPUT"
          else
            if [ "${{ needs.ci-target.outputs.homeserver }}" = "true" ]; then
              echo "::warning::$dir is not usable by $(id -un) on $RUNNER_NAME (groups: $(id -Gn)) -- falling back to type=gha. Run scripts/github-ci-runner/provision-buildx-cache.sh as root on this host (#3606)."
            fi
            echo "from=type=gha,scope=${{ matrix.image }}" >> "$GITHUB_OUTPUT"
            echo "to=type=gha,mode=max,scope=${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          fi
      # #3316: build the label list HERE, in a shell, because the newline has
      # to be real. This used to be a single `labels:` expression:
      #
      #   ${{ steps.metadata.outputs.labels }}${{ ... && format('\napiary.ci.build-row={0}-{1}-{2}', ...) || '' }}
      #
      # and GitHub's format() does not interpret \n -- it emits two literal
      # characters, backslash and n. So the text was appended to the END of
      # the previous label's value and apiary.ci.build-row never existed as
      # its own key. The run log shows it exactly as it reached buildkit:
      #
      #   "label:org.opencontainers.image.version": "sha-047a7a3\\napiary.ci.build-row=dashboard-next-36338870116-1"
      #
      # which made the `--filter "label=apiary.ci.build-row=..."` lookup in
      # the boot-smoke step below unmatchable -- every pull_request run
      # failed here, and only the push path ever looked, which is why it
      # went unnoticed. printf %s\n is the only place in this file that can
      # produce an actual line break; an expression cannot.
      #
      # Everything interpolated arrives through env:, never pasted into this
      # run block, for the same zizmor template-injection reason the
      # boot-smoke step below uses.
      - name: Append the boot-smoke build-row label
        id: buildrow
        if: matrix.boot_smoke == true
        env:
          BASE_LABELS: ${{ steps.metadata.outputs.labels }}
          ROW: ${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # The `<<EOF` delimiter form, not a bare printf of `k=v` lines: a
          # bare `key=value` line becomes its OWN step output, so the whole
          # list would arrive as outputs named `org.opencontainers....` and
          # the `labels` key the build-push-action input reads would be
          # absent. The heredoc delimiter is what carries the real newline
          # through into a single multi-line output value.
          {
            echo 'labels<<EOF'
            printf '%s\n' "$BASE_LABELS"
            printf 'apiary.ci.build-row=%s\n' "$ROW"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # id: build -- #3321 reads steps.build.outputs.digest, the pushed
        # manifest digest, to key the dashboard rows' SBOM to the exact image
        # rather than to a tag that can be moved underneath it.
        id: build
        if: matrix.scoped != true || contains(fromJSON(needs.scope.outputs.images), matrix.image)
        with:
          context: ${{ matrix.context }}
          # #3597: compose's `dockerfile:` is relative to the context, this
          # input to the workspace. Empty for the rows that use ./Dockerfile,
          # which build-push-action treats as "not given".
          file: ${{ matrix.dockerfile && format('{0}/{1}', matrix.context, matrix.dockerfile) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          # #3316: the boot-smoke below needs an image it can `docker run`,
          # and the two ways to get one are mutually exclusive here -- a
          # build either pushes it or loads it into the local daemon. On a
          # pull_request there is no push, so `load` is free and the smoke
          # covers forks too (which #3321's SBOM cannot: it needs a pushed
          # digest and so skips PRs entirely). On a push the image is already
          # in ghcr and the step that resolves an image ID pulls that exact
          # digest back down. Unset on the other sixteen rows, so they
          # build byte-identically to before.
          load: ${{ matrix.boot_smoke == true && github.event_name == 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          # The docker exporter does not carry a tag, so a loaded image
          # arrives on the shared executor's daemon anonymous. `docker
          # images` cannot pick it out by name -- and this box runs seven
          # runner users, any of which can be loading an image at the same
          # moment (see the umask note in "Pick cache backend" above), so
          # "newest dangling image" would be a race that boots a
          # neighbour's build. A per-row, per-attempt label is the only
          # handle that is unique to *this* build. Appended only for the two
          # boot-smoke rows: on a push it is redundant (the digest names the
          # image) and the manifest should not carry a CI run id. The
          # `steps.buildrow.outputs.labels ||` is what keeps the other
          # sixteen rows byte-identical: that step is skipped for them, so
          # the output is empty and this falls back to exactly the
          # metadata-action list they have always built with.
          labels: ${{ steps.buildrow.outputs.labels || steps.metadata.outputs.labels }}
          # #3315: the revision this image is built from, for the two rows
          # whose Dockerfile declares `ARG GIT_SHA` (matrix.stamp). It has to
          # be a build arg and not only a label: backend-service compiles it
          # into the binary, and nothing in the shipped image can be edited
          # after the fact without changing the image id. Note that
          # metadata-action already emits its own org.opencontainers.revision
          # for the same image, and both are wired from the same
          # `${{ github.sha }}` here -- so whichever key wins the merge, the
          # label and the compiled-in value cannot disagree about which commit
          # this is. scripts/verify-deploy.sh compares them against origin/main
          # and against the live /healthz.
          build-args: ${{ matrix.stamp == true && format('GIT_SHA={0}', github.sha) || '' }}
          # Scope the layer cache per image (#2771). Without an explicit
          # scope every matrix row defaults to `buildkit`, so all 18
          # concurrent builds read and write ONE shared cache index per
          # ref -- confirmed from the cache listing, which carried exactly
          # one `index-buildkit-1-<hash>` key per git ref rather than one
          # per image. Eighteen parallel `mode=max` read-modify-writes
          # against a single index is a lost-update race: whichever row
          # exports last wins and the rows it overwrote find their layers
          # missing next run. dionaea showed it cleanly -- its apt layer
          # is instruction #1 after a digest-pinned FROM, so nothing can
          # invalidate it, yet it re-ran in 4 of 4 consecutive runs while
          # backend-service's equivalent layer hit. Per-image scopes also
          # keep the over-quota LRU eviction from taking out a
          # neighbour's layers. (#2822 moved the homeserver's export off
          # type=gha entirely, but the per-image scope stays -- the
          # GitHub-hosted fallback still uses it and the local dest= path
          # above is per-image on its own account.)
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
      - name: Prune local buildx cache (#2822)
        # type=local has no eviction of any kind -- run unconditionally
        # (always(), not just on success) so a failed build still gets
        # the chance to trim a cache dir it may have partially written.
        if: always() && steps.cache.outputs.dir != ''
        env:
          CACHE_DIR: ${{ steps.cache.outputs.dir }}
        run: scripts/prune-buildx-cache.sh "$CACHE_DIR"

      # ---------------------------------------------------------------------
      # #3316: start the exact image this row just built, wait for its own
      # healthcheck, and assert the contract its tier answers.
      #
      # The gap: containers.yml built, image-security-scan.yml scanned, and
      # nothing ever ran the result. A passing compile gate and a clean
      # vulnerability scan are both silent about the four things that decide
      # whether a container comes up at all -- the entrypoint, the runtime
      # user, the file layout, and the env contract. The #2183/#2299
      # boot-refusal class ("worker containers refuse to boot") reached
      # production precisely because of that, and was found by hand on a
      # deployed host.
      #
      # By image ID, never by tag: a tag can move underneath the step, so a
      # green smoke on `...:pr-1234` would be a statement about whatever it
      # resolved to at that instant. The ID is what the build just produced
      # and (on a push) exactly what was published under the digest
      # deploy.yml consumes.
      #
      # On the required Containers gate, deliberately: a boot that cannot
      # happen is a bad image, and shipping it is worse than a red run. The
      # two rows that fail this are the two long-lived HTTP services; the
      # other rows are capture daemons with no entrypoint contract and no
      # endpoint to answer, so they are untouched.
      # ---------------------------------------------------------------------
      - name: "Resolve the image ID to boot-smoke (#3316)"
        id: bootsmoke
        if: matrix.boot_smoke == true
        env:
          IMAGE: ${{ matrix.image }}
          # First tag only: metadata-action emits one per ref, and only one
          # of them is the branch build this smoke is about.
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          # Only meaningful when a push actually happened. build-push-action
          # emits a digest even with `push: false`, where it describes the
          # locally built image and names nothing in the registry -- so
          # testing this for non-empty sent every pull_request down the
          # docker-pull path against a tag that was never pushed (#3316).
          # On a pull_request the build loaded the image locally (see the
          # `load:` input), which is the else branch below.
          IMAGE_DIGEST: ${{ github.event_name != 'pull_request' && steps.build.outputs.digest || '' }}
          BUILD_ROW: ${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Everything interpolated arrives through env:, never pasted into
          # this block -- the same form #3321's SBOM step uses, because
          # zizmor's template-injection audit cannot tell an image name from
          # attacker input from the outside.
          if [ -n "$IMAGE_DIGEST" ]; then
            tag=$(printf '%s\n' "$IMAGE_TAG" | head -1)
            ref="$tag@$IMAGE_DIGEST"
            # Three attempts, for the narrow reason #3321's syft fetch
            # needed them: ghcr's read path occasionally trails its write
            # path by a few seconds, and a manifest-unknown here would read
            # as "the image is broken" when nothing is wrong with it.
            for attempt in 1 2 3; do
              if docker pull "$ref"; then
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::ghcr has not served $ref yet (attempt $attempt/3); retrying in 15s"
                sleep 15
              fi
            done
            image_id=$(docker image inspect --format '{{.Id}}' "$ref" 2>/dev/null || true)
            [ -n "$image_id" ] || { echo "::error::could not resolve $ref after 3 attempts"; exit 1; }
          else
            # The docker exporter drops the tag, so the build is found by
            # the label the build step stamped on it -- unique to this
            # matrix row and this run attempt, which matters because the
            # executor's docker daemon is shared.
            # `--all` is required, not cosmetic: the docker exporter drops
            # the tag, so this image is dangling, and `docker image ls`
            # applies the label filter only to tagged images. Without it
            # the filter silently matched nothing and the step failed on a
            # build that had loaded correctly (#3316).
            image_id=$(docker image ls --all --no-trunc \
              --filter "label=apiary.ci.build-row=$BUILD_ROW" \
              --format '{{.ID}}' | head -1)
            [ -n "$image_id" ] || {
              echo "::error::no local image carries label apiary.ci.build-row=$BUILD_ROW -- the build was expected to load one (load: true on pull_request). Nothing to boot-smoke."
              exit 1
            }
          fi
          echo "boot-smoke target for $IMAGE: $image_id"
          echo "image_id=$image_id" >>"$GITHUB_OUTPUT"

      - name: "Boot-smoke backend-service (#3316)"
        if: matrix.boot_smoke == true && matrix.image == 'backend-service'
        env:
          IMAGE_ID: ${{ steps.bootsmoke.outputs.image_id }}
        run: |
          set -euo pipefail
          # A real token rather than APIARY_ALLOW_UNAUTH_DEV=1, so the smoke
          # walks the production boot path -- the #2183 gate satisfied the
          # way a deployment satisfies it -- and the log is not full of the
          # override's warning. Throwaway and loopback-only; generated so
          # the value is obviously not a credential in the tree.
          token=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          # #3700: run-scoped names (both smokes), so concurrent runs on one
          # self-hosted runner never trip the script's refuse-to-reuse guard.
          scripts/boot-smoke-image.sh \
            --image-id "$IMAGE_ID" \
            --name "ci-bootsmoke-backend-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --container-port 8081 \
            --health-timeout 120 \
            --stub-es-env ELASTICSEARCH_URL \
            --env "SERVICE_TOKEN=$token" \
            --expect-status 'backend liveness (/healthz)' /healthz 200 \
            --expect-json 'backend readiness against the stub ES (/readyz)' /readyz \
              'd["ready"] is True and d["cluster"] == "green"'

      # ---------------------------------------------------------------------
      # #3321: digest-bound SBOM for the dashboard images (backend-service
      # only since #3749).
      #
      # Only rows with `sbom: true` reach any of this, and only on events
      # that actually push. A pull_request row builds with `push: false` and
      # `load: false`, so there is no image and no digest to key an inventory
      # to -- the artefact that answers a CVE question is the one that got
      # pushed, and that row's notice below says so rather than leaving the
      # gap unexplained.
      #
      # Failures here are real failures, not warnings: the required
      # Containers gate aggregates this job, and a silently absent inventory
      # is precisely the gap #3321 was filed about. That is also why the
      # publish step degrades (a warning) while this one does not -- the
      # artifact is written before the homeserver copy is attempted.
      # ---------------------------------------------------------------------
      - name: "Generate the digest-bound SBOM (#3321)"
        id: sbom
        if: matrix.sbom == true && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SBOM_DIR: ${{ runner.temp }}/sbom
          # Empty on the GitHub-hosted fallback, where there is no
          # homeserver copy to make -- an ephemeral runner's /var dies with
          # the job, so publishing there would only write a file nobody reads.
          PUBLISH_DIR: ${{ needs.ci-target.outputs.homeserver == 'true' && '/var/image-sbom' || '' }}
        run: |
          set -euo pipefail
          # Everything interpolated arrives through env: rather than being
          # pasted into this block. The values are image names and digests,
          # not attacker input, but zizmor's template-injection audit cannot
          # tell that from the outside and this is the form it asks for.
          tag=$(printf '%s\n' "$IMAGE_TAG" | head -1)
          if [ -z "$tag" ] || [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::no pushed tag/digest for $IMAGE -- an SBOM cannot be keyed to it"
            exit 1
          fi
          mkdir -p "$SBOM_DIR"
          # Three attempts, because the failure this absorbs is real and
          # narrow: the image was pushed moments ago and ghcr's read path
          # occasionally trails its write path by a few seconds, which shows
          # up as a manifest-unknown from syft. Everything after the fetch is
          # local, so a retry costs a second rather than a rebuild.
          for attempt in 1 2 3; do
            if scripts/generate-image-sbom.sh \
                --image "$tag@$IMAGE_DIGEST" \
                --out "$SBOM_DIR/$IMAGE.sbom.json" \
                --name "$IMAGE" \
                --publish-dir "$PUBLISH_DIR"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::syft could not resolve $tag@$IMAGE_DIGEST yet (attempt $attempt/3); retrying in 20s"
              sleep 20
            fi
          done
          echo "::error::could not inventory $tag@$IMAGE_DIGEST after 3 attempts"
          exit 1

      - name: "Scan the SBOM with the pinned Trivy (#3321)"
        # Same flags as image-security-scan.yml's base-image scan, and the
        # same pinned binary via scripts/install-trivy.sh, so a digest's
        # finding and a base image's finding are graded identically. Reading
        # the SBOM rather than the image is what makes the scan and the
        # retained inventory describe the same package set.
        if: matrix.sbom == true && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
          SBOM_DIR: ${{ runner.temp }}/sbom
        run: scripts/scan-image-sbom.sh --sbom "$SBOM_DIR/$IMAGE.sbom.json" --name "$IMAGE" --report "$SBOM_DIR/$IMAGE.trivy.json"

      - name: "Bound the homeserver SBOM store (#3321)"
        if: always() && matrix.sbom == true && github.event_name != 'pull_request' && needs.ci-target.outputs.homeserver == 'true'
        run: scripts/prune-image-sbom.sh /var/image-sbom

      - name: "Upload the digest-bound SBOM as a CI artifact (#3321)"
        if: matrix.sbom == true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Keyed by the digest, not the run: two builds of the same commit
          # produce the same name, and a digest-keyed name is the one an
          # operator can paste into `trivy sbom` to re-grade it. The hex, not
          # the `sha256:` form, because a colon is not a legal artifact-name
          # character.
          name: sbom-${{ matrix.image }}-${{ steps.sbom.outputs.sbom_digest_hex }}
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          # Long enough to cover a CVE that is announced weeks after the
          # build that shipped it. 90 is also the ceiling GitHub allows for a
          # public repository, so this is the longest retention available --
          # a value above the repository's own limit fails the upload rather
          # than being clamped.
          retention-days: 90

  # #3311: the one required status check for this workflow. Matrix row names
  # carry a "(GitHub-hosted)" suffix on fallback days, so no row is a stable
  # context for main's ruleset; this job is. always() so a failed router or
  # row still reports a red gate instead of leaving the check pending.
  containers-gate:
    name: Containers gate
    if: always()
    needs: [ci-target, build]
    runs-on: ubuntu-latest
    # No permissions block on purpose (#3313): this job only reads the
    # two `needs:` results above, which is job metadata rather than an API
    # call, so it inherits the workflow's empty envelope and runs with no
    # token at all.
    steps:
      - name: Fail unless the router and every image row succeeded
        env:
          ROUTER: ${{ needs.ci-target.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$ROUTER" != "success" ] || [ "$BUILD" != "success" ]; then
            echo "::error::ci-target=$ROUTER build=$BUILD"
            exit 1
          fi

  # #3597: the digest manifest phase 3 (#3590) pins swarm stacks from.
  # Matrix rows cannot hand a value to a later job (the last row to write an
  # output wins, and .github/ has no download-artifact), so this job asks the
  # registry instead: every row pushes `:sha-<short>`, a tag that names this
  # exact commit, and `imagetools inspect` returns the digest `docker pull
  # repo@digest` resolves -- the index digest for a multi-platform push, the
  # same value build-push-action reports as `digest`. Runs on every event
  # that pushes, so the manifest also exists for tags and manual runs.
  digest-manifest:
    name: Image digest manifest
    needs: [build]
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve every pushed image to its digest
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m pip install -q pyyaml
          mkdir -p "$RUNNER_TEMP/digests"
          python3 scripts/check-swarm-images.py manifest \
            --owner "$OWNER" --sha "$COMMIT" \
            --out "$RUNNER_TEMP/digests/image-digests.json"
      - name: Upload the digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests
          path: ${{ runner.temp }}/digests/image-digests.json
          if-no-files-found: error
          # Rollback needs the PREVIOUS manifest; 90 is the longest GitHub
          # allows, the same choice the SBOM artifacts make.
          retention-days: 90
