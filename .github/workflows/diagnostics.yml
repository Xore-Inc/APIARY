name: Diagnostics

# Read-only observability for the deployed stacks.
#
# Gate 0 (issue #57) is blocked on restoring SSH/Dockge access to the homeserver,
# but the
# production-home Actions runner is registered on that host and is therefore an
# access path that already exists and is already authorized. This workflow uses
# it to answer the Gate 0 questions — is the Compose stack up, is the VPS
# Suricata mount current, does sensor -> Elasticsearch -> Dashboard still flow —
# without a shell session and without changing any production state.
#
# Every command here must stay read-only. No up/down/restart/build/rm/pull, no
# writes into the stack directory, no secret or address echoed into the log.
#
# #2222: a scheduled run's own red X is the alert -- there is no human
# reading GITHUB_STEP_SUMMARY on a cron trigger (#1225's rationale above).
# That alarm semantics originally reached only two checks (isolation
# invariants, OIDC discovery). Policy as of #2222: on a schedule trigger,
# these degraded states also turn the run red (::error:: + nonzero exit),
# because each is a deterministic, low-flake read (a local mountpoint check,
# a stat'd file age, a same-host curl, or an SSH round trip whose failure
# already means the run produced zero VPS visibility) rather than something
# prone to crying wolf on a transient blip:
#   - dashboard healthz unreachable
#   - source-health unreachable / unauthorized / token missing
#   - VPS Suricata sshfs mount gone
#   - freshest eve-*.json over fifteen minutes old
#   - compiled suricata.rules missing or over twelve hours old
#   - SSH to the VPS failing outright
# Left as report-only, deliberately: Elasticsearch not answering inside its
# own container on the home stack. It is not in the acceptance list #2222
# specifies, and source-health (now fatal) already carries a
# cluster_status field derived from the same Elasticsearch, so a fully-down
# cluster is very likely to already fail that check -- adding a second
# fatal path for the same underlying condition would double-alert without
# adding coverage. A manual (workflow_dispatch) run never turns red for any
# of the above; it keeps the original browsable report-only style, since a
# human is already looking at it.
#
# #3312: this workflow ran 160 consecutive scheduled runs in failure, and the
# red X meant different things in each of them -- a real host fault, a lane
# that had never been able to see anything, a check asking from a vantage
# point the endpoint answers differently to, and a declared, deliberate
# stand-down -- all filed identically, with an ::error:: line that named none
# of them. Nobody triaged it, and that is the whole reason this file now
# has a vocabulary. Every finding is categorised on the way out, into one of
# exactly four categories, and each job ends with a ledger of what it found
# and what kind of thing each finding was:
#
#   fault           a real regression. Fatal, as before.
#   runner-config   the check could not run because of how the runner or this
#                   repository's environment is configured -- a helper not
#                   installed, a sudoers grant not applied, a secret unset.
#                   Still fatal: folding "could not tell" into a pass is the
#                   outcome that makes a check worse than not having it, and
#                   #3283 is what that costs when the lane is dark for six
#                   days. But it is its own category with its own annotation
#                   title, so it reads as an operator command to run rather
#                   than as a broken pipeline.
#   expected        a deliberate, declared absence. Never fatal.
#   unmeasured      the check did not run, and that is not a pass. Fatal.
#
# The vocabulary, and the four-category argument, live in
# scripts/diagnostics-lib.sh, which every step here sources. A check is never
# deleted and no finding is ever folded into a pass to make this run green --
# the only thing this change does is make the run say which of the four
# situations it is in.
#
# Both jobs check the repo out now (#2908). Every other step still reads the
# deployed stack under /opt/stacks/apiary -- the checkout is for the scripts,
# so that a check asks its question with the code that was just fixed rather
# than with a copy refreshed only by a workflow_dispatch-only deploy. For the
# five weeks of #3312 the red X kept naming things #3338 had already fixed
# precisely because the deployed isolation-audit.sh was weeks behind.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Stack to inspect
        type: choice
        required: true
        default: home
        options: [home, vps, both]
  # #1225: the VPS's live traefik/dynamic.yml reverted to the repo's own
  # committed auth.honeypot.example placeholder sometime between 2026-08-02
  # (deploy.yml's own domain-substitution step's last confirmed-successful
  # VPS run) and 2026-08-11 (when it was found live, breaking OIDC
  # discovery for every fresh dashboard container start) -- outside
  # deploy.yml entirely, since that workflow never targeted the VPS at all
  # in that whole window (confirmed via `gh run list` history). Whatever
  # touched the file did so without going through the one place that
  # substitutes the real domain, so the fix isn't "make the substitution
  # step more reliable" (it already was, every time it ran) -- it's
  # catching the *drift* between deploys, which nothing did before this.
  # A schedule trigger on this otherwise on-demand, read-only workflow
  # does exactly that: on(schedule) can't carry workflow_dispatch's own
  # `inputs.target`, so every job below also runs unconditionally for a
  # scheduled trigger (see each job's own `if`).
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: honeypot-diagnostics
  cancel-in-progress: true

jobs:
  home:
    if: github.event_name == 'schedule' || inputs.target == 'home' || inputs.target == 'both'
    runs-on: [self-hosted, linux, x64, honeypot-home]
    environment: production-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect the home Compose stack
        shell: bash
        env:
          DASHBOARD_HEALTH_URL: ${{ vars.DASHBOARD_HEALTH_URL }}
        run: |
          set -uo pipefail
          stack=/opt/stacks/apiary
          # #2222: on a scheduled run, a categorised finding additionally turns
          # the condition into the run's own red X (no human reads
          # GITHUB_STEP_SUMMARY on a cron trigger); on workflow_dispatch it
          # behaves exactly like report().
          is_schedule=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          schedule_failed=0
          # report/alert/note/section and the ledger come from the repo (#3312):
          # five steps in two jobs have to agree on the vocabulary, and a
          # second copy of it in YAML is a second thing to keep in step.
          . "$GITHUB_WORKSPACE/scripts/diagnostics-lib.sh"

          report "# Home stack diagnostics"
          if [ ! -d "$stack" ]; then
            note expected "stack directory" "Stack directory is missing. The home stack has never been deployed to this host, so there is nothing here to inspect -- expected, not a fault."
            exit 0
          fi

          # Dockge runs compose.yml; deploy.yml copies docker-compose.yml onto it.
          compose="$stack/compose.yml"
          [ -f "$compose" ] || compose="$stack/docker-compose.yml"

          section "Compose services"
          if [ ! -f "$compose" ]; then
            report "No Compose file in \`$stack\`."
          else
            report '```'
            docker compose -f "$compose" --project-directory "$stack" ps -a \
              2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || report "compose ps failed"
            report '```'
          fi

          section "Container health"
          report '```'
          docker ps -a --filter 'name=hp-' \
            --format 'table {{.Names}}\t{{.State}}\t{{.Status}}' \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || report "docker ps failed"
          report '```'

          # HP_BIND is an internal WireGuard address; read it, never print it.
          # `$stack` ("/opt/stacks/apiary") is the deploy runner's own repo
          # checkout, not a deployed Compose stack -- it has no .env of its
          # own (#2779), so this read is expected to miss on every run and
          # fall through to the fallback below, which already matches every
          # real stack's HP_BIND value. Actions' default step shell runs
          # with `-e`, so a bare `sed` on a missing file (exit 2, even with
          # stderr suppressed) kills the whole step here instead of falling
          # through -- `|| true` on the substitution keeps this a soft miss.
          bind=$(sed -n 's/^HP_BIND=//p' "$stack/.env" 2>/dev/null | head -1) || true
          bind=${bind:-10.8.0.2}

          section "Dashboard"
          # The new dashboard listens on :19092. Set DASHBOARD_HEALTH_URL
          # in the production-home environment when it moves to another host.
          dashboard_health_url=${DASHBOARD_HEALTH_URL:-http://$bind:19092/healthz}
          if curl -fsS --max-time 10 "$dashboard_health_url" >/dev/null 2>&1; then
            report "healthz: responding"
          else
            alert fault "dashboard healthz" "healthz: **unreachable** — the configured dashboard endpoint did not respond"
          fi

          # #3315: "green, healthy, running the old code" is indistinguishable
          # from a correct deploy by looking at it -- a fresh container, a
          # passing healthcheck and a recent image build all describe the
          # machinery, not the code. Both dashboard images now carry their git
          # revision (#/healthz's `revision` field and
          # org.opencontainers.image.revision), and scripts/verify-deploy.sh
          # compares what is running against what is newest.
          #
          # The expected revision is $GITHUB_SHA rather than a clone's
          # origin/main because this host has no usable one: deploy.yml's
          # rsync into $stack carries --exclude .git/ (see its own step), and
          # Arcane's directory sync has no .git either. On a schedule trigger
          # GITHUB_SHA is the default branch's head, which is exactly the
          # "newest merge" this has to be measured against. For the same
          # reason --behind-days is 0 here: the day-count needs a clone to
          # measure commit age against, and without one it would exit 2
          # ("could not tell") on every run. Degrade to "is this the tip of
          # main" and say so, rather than shipping a check that can only
          # report that it failed to run.
          #
          # Report-only, like the Elasticsearch section: a stale deploy is a
          # scheduling fact, not one of the failures #2222 lists. --warn-only
          # stops the tool's own exit 1 from reddening a scheduled run; its
          # exit 2 is still separated out below, because folding "could not
          # tell" into a pass is the one outcome that would make this section
          # worse than not having it.
          section "Deployed revision"
          verify=$stack/scripts/verify-deploy.sh
          if [ ! -x "$verify" ]; then
            report "not checked: $verify is not on this host yet (it arrives with the merge that adds it)"
          else
            if stamp=$("$verify" --warn-only --repo-root "$stack" \
              --healthz-exec 'docker exec hp-apiary-backend curl -sf http://127.0.0.1:8081/healthz' \
              --image apiary-backend:latest --behind-days 0 "$GITHUB_SHA" 2>&1); then
              printf '%s\n' "$stamp" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              stamp_rc=$?
              printf '%s\n' "$stamp" | tee -a "$GITHUB_STEP_SUMMARY"
              if [ "$stamp_rc" -eq 2 ]; then
                report "could not tell: the deployed revision was not readable (exit 2), which is not a pass"
              else
                report "findings above: the running revision is not verifiably the expected one"
              fi
            fi
            report 'PASS means the running binary was built from the current main tip.'
            report 'A finding means it was not; "not stamped" means the image was built'
            report 'without --build-arg GIT_SHA. Neither reddens this run.'
          fi

          section "Sensor to Elasticsearch to Dashboard"
          # #2096: the Go dashboard's Prometheus /metrics died with it
          # (#1659) -- frontend-next owns :19090 now and answers 307
          # there, so this lane had silently reported "metrics
          # unavailable" on every run since. The same end-to-end evidence
          # comes from backend-service's source-health (total_documents,
          # per-sensor counts, cluster status, dead letters, filebeat,
          # unattributed) through the BFF, authenticated with the service
          # token from the dashboard stack's own .env -- the exact seam
          # verify-stack.py uses. The token is read into a variable and
          # sent as a header; it is never echoed.
          report 'The backend derives these from its own tail plus a live Elasticsearch query,'
          report 'so a coherent set here is the end-to-end pipeline check Gate 0 asks for.'
          report '```'
          # Same class of bug as the HP_BIND read above (#2779): guard against
          # `bash -e` killing the step outright if this file is ever absent,
          # so a missing token falls through to the empty-token branch below
          # instead of aborting before the Elasticsearch/Suricata/Filebeat
          # sections ever run.
          # #3312: the token's .env is root:root 0600 and this runner is not
          # root, so reading it here failed on every run since the stacks
          # moved under /var/dockge. The root-owned helper reads the token
          # and returns only the JSON (install-deploy-runner.sh's sudoers
          # grant); the token never enters this job.
          #
          # The command named below is the narrow one on purpose: it applies
          # the helper and the grant and nothing else, so it does not stop
          # the runner service out from under whichever job is running when
          # the operator reads this. That cost is what left this lane red
          # after #3338 merged -- a full re-run is the only path to the
          # grant, and re-running it safely is an operator's judgement call
          # this workflow cannot make for them.
          helper=/opt/github-ci-runner-helpers/dashboard-source-health.sh
          if ! sudo -n -l "$helper" >/dev/null 2>&1; then
            # #3312: the category is the point. This lane has never been able
            # to see anything on a scheduled run -- the token is root-only and
            # the job is not root -- and it was reported under the same red X
            # as a dead sensor pipeline, which is why the ingest outage in
            # #3283 went unread for six days. It stays fatal (an unmeasurable
            # lane is not a pass), but as a runner-config gap whose fix is the
            # one command below, not as a fault in the pipeline.
            alert runner-config "sensor -> Elasticsearch -> dashboard" "metrics unavailable: $helper is not installed or not granted -- this lane has not been able to measure anything. Apply it with: sudo scripts/github-ci-runner/install-deploy-runner.sh --helpers-only (no runner restart; a full re-run also stops and starts the runner service)"
          elif source_health=$(sudo -n "$helper" 2>/dev/null) \
               && printf '%s' "$source_health" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$source_health" | jq -r '
              "total_documents: \(.total_documents)",
              "cluster_status: \(.cluster_status)",
              (.sensors[] | "sensor \(.sensor): \(.documents) docs [\(.state)], last \(.last_seen // "?")"),
              "dead_letters: \(.dead_letters)",
              "filebeat: \(.pipeline.state)",
              "unattributed_24h: \(.unattributed_24h)"' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # The grant is in place and the helper ran, so this is the
            # pipeline's own answer and not a provisioning gap: the token is
            # wrong (401) or the backend is not answering.
            alert fault "sensor -> Elasticsearch -> dashboard" "metrics unavailable: source-health unreachable or unauthorized (401 = wrong/missing service token)"
          fi
          report '```'
          report 'cluster_status: 1 green, 2 yellow, 3 red. sensor state ACTIVE means the feed'
          report 'is fresh; STALE means it stopped logging.'
          report 'unattributed_24h: events carried over the tunnel that could not be'
          report 'joined back to a real source — the recovery gap #54 measured and #75 closes.'

          section "Elasticsearch cluster"
          report '```'
          docker exec hp-elasticsearch \
            curl -fsS --max-time 10 'http://localhost:9200/_cluster/health?pretty' \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || report "Elasticsearch is not answering inside its container"
          report '```'

          section "VPS Suricata mount"
          # #79: eve.json rotates hourly into eve-<timestamp>.json, so there
          # is no single fixed filename any more. The freshest file is the
          # one still being written; total bytes covers the whole retained
          # window (suricata-log-maintenance.sh prunes past it).
          suricata_dir="$stack/logs/suricata"
          if ! mountpoint -q "$suricata_dir"; then
            alert fault "VPS Suricata mount" "\`logs/suricata\` is **not a mount point** — the sshfs mount from the VPS is gone."
            report "Filebeat and EveBox are reading a stale local directory, if anything."
          else
            report "\`logs/suricata\` is mounted."
          fi
          latest=$(ls -t "$suricata_dir"/eve-*.json 2>/dev/null | head -1 || true)
          if [ -n "$latest" ]; then
            age=$(( $(date +%s) - $(stat -c %Y "$latest") ))
            total=$(du -cb "$suricata_dir"/eve-*.json 2>/dev/null | tail -1 | cut -f1)
            report "\`$(basename "$latest")\`: last written ${age}s ago. Retained eve-*.json total: ${total} bytes."
            if [ "$age" -gt 900 ]; then
              alert fault "VPS Suricata mount" "\`$(basename "$latest")\` was last written ${age}s ago — over fifteen minutes old. Treat the Suricata feed as **stale**."
            fi
          else
            # Report-only, and deliberately not a second alert: when the mount
            # is already gone, "no files" is the same finding seen from the
            # other side, and one cause gets one row in the ledger (#3312).
            report "No \`eve-*.json\` files found."
          fi
          report "$(df -h "$suricata_dir" | tail -1 | awk '{print "VPS filesystem: "$2" total, "$4" available ("$5" used)"}')"

          section "Filebeat"
          report '```'
          docker logs --tail 20 hp-filebeat 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || report "no Filebeat container"
          report '```'

          # #2222: every degraded state above ran through alert() rather
          # than exiting early, so the summary is always complete; the
          # schedule-only red X happens here, after everything has been
          # reported.
          if [ "$schedule_failed" -eq 1 ]; then
            exit 1
          fi

      - name: Isolation invariants (#88)
        # Independent of the previous step: this reads no Compose state and
        # must still run (and be visible as its own pass/fail) even if that
        # step's own unrelated problem recurs.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          is_schedule=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          schedule_failed=0
          . "$GITHUB_WORKSPACE/scripts/diagnostics-lib.sh"
          # #2908: measure how stale the deployed copy is, and report it,
          # because a drifted copy is a real finding even now that the audit
          # no longer depends on it. /opt/stacks/apiary is refreshed only by
          # deploy.yml's rsync step, which is workflow_dispatch-only, so it
          # drifts silently -- it was found 18 days behind main, running a
          # pre-#2839 isolation-audit whose capability-posture section simply
          # did not exist yet. Nothing measured that channel: #2858's drift
          # reporting reads the Arcane gitops-syncs API, which has no record
          # covering this directory at all, so every project could report
          # lastSyncCommit == main while every rsynced script was weeks old.
          #
          # The deployed tree is itself a git clone, so its WORKING TREE can be
          # diffed against origin/main in place -- which catches rsync-applied
          # changes too, not just an un-advanced HEAD.
          #
          # Reported, not fatal: drift is legitimate mid-maintenance, and
          # failing here would hide the audit output this step exists to
          # produce. The point is that it stops being invisible.
          printf '\n## Deployed-tree freshness (#2908)\n\n' >> "$GITHUB_STEP_SUMMARY"
          if git -C /opt/stacks/apiary -c safe.directory=/opt/stacks/apiary \
               fetch -q origin main 2>/dev/null; then
            if git -C /opt/stacks/apiary -c safe.directory=/opt/stacks/apiary \
                 diff --quiet origin/main -- scripts/ 2>/dev/null; then
              printf 'deployed `scripts/` matches `origin/main`.\n' >> "$GITHUB_STEP_SUMMARY"
            else
              drift=$(git -C /opt/stacks/apiary -c safe.directory=/opt/stacks/apiary \
                        diff --stat origin/main -- scripts/ 2>/dev/null | tail -20)
              echo "::warning title=Deployed scripts differ from main::the deployed copy of isolation-audit.sh is not what main has; this step audits the host with the triggering ref's copy instead (see #2908)"
              printf 'deployed `scripts/` DIFFERS from `origin/main` -- anything else on this host that runs a deployed script is still using that copy:\n\n```\n%s\n```\n' \
                "$drift" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            printf 'could not reach origin to compare (offline runner?) -- freshness unknown.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

          printf '\n## Isolation audit\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          # #2908/#3312: the audit runs from this job's checkout, not from
          # /opt/stacks/apiary. A check that audits the host with a stale copy
          # of its own question cannot report a fix as fixed, and that is
          # precisely why the red X kept naming things #3338 had already
          # fixed: the audit that named them had not been redeployed. The
          # audit reads only the host (docker, libvirt, iptables, the
          # stand-down declaration in /etc/apiary), so running it from the
          # checkout changes which questions it asks, not what it asks them
          # about.
          audit_output=$("$GITHUB_WORKSPACE/scripts/isolation-audit.sh" 2>&1) || status=$?
          printf '%s\n' "$audit_output" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          # The audit categorises its own findings and prints its own counts;
          # the ledger takes that line verbatim rather than re-deriving it
          # here, so there is one source of truth for them (#3312).
          audit_categories=$(grep -m1 '^isolation-audit: categories --' <<<"$audit_output" || true)
          audit_unmeasured=$(sed -n 's/^isolation-audit: categories -- \([0-9][0-9]*\) unmeasured.*/\1/p' <<<"$audit_categories")
          audit_unmeasured=${audit_unmeasured:-0}
          if [ "${status:-0}" -ne 0 ] && [ "$audit_unmeasured" -gt 0 ]; then
            # An unread barrier is its own category: "this barrier's status
            # is unknown" is a different claim from "this invariant was
            # violated", and it must never read as a pass.
            alert unmeasured "isolation audit (scripts/isolation-audit.sh)" "$audit_categories -- at least one barrier could not be read at all, which is not a pass"
          elif [ "${status:-0}" -ne 0 ]; then
            alert fault "isolation audit (scripts/isolation-audit.sh)" "$audit_categories"
          elif [ "$audit_unmeasured" -gt 0 ]; then
            # The audit's own verdict is exit 0: not every UNMEAS it prints is
            # one it treats as fatal (AppArmor's is advisory). It is still not
            # an agreement, so it takes a row of its own instead of being filed
            # as clean -- and the exit code stays the audit's to decide, since
            # second-guessing it here would change what the check asks.
            diag_row unmeasured "isolation audit (scripts/isolation-audit.sh)" "$audit_categories -- not fatal to the audit, but an unanswered question rather than an agreement"
          else
            diag_row ok "isolation audit (scripts/isolation-audit.sh)" "$audit_categories"
          fi
          exit "${status:-0}"

      - name: Category ledger (#3312)
        # The triage view, last, and if: always() so it is printed even when
        # the steps above have already reddened the run. Report-only: the
        # fatal signal is each step's own exit status, so this step cannot
        # turn a run red on its own account.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          is_schedule=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          . "$GITHUB_WORKSPACE/scripts/diagnostics-lib.sh"
          diag_ledger_report

  vps:
    if: github.event_name == 'schedule' || inputs.target == 'vps' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: production-vps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure deployment key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/honeypot_vps
          chmod 600 ~/.ssh/honeypot_vps
      - name: Inspect the VPS edge
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -uo pipefail
          # #2222: on a scheduled run, a categorised finding additionally turns
          # the condition into the run's own red X; on workflow_dispatch it
          # behaves exactly like report().
          is_schedule=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          schedule_failed=0
          . "$GITHUB_WORKSPACE/scripts/diagnostics-lib.sh"
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)
          report "# VPS edge diagnostics"
          report '```'
          # #79: the eve.json path here pointed at /root/vps/logs/suricata,
          # which does not exist on the VPS — the real log volume is the
          # absolute host path vps/docker-compose.yml actually mounts,
          # /opt/stacks/apiary/logs/suricata. This block was
          # silently checking a nonexistent file. eve.json also now rotates
          # hourly into eve-<timestamp>.json (see suricata.yaml), so this
          # reports the freshest rotated file plus the retained total and
          # free disk space on the VPS's own partition.
          #
          # #2222: output is captured (rather than piped straight to tee) so
          # the two ruleset states below can be turned into a schedule
          # alert() locally, without changing anything the remote script
          # itself measures.
          #
          # Completion is decided by the "end of vps report" sentinel, not by
          # ssh's exit status. ssh propagates the remote script's status, and
          # that status is whatever its *last* command returned -- previously a
          # `wg show | grep`, which exits 1 whenever WireGuard is down or `wg`
          # is off PATH. That turned a fully delivered report into the
          # "SSH to the VPS failed" alert, i.e. a scheduled red X naming the
          # wrong cause. The sentinel only appears when the script ran to the
          # end, so a genuine connection failure still takes the else branch.
          vps_output=$(ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'cd /root/vps && docker compose -f docker-compose.yml ps -a
             echo
             echo "--- suricata eve-*.json ---"
             dir=/opt/stacks/apiary/logs/suricata
             latest=$(ls -t "$dir"/eve-*.json 2>/dev/null | head -1)
             if [ -n "$latest" ]; then
               stat -c "%n: %s bytes, modified %y" "$latest"
               echo "Retained total: $(du -cb "$dir"/eve-*.json 2>/dev/null | tail -1 | cut -f1) bytes"
             else
               echo "No eve-*.json files found in $dir"
             fi
             echo
             echo "--- suricata ruleset age (#116) ---"
             rules=/var/lib/docker/volumes/vps_suricata-rules/_data/rules/suricata.rules
             if [ -f "$rules" ]; then
               age=$(( $(date +%s) - $(stat -c %Y "$rules") ))
               stat -c "%n: %s bytes, compiled %y" "$rules"
               echo "Age: ${age}s"
               if [ "$age" -gt 43200 ]; then
                 echo "That is over twelve hours old -- check hp-suricata-rules-refresh (docker logs hp-suricata-rules-refresh)."
               fi
             else
               echo "No compiled suricata.rules found at $rules"
             fi
             echo
             echo "--- disk free ---"
             df -h /
             echo
             echo "--- wireguard peers ---"
             wg show 2>&1 | grep -E "interface|latest handshake|transfer" || echo "(no wireguard peer lines -- wg unavailable or no peer handshake)"
             echo "--- end of vps report ---"' 2>&1) || true
          printf '%s\n' "$vps_output" | tee -a "$GITHUB_STEP_SUMMARY"
          if printf '%s\n' "$vps_output" | grep -q -- '--- end of vps report ---'; then
            if printf '%s\n' "$vps_output" | grep -q 'No compiled suricata.rules found'; then
              alert fault "VPS Suricata ruleset" "VPS: compiled suricata.rules is missing."
            elif printf '%s\n' "$vps_output" | grep -q 'over twelve hours old'; then
              alert fault "VPS Suricata ruleset" "VPS: compiled suricata.rules is over twelve hours old."
            fi
          else
            # The sentinel never printed, so the report was not delivered. Every
            # rule above it is then unknown, not fine -- the whole edge is one
            # unmeasurable question, and this row says so once.
            alert unmeasured "VPS edge" "SSH to the VPS failed, or the report did not run to its end sentinel: the ruleset age, the eve files, the disk and the WireGuard peers are all unmeasured, not healthy"
          fi
          report '```'
          if [ "$schedule_failed" -eq 1 ]; then
            exit 1
          fi
      # #1225: catches exactly the drift a scheduled run exists for --
      # the live traefik/dynamic.yml reverting to the repo's own committed
      # placeholder domain independent of (and undetected between) actual
      # deploy.yml runs. Unlike every other step in this job, this one
      # hard-fails (does not just report(1) and continue) so a scheduled
      # run's own red X is the alert -- there is no human reading
      # GITHUB_STEP_SUMMARY on a cron trigger.
      #
      # #2222: "Inspect the VPS edge" can now also exit nonzero on a
      # schedule trigger, and a failed step skips every following step by
      # default -- if: always() keeps this check independent of that one,
      # same reasoning as the home job's "Isolation invariants" step.
      # #3328: the Cloudflare origin certificate Traefik serves is a 2-year
      # Origin CA cert with no automatic renewal, so nothing notices it
      # expiring until every proxied hostname starts failing at Cloudflare's
      # edge (526). Warn 30 days out; renewal is docs/CGNAT-DEPLOYMENT.md's
      # "Origin certificate" section.
      - name: Traefik origin certificate expiry (#3328)
        if: always()
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -uo pipefail
          is_schedule=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          schedule_failed=0
          . "$GITHUB_WORKSPACE/scripts/diagnostics-lib.sh"
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)
          report "# Traefik origin certificate"
          cert=/root/vps/traefik/certs/origin.pem
          # shellcheck disable=SC2029 # $cert is meant to expand on this side
          if ! not_after=$(ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
               "openssl x509 -in $cert -noout -enddate" 2>/dev/null); then
            # Not fatal-by-schedule-gate: there is no expiry to be early for,
            # so this is a plain fault and it fails a manual run too -- which is
            # what the exit 1 below already did.
            alert fault "Traefik origin certificate" "cannot read $cert on the VPS -- Traefik has no origin certificate to serve"
            exit 1
          fi
          not_after=${not_after#notAfter=}
          days_left=$(( ( $(date -d "$not_after" +%s) - $(date +%s) ) / 86400 ))
          report "Expires ${not_after} (${days_left} days left)."
          if [ "$days_left" -lt 30 ]; then
            # #3312: this used to be `report "::error::..."` followed by
            # `[ "${{ github.event_name }}" = "schedule" ] && exit 1`, whose
            # non-schedule case left the step exiting 1 anyway -- the compound
            # was the last command in the block, so a manual run went red for a
            # warning it was explicitly meant to report only. alert() has the
            # schedule gate inside it, so the intent is now the behaviour.
            alert fault "Traefik origin certificate" "the Traefik origin certificate expires in ${days_left} days -- renew it (docs/CGNAT-DEPLOYMENT.md, Origin certificate). A 2-year Origin CA cert does not renew itself: nothing else in the fleet notices until every proxied hostname starts failing at Cloudflare's edge with a 526."
            if [ "$schedule_failed" -eq 1 ]; then
              exit 1
            fi
          fi

      - name: OIDC discovery is reachable (#1225)
        if: always()
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -uo pipefail
          is_schedule=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          schedule_failed=0
          . "$GITHUB_WORKSPACE/scripts/diagnostics-lib.sh"
          ssh_options=(-i ~/.ssh/honeypot_vps -p "${VPS_PORT:-2222}" -o StrictHostKeyChecking=accept-new)
          report "# OIDC discovery check"
          if ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            'grep -q "honeypot.example" /root/vps/traefik/dynamic.yml 2>/dev/null'; then
            alert fault "VPS traefik/dynamic.yml" "traefik/dynamic.yml on the live VPS contains placeholder domains (auth.honeypot.example) -- every Traefik router keyed on the real domain is unreachable. Was this file touched outside deploy.yml's own domain-substitution step? See #1225."
            exit 1
          fi
          if [ -z "$DOMAIN" ]; then
            # A missing secret is a provisioning gap, not a broken endpoint, and
            # it stays report-only as it always was -- but it now says which of
            # the two it is, so nobody reads it as "OIDC is fine".
            note runner-config "OIDC discovery" "DOMAIN secret is not set -- cannot check OIDC discovery reachability, only checked for the placeholder string above. This lane is unmeasured, not passing."
            exit 0
          fi
          url="https://auth.${DOMAIN}/realms/apiary/.well-known/openid-configuration"
          # #3312: probe from the VPS, not from this GitHub-hosted runner.
          # Cloudflare answers 403 to GitHub's runner address ranges while
          # serving the same URL 200 to the VPS, the homeserver and a
          # residential client (verified 2026-09-26); every scheduled run
          # since 2026-08-12 failed here on the runner's vantage point, not
          # on OIDC. The VPS still goes out through public DNS and
          # Cloudflare to Traefik to Keycloak -- the path a real login takes.
          # shellcheck disable=SC2029 # $url is meant to expand on this side
          status=$(ssh "${ssh_options[@]}" "${VPS_USER:-root}@${VPS_HOST}" \
            "curl -s -o /dev/null -w '%{http_code}' --max-time 10 '$url'" 2>/dev/null || echo "000")
          runner_status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo "000")
          report "OIDC discovery HTTP status from the VPS: $status (from this GitHub-hosted runner: $runner_status, informational only)"
          if [ "$status" != "200" ]; then
            if [ "$status" = "000" ]; then
              # No HTTP status at all is a different finding from a status that
              # is not 200: the first is "we could not ask", the second is "the
              # endpoint answered, and not with a discovery document".
              alert unmeasured "OIDC discovery" "OIDC discovery at https://auth.\${DOMAIN}/realms/apiary/.well-known/openid-configuration could not be reached from the VPS (no HTTP response at all), so its status is unknown rather than broken. See #1225."
            else
              alert fault "OIDC discovery" "OIDC discovery at https://auth.\${DOMAIN}/realms/apiary/.well-known/openid-configuration returned $status from the VPS, not 200 -- a fresh dashboard container start will fail outright (newOIDCAuth requires this unconditionally at startup). See #1225."
            fi
            exit 1
          fi

      - name: Category ledger (#3312)
        # Report-only, and last: the triage view of everything the steps above
        # categorised, printed even when they have already reddened the run.
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          is_schedule=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          . "$GITHUB_WORKSPACE/scripts/diagnostics-lib.sh"
          diag_ledger_report
