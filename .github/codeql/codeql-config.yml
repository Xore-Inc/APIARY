name: "APIARY CodeQL config"

queries:
  - uses: security-extended

# analysis/ghidra/service/server.py: manually reviewed. Every path it builds
# is gated by _JOB_ID_RE (^[a-f0-9]{32}$) before use, with an additional
# resolve()+is_relative_to() containment check against DATA_DIR as a second
# backstop -- CodeQL's py/path-injection query doesn't model either as a
# sanitizer (confirmed: tried a same-function regex guard, then the
# containment check, neither cleared its findings -- the containment check's
# own resolve() call became a new flagged sink). Its one regex-search
# feature (query=..., regex=true) runs under a hard wall-clock timeout for
# the same reason py/redos still flags it. This is an internal,
# docker-network-only analysis service with no untrusted job_id source.

# #1506: sandbox/ghosts/vendor/ghosts-src vendors upstream GHOSTS' own repo
# verbatim (pinned commit) so ghosts-api can build through Arcane's directory
# sync. wwwroot/lib/ is GHOSTS' own bundled third-party static JS libraries
# (Font Awesome, SignalR, D3) shipped inside its web UI, not APIARY or GHOSTS
# application code -- CodeQL flagged property-injection/log-injection findings
# inside Font Awesome's and SignalR's own upstream library source, which this
# repo can't fix without diverging from the pinned vendor snapshot.
# #1487: honeyfs-implant/main.go's resolveHoneyfsPath containment check
# (rejects absolute paths, ".." traversal, and any clean-but-still-outside
# result) is what the MkdirAll/WriteFile calls in handleImplant rely on --
# CodeQL's go/path-injection doesn't model it as a sanitizer (confirmed:
# an inline `codeql[go/path-injection]` suppression comment on both flagged
# lines didn't clear the finding either). TestResolveHoneyfsPathRejectsEscapes
# in this same file proves containment holds against 14 traversal shapes
# (absolute paths, single/multi-level "..", mixed traversal, empty/bare
# ".", ...), not just asserted by inspection.
paths-ignore:
  - analysis/ghidra/service/server.py
  - sandbox/ghosts/vendor/ghosts-src/Ghosts.Api/wwwroot/lib
  - arcane/home/honeypot-cowrie/honeyfs-implant/main.go
  - branding/design-lab
  - docs/diagrams/*.html
  # #3588: docs/diagrams/*.html are generated archify viewers (the same
  # viewer runtime inlined into each file next to the diagram data). They
  # are static documentation, not shipped, not served by any route, opened
  # only directly in a browser. CodeQL js/remote-property-injection findings
  # sit inside that generated runtime and recur in every regenerated file;
  # documentation-artifact noise, same class as the playground exclusion.
  # #1763: branding/design-lab/ is the preserved 2026-08-17 design-lab record
  # (restored from preserve-design-lab-1763 branch) and the single home for it
  # since #3310 retired the duplicate copy this exclusion used to name.
  # playground/compare.html is a local-only harness (loads 127.0.0.1:<port>
  # frames into an iframe for side-by-side theme comparison); it is not
  # shipped, not served by any route, and reachable only by opening the file
  # directly in a browser. CodeQL js/html DOM-text findings here are
  # documentation-artifact noise, same class as the ghost vendor exclusion.
