# INetSim configuration for REMnux gateway
# /etc/inetsim/inetsim.conf
# REMnux IP: 10.10.10.1

# Bind all services to all interfaces
service_bind_address  0.0.0.0

# Keep the services running as root (the container's root, with NET_BIND_SERVICE,
# SETUID and SETGID only). The package default drops to the inetsim user, but it
# opens the main and service logs as root first, so the dropped user cannot write
# them: every log line then fails with "Permission denied" (#4005).
service_run_as_user   root

# DNS: resolve everything to REMnux's own IP
start_service dns
dns_default_ip        10.10.10.1
# dns_default_ttl is not an INetSim 1.3.2 option (unknown key, ignored with a warning); the
# DNS answer TTL is the package default.
dns_bind_port         53

# HTTP: serve 200 OK with fake payload for everything
start_service http
http_bind_port        80
http_fakemode         yes
# Every request gets a fake payload: an extension with no http_fakefile mapping falls
# back to this default (without it, fake mode answers 404 to everything).
http_default_fakefile sample.html text/html
# http_static_dir is not an INetSim 1.3.2 option; fake files live in the default
# /var/lib/inetsim/http/fakefiles directory, which the Dockerfile creates.

# HTTPS
start_service https
https_bind_port       443
https_default_fakefile sample.html text/html

# SMTP (exfiltration via email)
start_service smtp
smtp_bind_port        25

# FTP (some malware downloads second stage via FTP)
start_service ftp
ftp_bind_port         21

# IRC (Mirai, older botnets use IRC C2)
start_service irc
irc_bind_port         6667

# Syslog capture
start_service syslog
syslog_bind_port      514

# Logs
# logdir is not an INetSim 1.3.2 option; reports and logs go to the default
# /var/log/inetsim, which docker-compose.sandbox.yml bind-mounts.
