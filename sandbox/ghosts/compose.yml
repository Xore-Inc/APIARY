# sandbox/ghosts/compose.yml — the GHOSTS host stack (#324), deliberately
# isolated from this repo's own docker-compose*.yml stacks, same reasoning
# as CAPE's host-stack issue (#314): GHOSTS is a full platform with its own
# API and database, and folding it in would blur the trust boundary the rest
# of this repo keeps narrow.
#
# ghosts-api + ghosts-postgres only. Frontend, Grafana and n8n are upstream's
# optional operator tooling for GHOSTS' own primary use case (live cyber-range
# exercise management) -- not required for NPC-simulation, and skipped here
# per #324's scope decision. Add them later via a separate compose overlay if
# a concrete need shows up; don't add them speculatively.
#
# Upstream ships no published images, so both services build from CMU SEI's
# own source -- vendored at ./vendor/ghosts-src/ (see that directory's own
# VENDORED.md), not a remote git build context. #1502 originally pinned a
# remote `https://github.com/cmu-sei/GHOSTS.git#<ref>:src` context to the
# v9.0.0 tag's commit SHA instead of the tag name, expecting a SHA to need
# no ref-namespace guessing -- confirmed live (#1502) that didn't help:
# Arcane's own image-prep step resolves a build context's git ref under
# refs/heads/ only, unlike plain `docker build`/BuildKit (which resolves
# either a tag or a SHA fine on its own), and it prefixes refs/heads/ onto
# ANY ref string passed this way, not just tag names -- both attempts
# failed identically ("couldn't find remote ref refs/heads/<ref>"). #1506
# vendors the source instead: no compose-file-level fix exists for Arcane's
# own ref resolution, and a local build context sidesteps it entirely
# (Arcane's directory sync already materializes local files correctly --
# this was never a problem with syncing the compose file itself, only with
# a *remote* git ref inside it). Trades "no local copy of upstream source"
# for "actually buildable through Arcane like every other stack," matching
# #1506's own resolution.
#
# ghosts-api publishes port 5000 on 10.20.30.1 -- virbr-ghosts's own gateway
# address (#325), not the docker-internal 10.90.0.2 an earlier version of
# this file used. That first attempt didn't work: verified live (#325),
# recent Docker versions add a `raw` table PREROUTING rule
# (`ip daddr <container> iifname != <container's own bridge> drop`) that
# blocks routing directly to a container's backend IP from any other
# interface, regardless of what FORWARD/DOCKER-USER rules say -- Docker
# expects cross-network reachability to go through a published port, not a
# raw backend-IP route. Binding to virbr-ghosts's own gateway also means the
# GHOSTS guest needs no separate FORWARD-chain exception at all: it's
# already local traffic to its own default gateway, covered by network-filter.sh's
# ordinary bridge-gateway ACCEPT. Requires the `ghosts` libvirt network
# (network.xml) to exist before this container starts -- Docker fails to
# bind a port to an address that isn't yet configured on the host. Don't
# change this address without updating #325's network.xml/network-filter.sh
# to match -- the same "one fixed, documented address" pattern as RevDeck's
# REVDECK_API_BASE=http://10.8.0.2:19500.
#
# #2444: ghosts-api's route surface is image-prepped by this repo's
# Dockerfile.api-prep (see the build context below): the animations control
# plane and the /api/attack scenario tooling -- upstream operator tooling
# our #324 scope decision excludes, which #2444 additionally showed an
# unauthenticated guest could drive (scheduled server-side GETs to any
# caller-supplied URL, ATT&CK-table wipe-and-reload) -- are deleted before
# dotnet publish, so the running API never serves them at all. What
# legitimately remains on 10.20.30.1:5000 is the client
# enrollment/check-in plane, and network-filter.sh additionally
# source-pins tcp/5000 on virbr-ghosts to the enrolled clients (#2444 /
# #2257's step 1), so non-pinned guests fail closed at the firewall even
# for the routes that do exist. Admitting a new client is a two-place
# change by design: a static <host mac=... ip=.../> entry in network.xml
# and its address in network-filter.sh's GHOSTS_API_CLIENTS, together.
#
# #2257: the accepted residual risk on that socket, written down rather
# than inherited. ghosts-api has no authentication of any kind -- no
# UseAuthentication/UseAuthorization in its pipeline, no [Authorize]
# anywhere, and appsettings.json's InitSettings block
# (scotty@cert.org/Password@1) is bound and then discarded by
# ApiDetails.LoadConfiguration(), so it reads like a credentialed surface
# while gating nothing. Everything the API still serves -- machine
# inventory, timelines, surveys, results, the SignalR hubs -- is therefore
# anonymous to anything that reaches tcp/5000, and the one host allowed
# through the firewall pin is win11-ghosts, the guest we deliberately
# detonate malware on. What #2257 changed is the blast radius, not the
# auth model: Dockerfile.api-prep patches Swagger's middleware out (no
# anonymous endpoint map) and ships ASPNETCORE_ENVIRONMENT=Production (no
# developer exception pages leaking stack traces). What remains accepted
# is that a compromised ghost can still read and rewrite NPC state --
# notably TimelinePartial updates, which silently steer what the NPCs do
# and poison experiments built on that activity. Treat NPC-authored data
# as attacker-influenceable until #2257's step 3 lands a real gate (mTLS,
# a minimal auth middleware, or a docker-side proxy so the raw platform
# never faces the guest net); do not put anything on this API that a
# compromised guest must not read or forge.
#
# #1502: migrated into arcane/home/ghosts/ for Arcane directory-aware Git
# sync (kept its previous sandbox/ghosts/ path's contents together as-is --
# already self-contained, and the build context is a remote git URL, not a
# local Dockerfile, so nothing needed rewriting). name: pinned to the live
# project name.

name: ghosts

services:
  ghosts-postgres:
    # #3720: postgres 16 -> 18, the same image and digest as Keycloak's.
    # 18's image keeps PGDATA under a major-versioned path and mounts the
    # parent, so the volume mount moved with it (mounting the old
    # /var/lib/postgresql/data path makes the 18 entrypoint refuse to start).
    # The volume is a NEW one, ghosts-postgres18-data: 16's on-disk format
    # cannot be opened by 18, and a fresh name leaves any old
    # ghosts-postgres-data volume untouched for rollback. To carry data from
    # a 16 volume: pg_dumpall from a postgres:16 container on the old volume,
    # bring this one up empty, restore with psql (docs/sandbox/ghosts).
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: ghosts
      POSTGRES_USER: ghosts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - ghosts-postgres18-data:/var/lib/postgresql
    networks:
      # Static, not auto-assigned: without this, Docker hands ghosts-postgres
      # 10.90.0.2 first (lowest free address after the .1 gateway) and then
      # ghosts-api's explicit request for that same address fails to start
      # ("Address already in use").
      ghosts_net:
        ipv4_address: 10.90.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghosts"]
      interval: 10s
      timeout: 5s
      retries: 10
    # #2051's autoheal-labels guard flags this service; deliberately not
    # labeled here -- #2747 owns finishing this container's live bring-up
    # (it isn't fully stood up yet) and its own standing compose-vs-running
    # sweep, so the autoheal decision belongs with that work, not this one.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  ghosts-api:
    # Built through this repo's image-prep wrapper rather than upstream's
    # verbatim Dockerfile-api (#2444): same vendored sources, untouched,
    # minus the out-of-scope/unreachable-by-design controller surfaces.
    build:
      context: .
      dockerfile: Dockerfile.api-prep
    depends_on:
      ghosts-postgres:
        condition: service_healthy
    environment:
      # Overrides appsettings.json's hardcoded default connection string
      # (ASP.NET Core's double-underscore env-var config binding).
      ConnectionStrings__DefaultConnection: >-
        Host=ghosts-postgres;Port=5432;Database=ghosts;User Id=ghosts;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env};
    networks:
      ghosts_net:
        ipv4_address: 10.90.0.2
    ports:
      - "10.20.30.1:5000:5000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Throwaway client used only by install-host.sh's enrollment smoke test
  # (`docker compose --profile test run ghosts-client-test`). Never started
  # by a plain `up`; its default config resolves the API via the service
  # name "ghosts-api" on ghosts_net, so it needs no address override.
  ghosts-client-test:
    build:
      context: .
      dockerfile: Dockerfile.client-prep
    profiles: ["test"]
    networks:
      - ghosts_net
    depends_on:
      ghosts-api:
        condition: service_started
    restart: "no"

networks:
  ghosts_net:
    ipam:
      config:
        - subnet: 10.90.0.0/24

volumes:
  ghosts-postgres18-data:
