# honeypot-backend-workers -- #3575 (BFF split, #3579): the sensor-bound Rust
# workers and the local services-adapter as their own homeserver project,
# independent of the old honeypot-dashboard project that also carries the
# legacy frontend-next.
#
# Placement (Xore, #3582/#3592 decisions): both HTTP Rust APIs move to
# precision; every worker below stays on the sensor/Elasticsearch homeserver
# (.250), beside the sensor logs, analyzer spools and named volumes it reads.
# services-adapter stays here because it drives this host's Docker daemon.
# Host bind mounts are a documented exception for these homeserver-pinned
# services (#3592 decision 1).
#
# Image: the CI-built backend from GHCR by tag and digest (#3575), the same
# release the HTTP tier runs, never the local `apiary-backend:latest` tag.
# Both values are host-local (.env) and fail closed at interpolation.
#
# Container names and volume names are unchanged on purpose: topology,
# honeypot-pause.sh, isolation-audit.sh and the operations docs address
# these containers by name, and the existing data volumes are reused, never
# recreated empty. Because the names are fixed, this project and the old
# honeypot-dashboard copies cannot run at the same time (#1628: no
# dual-running workers). Cutover, one service at a time: stop and remove the
# old project's container, then `up -d` the same service here; rollback is
# the reverse. Runbook: README.md in this directory.

name: honeypot-backend-workers

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  # Worker role (#1610): the same apiary-backend image with WORKER_LOOPS
  # enabled and no service port — movable to any docker host that can
  # reach ES (stateless, env-configured). Scale by listing loops per
  # replica.
  #
  # reports-scheduler and user-retention-sweep are deliberately NOT in this
  # list (#2301 audited this file alone and concluded, wrongly, that
  # neither loop was wired anywhere): both moved with backend-service into
  # the sibling honeypot-dashboard-backend stack at the #1622 split and are
  # enabled there instead — see that stack's compose.yml WORKER_LOOPS= line
  # and its comment. Each is a non-atomic ES read-modify-write (due-
  # definitions render / users-doc sweep), so adding them here too would
  # run a second, uncoordinated consumer racing the existing one — the same
  # failure mode #2110 already fixed once for payload-inventory below.
  backend-worker:
    <<: *runtime-defaults
    image: ghcr.io/xore-inc/honeypot-backend-service:${APIARY_BACKEND_VERSION:?set APIARY_BACKEND_VERSION}@${APIARY_BACKEND_DIGEST:?set APIARY_BACKEND_DIGEST}
    container_name: hp-apiary-worker
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=127.0.0.1:8099
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - HONEYPOT_TUNNEL_PEER_IP=${HONEYPOT_TUNNEL_PEER_IP:-10.8.0.1}
      - HONEYPOT_TUNNEL_SENSOR_IP=${HONEYPOT_TUNNEL_SENSOR_IP:-10.8.0.2}
      # #1677: addresses belonging to this fleet, excluded from the
      # dashboard's attacker aggregations. Suricata records `source.ip` as
      # whichever end it saw as the source, so our own hosts appear as
      # "attackers" for both halves of every attacker session and for their
      # own outbound traffic -- the VPS's public address was the #2 attacker
      # at 607,288 events over 48h. The tunnel peer is always excluded
      # whether or not it is listed here. Comma-separated.
      - HONEYPOT_SELF_IPS=${HONEYPOT_SELF_IPS:-}
      # #1610: attacker-identity is pure ES (no host mounts, no local
      # state — durable entities live in attackers-v1), so it fits this
      # already-stateless loop container directly, unlike es-results-
      # importer (needs root+DAC_READ_SEARCH for root-owned result dirs
      # plus a persistent dedup state file — its own separate service).
      # agent-intrusion (#1610): same "pure ES, no host mounts, no local
      # state" shape as attacker-identity above — durable campaign verdicts
      # live in agent-intrusion-campaigns, everything else is recomputed
      # from the rolling fetch window each cycle.
      # correlator (#1610): same shape again — campaigns-v1/attacker-
      # clusters-v1 are fully recomputed from scratch every cycle (pure ES
      # aggregations, no raw-document paging needed at all here, unlike its
      # two siblings above), so it fits this stateless loop container too.
      # threat-intel (#1659): reads THREAT_CIDRS_FILE off the mount below —
      # kept fresh by the threat-cidrs-refresh container in the honeypot-
      # init stack (profiles: [threat-intel], both bind the same host path).
      # zeek-proxy-attribution joins the list: it needs Elasticsearch and
      # nothing else -- no host mounts, no local state -- so it belongs on the
      # stateless worker tier rather than the mounted one.
      # zeek-proxy-attribution resolves the attacker behind a relayed flow.
      #
      # Enabled only after the join was made time-bounded. The first version
      # matched on the relayed key alone and attributed 12,647 documents to
      # whoever last reused the tunnel's ephemeral port; those writes were
      # reverted, and the rule that prevents a repeat is that a portbridge
      # dial must precede the flow it claims to explain. Where no candidate
      # survives that test, the tunnel address is left in place -- an
      # unattributed flow is honest, a wrong attacker is not.
      # #2299: the #2183 boot gate refuses any apiary-backend role that
      # boots without SERVICE_TOKEN, serving or not -- without this line
      # every loop below was restart-looping since its deploy. Same
      # credential the serving siblings already carry (line ~191), just
      # copied onto the loop-only replicas.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      # #2320: the other half of the same gate. Env forwarding is
      # per-service, so an empty-token deployment opts each role out
      # individually -- leaving this off loop-only roles made them
      # crash-loop on [E-SERVICE-TOKEN] while serving roles above booted
      # on APIARY_ALLOW_UNAUTH_DEV=1. check-backend-boot-contract.py
      # fails CI if any WORKER_LOOPS consumer drops either half again.
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      # dashboard-rollups (#2046): same pure-ES shape — writes the three
      # derived rollup indices the overview/map/kill-chain endpoints read;
      # nothing mounted, nothing local, fully disposable/rebuildable.
      # workbench-reconcile (#3685, moved here from backend-service-mounted):
      # the #1801 sweep that times out / re-classifies workbench runs nobody
      # is looking at. It is the one loop here that reads the analyzer spools
      # (marker_state / spool_status_stale / result files) rather than pure
      # ES, and it only ever READS them -- every spool mount below is :ro and
      # the sweep writes only dashboard-workbench-runs-v1 over ES (CAS). Must
      # stay wired in exactly one service (#1628): a second consumer would
      # race the same CAS updates. The homeserver pin is deliberate (#3592
      # decision 2): spools are host paths, so the loop must stay on the
      # tier that owns them when the mounted HTTP API moves to precision.
      - WORKER_LOOPS=alert-notifier,attacker-identity,agent-intrusion,correlator,dashboard-rollups,threat-intel,workbench-reconcile,zeek-proxy-attribution
      - WORKBENCH_RECONCILE_INTERVAL_SECONDS=${WORKBENCH_RECONCILE_INTERVAL_SECONDS:-60}
      - ROLLUP_RUN_INTERVAL_SECS=${ROLLUP_RUN_INTERVAL_SECS:-300}
      - ZEEK_PROXY_ATTRIBUTION_INTERVAL_SECONDS=${ZEEK_PROXY_ATTRIBUTION_INTERVAL_SECONDS:-120}
      - THREAT_CIDRS_FILE=/geoip/threat-cidrs.csv
      - EVIDENCE_WINDOW=${EVIDENCE_WINDOW:-6h}
      - ATTACKER_IDENTITY_RUN_INTERVAL=${ATTACKER_IDENTITY_RUN_INTERVAL:-15m}
      - AGENT_INTRUSION_POLL_INTERVAL=${AGENT_INTRUSION_POLL_INTERVAL:-300}
      - AGENT_INTRUSION_MAX_EVENTS_PER_SOURCE=${AGENT_INTRUSION_MAX_EVENTS_PER_SOURCE:-10000}
      - AGENT_INTRUSION_FETCH_WINDOW_DAYS=${AGENT_INTRUSION_FETCH_WINDOW_DAYS:-10}
      - CORRELATION_WINDOW=${CORRELATION_WINDOW:-168h}
      - CORRELATOR_RUN_INTERVAL=${CORRELATOR_RUN_INTERVAL:-15m}
      - ALERT_WEBHOOK_URL=${HONEYPOT_ALERT_WEBHOOK_URL:-}
      - ALERT_COOLDOWN=${HONEYPOT_ALERT_COOLDOWN:-6h}
      - ALERT_CAMPAIGN_SCORE=${HONEYPOT_ALERT_CAMPAIGN_SCORE:-80}
      # #1750 ingestion-lag alerting. The freshness thresholds are per
      # index and live in worker.rs (derived from each index's own history);
      # these two tune the volume-collapse half. FLOOR_PERCENT is how far
      # below its own weekly baseline an index's last hour may fall before
      # it counts as stalled -- the lowest hour any high-volume index
      # recorded across two healthy weeks was 37% of its median, so 10
      # leaves 3.7x of headroom. MIN_BASELINE is the rate below which a
      # percentage stops meaning anything and freshness alone covers the
      # index.
      - ALERT_INGEST_FLOOR_PERCENT=${HONEYPOT_ALERT_INGEST_FLOOR_PERCENT:-10}
      - ALERT_INGEST_MIN_BASELINE=${HONEYPOT_ALERT_INGEST_MIN_BASELINE:-1000}
      - SANDBOX_ALERT_RISK_SCORE=${SANDBOX_ALERT_RISK_SCORE:-50}
      - LLM_ANALYSIS_ALERT_SEVERITIES=${LLM_ANALYSIS_ALERT_SEVERITIES:-high,critical}
      # #1612 host-local alert signals: log-stream sizes, sandbox/ghidra/
      # cape/github-analysis spool health, and Filebeat stats all need
      # either a bind-mounted host directory or a service URL only this
      # worker container has (see volumes: below) — the Go dashboard read
      # the same paths directly. Windows/GHOSTS sandbox and the three
      # analysis spools stay off (empty var) unless the operator has
      # actually deployed that host-side worker, same as the Go tier.
      - LOG_DIR=/logs
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - SANDBOX_REQUEST_DIR=/sandbox-requests
      - WINDOWS_SANDBOX_RESULTS_DIR=${WINDOWS_SANDBOX_RESULTS_DIR:-}
      - WINDOWS_SANDBOX_REQUEST_DIR=${WINDOWS_SANDBOX_REQUEST_DIR:-}
      - GHOSTS_SANDBOX_RESULTS_DIR=${GHOSTS_SANDBOX_RESULTS_DIR:-}
      - GHOSTS_SANDBOX_REQUEST_DIR=${GHOSTS_SANDBOX_REQUEST_DIR:-}
      - GHIDRA_RESULTS_DIR=${GHIDRA_RESULTS_DIR:-}
      - GHIDRA_REQUEST_DIR=${GHIDRA_REQUEST_DIR:-}
      - GHIDRA_ALERT_RISK_LEVELS=${GHIDRA_ALERT_RISK_LEVELS:-high,critical}
      - GHIDRA_ALERT_ON_CRYPTO=${GHIDRA_ALERT_ON_CRYPTO:-false}
      - CAPE_RESULTS_DIR=${CAPE_RESULTS_DIR:-}
      - CAPE_REQUEST_DIR=${CAPE_REQUEST_DIR:-}
      - GITHUB_ANALYSIS_RESULTS_DIR=${GITHUB_ANALYSIS_RESULTS_DIR:-}
      - GITHUB_ANALYSIS_REQUEST_DIR=${GITHUB_ANALYSIS_REQUEST_DIR:-}
      # #3685: workbench-reconcile also reads the Rev·Deck spool (the only
      # analyzer spool backend-worker did not already see). Empty = inert,
      # same posture as backend-service-mounted's identical pair.
      - REVDECK_REQUEST_DIR=${REVDECK_REQUEST_DIR:-}
      - REVDECK_RESULTS_DIR=${REVDECK_RESULTS_DIR:-}
      - GITHUB_ANALYSIS_ALERT_POSITIVES=${GITHUB_ANALYSIS_ALERT_POSITIVES:-10}
      - FILEBEAT_URL=${FILEBEAT_URL:-http://filebeat:5066}
      - TZ=Europe/Berlin
    volumes:
      - type: bind
        source: /opt/stacks/apiary/logs
        target: /logs
        read_only: true
        bind:
          propagation: rslave
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
      - /var/lib/honeypot-sandbox/requests/pending:/sandbox-requests:ro
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-windows-sandbox/requests/pending:/windows-sandbox-requests:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/requests/pending:/ghosts-sandbox-requests:ro
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-ghidra/requests/pending:/ghidra-requests:ro
      - /var/lib/honeypot-cape/results:/cape-results:ro
      - /var/lib/honeypot-cape/requests/pending:/cape-requests:ro
      - /var/lib/honeypot-github/results:/github-analysis-results:ro
      - /var/lib/honeypot-github/requests/pending:/github-analysis-requests:ro
      # #3685: Rev·Deck spool for workbench-reconcile, read-only.
      - /var/lib/honeypot-revdeck/requests/pending:/revdeck-requests:ro
      - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
      - /opt/stacks/apiary/analysis/threat-intel:/geoip:ro
    networks:
      - honeynet
    # Every *-results dir above is root:root 0700 (same "old Go dashboard
    # ran as root and bypassed file permissions entirely" gap as backend-
    # worker-importer's identical comment below describes) -- root +
    # DAC_READ_SEARCH only, no DAC_OVERRIDE/write capability, matching that
    # service exactly: this one only ever reads results, same as it does.
    user: "0:0"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    deploy:
      resources:
        # 256M OOM-killed this container repeatedly against real production
        # ES data volume during #1628's first-ever live preflight (kernel
        # dmesg: memcg OOM, anon-rss ~254-260MB at kill time, right at the
        # ceiling) -- CI's fixture-sized ES indices never had enough data
        # for any of the four bundled loops (alert-notifier, attacker-
        # identity, agent-intrusion, correlator) to approach this limit.
        # The follow-up 512M bump (matching backend-service/backend-
        # service-mounted) was itself still not enough under sustained
        # real load: live `docker stats` showed it pinned at 508/512MB and
        # 50.22% CPU (its full 0.5-core quota) simultaneously, causing
        # /healthz to miss its 5s timeout on every check -- the container
        # wasn't crashing this time, just too CPU-starved under its own
        # four-loop-plus-HTTP-server workload to answer in time. cpus
        # raised to 1.0 (matching backend-service-mounted, the next
        # smallest allocation of the three backend-image consumers, and
        # this one runs continuous background loops where that one only
        # answers on-demand requests) and memory to 768M -- the host has
        # 16 cores/91G with 69G free, so there was no real reason either
        # limit was ever this tight.
        #
        # 768M itself then proved not enough either: confirmed live
        # (2026-08-22, dmesg cgroup OOM) killed every ~30s on a fresh
        # restart, anon-rss ~778-782MB every single time -- right at the
        # 786432KB (768MiB) ceiling, before a single cycle completed. A
        # fifth loop (threat-intel) had been added since the 768M number
        # above was set without a further bump, and this container gained
        # DAC_READ_SEARCH+root just above (a real, if usually small, extra
        # footprint). 1536M for real headroom this time rather than another
        # minimum-viable guess -- same "no real reason to keep this tight"
        # reasoning as the 768M bump itself already gave.
        #
        # #3675: 1536M then OOM-killed it ~12x/hour once one source pushed
        # ~120k events/hour into honeypot-v2-*. attacker-identity held its
        # whole 6h evidence window as raw JSON hits (~4.5 KB each; 452k
        # hits peaked the container at 2669M). The fetch now folds page by
        # page, so its peak no longer scales with the window. 4096M stays
        # until that build has been verified live: a sync of this stack
        # before the backend image is rebuilt would otherwise bring the
        # old binary back under the old limit. No swap: with the default
        # memswap (2x) the cgroup thrashed 34 GB of block IO in four
        # minutes and starved its own ES requests instead of failing fast.
        limits: {cpus: "2.0", memory: 4096M}
    memswap_limit: 4096M

  # #1610 worker migration: Rust port of the retired Python
  # es-results-importer (removed with the completed cutover — an older git
  # commit is the only way back, deliberately). A separate service from
  # backend-worker, not an extra WORKER_LOOPS entry bolted onto it: this
  # worker needs root + DAC_READ_SEARCH privilege escalation
  # (Ghidra/GitHub-analysis result directories are root-owned host bind
  # mounts a normal container user can't read) plus a persistent local
  # dedup-state file — backend-worker is deliberately unprivileged and
  # stateless-by-design (see its own compose comment: "movable to any
  # docker host... state in ES"), and every other loop running there
  # (alert-notifier, reports-scheduler, user-retention-sweep) needs neither.
  # Also separate from backend-service-mounted (that boundary is about
  # WRITE access to host request spools; this one only ever reads results).
  backend-worker-importer:
    <<: *runtime-defaults
    image: ghcr.io/xore-inc/honeypot-backend-service:${APIARY_BACKEND_VERSION:?set APIARY_BACKEND_VERSION}@${APIARY_BACKEND_DIGEST:?set APIARY_BACKEND_DIGEST}
    container_name: hp-apiary-worker-importer
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=127.0.0.1:8098
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - HONEYPOT_TUNNEL_PEER_IP=${HONEYPOT_TUNNEL_PEER_IP:-10.8.0.1}
      - HONEYPOT_TUNNEL_SENSOR_IP=${HONEYPOT_TUNNEL_SENSOR_IP:-10.8.0.2}
      # #1677: addresses belonging to this fleet, excluded from the
      # dashboard's attacker aggregations. Suricata records `source.ip` as
      # whichever end it saw as the source, so our own hosts appear as
      # "attackers" for both halves of every attacker session and for their
      # own outbound traffic -- the VPS's public address was the #2 attacker
      # at 607,288 events over 48h. The tunnel peer is always excluded
      # whether or not it is listed here. Comma-separated.
      - HONEYPOT_SELF_IPS=${HONEYPOT_SELF_IPS:-}
      # #2299: loop-only role, still subject to the #2183 boot gate.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      # #2320: the other half of the same gate. Env forwarding is
      # per-service, so an empty-token deployment opts each role out
      # individually -- leaving this off loop-only roles made them
      # crash-loop on [E-SERVICE-TOKEN] while serving roles above booted
      # on APIARY_ALLOW_UNAUTH_DEV=1. check-backend-boot-contract.py
      # fails CI if any WORKER_LOOPS consumer drops either half again.
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      - WORKER_LOOPS=es-results-importer
      - IMPORT_INTERVAL=${ES_IMPORTER_INTERVAL:-300}
      - IMPORTER_STATE=/state-importer/es-results-importer.json
      - SHARD_COUNT=${ES_IMPORTER_SHARD_COUNT:-1}
      - GHIDRA_RESULTS_DIR=/ghidra-results
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - WINDOWS_SANDBOX_RESULTS_DIR=/windows-sandbox-results
      - GHOSTS_SANDBOX_RESULTS_DIR=/ghosts-sandbox-results
      - GITHUB_ANALYSIS_RESULTS_DIR=/github-analysis-results
      - REVDECK_RESULTS_DIR=/revdeck-results
      - CAPE_RESULTS_DIR=/cape-results
      - COWRIE_TTYLOG_DIR=/cowrie-tty
      # #1611 workstream B: mailoney's saved SMTP DATA bodies -- Rust-only,
      # no Python-importer.py equivalent, since src/mail.rs's
      # GET /api/v1/mail/{session_id} is itself new (#1611) functionality.
      - MAILONEY_MAIL_DIR=/mailoney-mail
      - REPORTER_METRICS_DIR=/reporter-data
      - YARA_RESULTS_DIR=/yara-results
      - TZ=Europe/Berlin
    volumes:
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-github/results:/github-analysis-results:ro
      - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
      - /var/lib/honeypot-cape/results:/cape-results:ro
      - es-importer-state:/state-importer
      - /opt/stacks/apiary/logs/cowrie/tty:/cowrie-tty:ro
      - /opt/stacks/apiary/logs/mailoney/mail:/mailoney-mail:ro
      - reporter-data:/reporter-data:ro
      - yara-results:/yara-results:ro
    networks:
      - honeynet
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # #1610: ip-enrichment-worker. Unlike every other backend-* service in
  # this file, this loop never touches Elasticsearch (or any network) at
  # all -- it tails raw sensor JSON logs and rewrites tunnel-peer-masked
  # src_ip fields via a portbridge via_port join, writing the result to
  # OUT_DIR for Filebeat to tail instead of the raw file. A distinct
  # compose service from backend-worker (whose other loops all need to
  # reach Elasticsearch) and backend-service-mounted (whose write access is
  # scoped to host-worker request spools, not raw sensor logs), same
  # "distinct trust/mount boundary, distinct service" precedent as
  # backend-worker-importer above -- network_mode: none is a deliberate
  # security posture carried over unchanged from the Go worker's own
  # compose service, matching services-adapter's identical reasoning below.
  # Read-only for every sensor's raw log directory and portbridge's own
  # connection log; a separate, more specific read-write mount for the one
  # subdirectory this worker actually writes to (Docker resolves the more
  # specific bind for overlapping paths).
  backend-worker-enrichment:
    <<: *runtime-defaults
    image: ghcr.io/xore-inc/honeypot-backend-service:${APIARY_BACKEND_VERSION:?set APIARY_BACKEND_VERSION}@${APIARY_BACKEND_DIGEST:?set APIARY_BACKEND_DIGEST}
    container_name: hp-apiary-worker-enrichment
    restart: unless-stopped
    network_mode: none
    environment:
      # #2299: loop-only role (offline, network_mode: none), still subject
      # to the #2183 boot gate.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      # #2320: the other half of the same gate. Env forwarding is
      # per-service, so an empty-token deployment opts each role out
      # individually -- leaving this off loop-only roles made them
      # crash-loop on [E-SERVICE-TOKEN] while serving roles above booted
      # on APIARY_ALLOW_UNAUTH_DEV=1. check-backend-boot-contract.py
      # fails CI if any WORKER_LOOPS consumer drops either half again.
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      - WORKER_LOOPS=ip-enrichment
      - LOGS_DIR=/logs
      - OUT_DIR=/logs/enriched
      - STATE_DIR=/state/ip-enrichment-worker
      - REFRESH_INTERVAL=2s
      - PENDING_TIMEOUT=5s
      - OUTPUT_MAX_BYTES=${JSON_STREAM_MAX_BYTES:-67108864}
      - TZ=Europe/Berlin
    volumes:
      - /opt/stacks/apiary/logs:/logs:ro
      - /opt/stacks/apiary/logs/enriched:/logs/enriched:rw
      - /opt/stacks/apiary/state/ip-enrichment-worker:/state/ip-enrichment-worker:rw
    # /logs/enriched is github-deploy-runner:github-deploy-runner (994:979,
    # Arcane's own deploy-time provisioning owner) on disk, same as the
    # dashboard-secrets dir dashboard-next mounts above. This image runs
    # unprivileged (nobody), so without group membership every open() here
    # fails EACCES -- confirmed live: every single source failed to open
    # its output file from the container's first log line onward, silently
    # (WARN, not fatal), so the container reported healthy the entire time
    # while shipping zero enrichment output and every dependent sensor
    # (everything Filebeat tails from /logs/enriched/*.json -- see
    # honeypot-elk/analysis/filebeat.yml's own #746 comment for the full
    # list) went STALE the moment the retired Go worker's last write aged
    # out. Same group_add fix as dashboard-next's identical EACCES above -- and
    # the same interpolation, for the same reason. This was the literal 979,
    # which after the 2026-09-03 rebuild belonged to github-ci-runner-4 rather
    # than deploy-runner. The failure was exactly what this comment predicts:
    # 22 "open output failed ... Permission denied" WARNs, /logs/enriched empty,
    # and the container reporting healthy throughout while every Filebeat
    # consumer of /logs/enriched/*.json went stale.
    group_add:
      # Same value as dashboard-next's group_add above, deliberately. These two
      # disagreed (980 vs 979) while naming the same group, so whichever
      # fallback happened to be wrong on a given host silently mis-grouped one
      # of the two containers. Neither number is meaningful on its own: a GID
      # is host-specific, and step_pin_deploy_runner_gid writes the real one
      # into this stack's .env. The literal only covers a host that has not
      # been through that step, so both must at least agree.
      - "${DEPLOY_RUNNER_GID:-980}"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # #1610 worker migration, closing the last unwired gap: payload_inventory.rs
  # (payload-inventory-worker's Rust port) has existed since #1610 and even
  # had its own worker.rs match arm, but nothing ever set
  # WORKER_LOOPS=payload-inventory anywhere in THIS file -- so within this
  # stack the code shipped, compiled, and was dead, and the standalone Go
  # worker below stayed the only thing keeping dashboard-payload-inventory-v1/
  # dashboard-payload-bytes-v1 current. Found auditing #1630's "still-Go,
  # not yet ported" follow-up (#1649).
  #
  # That audit was scoped to this file and missed what ccc4cb61 (#1622) had
  # already done three days earlier: the sibling honeypot-dashboard-backend
  # stack wired the same loop into backend-service's WORKER_LOOPS. Both ran
  # until #2110 removed the sibling copy -- this dedicated service is now
  # the fleet's ONLY payload-inventory runner (isolated resource limits,
  # off the request/response tier), which is exactly where the loop belongs.
  #
  # Needs its own service rather than an entry bolted onto backend-worker,
  # same reasoning as backend-worker-importer/-enrichment above:
  # backend-worker is deliberately host-mount-free (see its own "movable to
  # any docker host" comment), and this loop needs read access to both
  # payload capture sources -- the exact PAYLOAD_DIRS mounts dashboard/
  # dashboard-next already carry -- plus a live ES connection (unlike
  # backend-worker-enrichment just above, which is network_mode: none).
  backend-worker-payload-inventory:
    <<: *runtime-defaults
    image: ghcr.io/xore-inc/honeypot-backend-service:${APIARY_BACKEND_VERSION:?set APIARY_BACKEND_VERSION}@${APIARY_BACKEND_DIGEST:?set APIARY_BACKEND_DIGEST}
    container_name: hp-apiary-worker-payload-inventory
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=127.0.0.1:8097
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - HONEYPOT_TUNNEL_PEER_IP=${HONEYPOT_TUNNEL_PEER_IP:-10.8.0.1}
      - HONEYPOT_TUNNEL_SENSOR_IP=${HONEYPOT_TUNNEL_SENSOR_IP:-10.8.0.2}
      # #1677: addresses belonging to this fleet, excluded from the
      # dashboard's attacker aggregations. Suricata records `source.ip` as
      # whichever end it saw as the source, so our own hosts appear as
      # "attackers" for both halves of every attacker session and for their
      # own outbound traffic -- the VPS's public address was the #2 attacker
      # at 607,288 events over 48h. The tunnel peer is always excluded
      # whether or not it is listed here. Comma-separated.
      - HONEYPOT_SELF_IPS=${HONEYPOT_SELF_IPS:-}
      # #2299: loop-only role, still subject to the #2183 boot gate.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      # #2320: the other half of the same gate. Env forwarding is
      # per-service, so an empty-token deployment opts each role out
      # individually -- leaving this off loop-only roles made them
      # crash-loop on [E-SERVICE-TOKEN] while serving roles above booted
      # on APIARY_ALLOW_UNAUTH_DEV=1. check-backend-boot-contract.py
      # fails CI if any WORKER_LOOPS consumer drops either half again.
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      - WORKER_LOOPS=payload-inventory
      - PAYLOAD_DIRS=/dionaea-lib/binaries,/cowrie-downloads
      - SCAN_INTERVAL=${PAYLOAD_INVENTORY_SCAN_INTERVAL:-5m}
      - TZ=Europe/Berlin
    volumes:
      - dionaea-lib:/dionaea-lib:ro
      - /opt/stacks/apiary/logs/cowrie/downloads:/cowrie-downloads:ro
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  services-adapter:
    <<: *runtime-defaults
    image: ghcr.io/xore-inc/honeypot-services-adapter:${SERVICES_ADAPTER_VERSION:?set SERVICES_ADAPTER_VERSION}@${SERVICES_ADAPTER_DIGEST:?set SERVICES_ADAPTER_DIGEST}
    container_name: hp-services-adapter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - services-adapter-socket:/run/services-adapter
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    # Talks to the Docker daemon over docker.sock and to dashboard over the
    # services-adapter-socket volume only (confirmed: no TCP/HTTP client
    # anywhere in services-adapter.py) -- no network needed at all. Also
    # sidesteps this host's address-pool exhaustion (many Compose projects
    # already claim a bridge each; the implicit per-project default network
    # this service would otherwise get failed to create with "all predefined
    # address pools have been fully subnetted" the first time this stack was
    # deployed).
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  # Shared with every APIARY stack on this host -- explicit fixed name,
  # non-external, the same declaration the other stacks use.
  honeynet:
    name: honeynet
    driver: bridge

volumes:
  # Fixed names shared with the sensor, utilities and backend stacks; the
  # existing volumes are reused as they are.
  dionaea-lib:
    name: dionaea-lib
  yara-results:
    name: yara-results
  reporter-data:
    name: reporter-data
  services-adapter-socket:
    name: services-adapter-socket
  # #378: backend-worker-importer's last-imported-mtime bookkeeping. This was
  # the old project's private volume; it is reused under its existing name
  # so the cutover does not re-send every result. It must already exist
  # (external), which also makes a wrong host fail loudly.
  es-importer-state:
    name: honeypot-dashboard_es-importer-state
    external: true
