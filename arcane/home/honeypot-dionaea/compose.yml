# honeypot-dionaea — #258: dionaea and tftp-relay split into their own
# Dockge stack. Kept together, not further split into per-service stacks:
# tftp-relay has depends_on: dionaea and actually forwards TFTP traffic to
# it over dionaea_net (#235's one documented exception to "one honeypot per
# network" -- see that network's own comment below), so they're one unit,
# same shape as arcane/home/honeypot-http/compose.yml's http-honeypot+api-honeypot pair.
#
# dionaea-lib is the one resource this stack shares outside itself: it's
# where dionaea writes captured binaries/bistreams, and
# arcane/home/honeypot-payload-analysis/compose.yml's payload-dedupe/yara-scanner (also
# #258, split out separately per explicit instruction rather than bundled
# in here) read from it, same as arcane/home/honeypot-dashboard/compose.yml already does.
# Given the explicit shared `name:` treatment honeynet/es-data already use
# between APIARY and honeypot-init.
#
# Deployed as /opt/stacks/honeypot-dionaea.

name: honeypot-dionaea

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  dionaea:
    <<: *runtime-defaults
    build: ./dionaea
    container_name: hp-dionaea
    restart: unless-stopped
    # #127: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism).
    entrypoint:
      - /bin/sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do sleep 3; done

        cd /opt/dionaea

        test -f etc/dionaea/dionaea.cfg || cp -van template/etc .

        cp -van template/lib/dionaea/. var/lib/dionaea/ 2>/dev/null || true

        cp -van template/log/dionaea/. var/log/dionaea/ 2>/dev/null || true

        mkdir -p var/lib/dionaea/binaries var/lib/dionaea/bistreams var/lib/dionaea/ftp/root \
                 var/lib/dionaea/tftp/root var/lib/dionaea/upnp/root var/lib/dionaea/printer/root \
                 var/lib/dionaea/roots/ftp var/lib/dionaea/roots/tftp \
                 var/lib/dionaea/roots/www var/lib/dionaea/roots/upnp
        mkdir -p etc/dionaea/ihandlers-enabled

        printf -- '- name: log_json\n  config:\n    handlers:\n      - file:///opt/dionaea/var/log/dionaea/dionaea.json\n' \
                > etc/dionaea/ihandlers-enabled/log_json.yaml

        printf -- '- name: log_incident\n  config:\n    handlers:\n      - file:///opt/dionaea/var/log/dionaea/dionaea_incident.json\n' \
                > etc/dionaea/ihandlers-enabled/log_incident.yaml

        printf -- '- name: store\n' \
                > etc/dionaea/ihandlers-enabled/store.yaml

        sed -i 's/^default.levels=.*/default.levels=info,warning,error/' \
               etc/dionaea/dionaea.cfg
        chown -R dionaea:dionaea var/lib/dionaea var/log/dionaea

        export DIONAEA_SKIP_INIT=1

        exec /usr/local/sbin/entrypoint.sh
    ports:
      - ${HP_BIND:-10.8.0.2}:21:21
      - ${HP_BIND:-10.8.0.2}:445:445
      - ${HP_BIND:-10.8.0.2}:1433:1433
      - ${HP_BIND:-10.8.0.2}:3306:3306
      - ${HP_BIND:-10.8.0.2}:27017:27017
      - ${HP_BIND:-10.8.0.2}:1723:1723
      - ${HP_BIND:-10.8.0.2}:5060:5060
      - ${HP_BIND:-10.8.0.2}:5060:5060/udp
      - ${HP_BIND:-10.8.0.2}:135:135
      - ${HP_BIND:-10.8.0.2}:1883:1883
      - ${HP_BIND:-10.8.0.2}:9100:9100
      - ${HP_BIND:-10.8.0.2}:11211:11211
      - ${HP_BIND:-10.8.0.2}:69:69/udp
      - ${HP_BIND:-10.8.0.2}:1900:1900/udp
    volumes:
      - /opt/stacks/apiary/logs/dionaea:/opt/dionaea/var/log/dionaea
      - dionaea-lib:/opt/dionaea/var/lib/dionaea
      - ./dionaea/persona:/persona:ro
      - ./dionaea/services/ftp.yaml:/opt/dionaea/etc/dionaea/services-enabled/ftp.yaml:ro
      - ./dionaea/services/smb.yaml:/opt/dionaea/etc/dionaea/services-enabled/smb.yaml:ro
      - ./dionaea/services/sip.yaml:/opt/dionaea/etc/dionaea/services-enabled/sip.yaml:ro
      - ./dionaea/services/printer.yaml:/opt/dionaea/etc/dionaea/services-enabled/printer.yaml:ro
      - ./dionaea/services/tftp.yaml:/opt/dionaea/etc/dionaea/services-enabled/tftp.yaml:ro
      - ./dionaea/services/upnp.yaml:/opt/dionaea/etc/dionaea/services-enabled/upnp.yaml:ro
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    environment:
      - TZ=Europe/Berlin
      # #1389: one shared knob also consumed by ip-enrichment-worker and the
      # dashboard's pre-limit alert/metrics, so observability cannot drift
      # from the writer's real self-rotation threshold.
      - DIONAEA_LOG_MAX_BYTES=${JSON_STREAM_MAX_BYTES:-67108864}
    # Capabilities measured, not guessed (2026-07-31). Baseline was run first —
    # default caps + SYS_PTRACE — and each reduction re-measured against the
    # exact set of listening ports, because a container that stays up with dead
    # listeners is a honeypot that looks deployed and collects nothing.
    #
    #   default caps + SYS_PTRACE          39 listeners   <- baseline
    #   default caps, no SYS_PTRACE        39 listeners   <- identical
    #   cap_drop ALL                       container exits
    #   + NET_BIND_SERVICE                 container exits
    #   + CHOWN,SETUID,SETGID              39 listeners
    #   + DAC_OVERRIDE                     39 listeners, identical port set
    #
    # SYS_PTRACE is dropped: it permits attaching to and controlling other
    # processes, and dionaea demonstrably does not need it. The rest are what
    # the entrypoint actually requires — chown -R on the data dirs, dropping to
    # the dionaea user, and binding 21/135/445 and friends.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    # /opt/dionaea/etc doesn't exist in the base image at all -- the
    # entrypoint's own `cp -van template/etc .` creates it fresh from
    # scratch on every container start (etc/ has no bind mount or named
    # volume of its own, unlike var/lib+var/log), then the entrypoint
    # writes ihandlers-enabled/*.yaml and sed -i's dionaea.cfg in place --
    # all real writes to what would otherwise be read-only rootfs.
    tmpfs:
      - /opt/dionaea/etc
    networks:
      - dionaea_net
    # #41: dionaea never had a healthcheck at all, so a real production
    # stall (process alive, container "running", but the log_json handler
    # silently stopped writing for hours) was invisible everywhere except a
    # human noticing stale data on the dashboard -- "healthy" in the
    # Services pane was really just Docker's own container-running state,
    # not a checked signal. python3 is the only probe tool present in this
    # image (measured: no nc/curl/wget); a plain TCP connect to 445 (SMB,
    # one of the ports the capability measurement above already confirms is
    # reliably bound) is the same "prove the listener is up" floor several
    # of this repo's own Go sensors already use for their own healthchecks
    # -- it won't catch every possible internal-stall mode (a wedged event
    # loop can still hold an open listening socket), but it catches a
    # crashed or never-bound process, which is strictly more than nothing.
    #
    # #1386: the TCP check alone stayed green while live RSS sat at 97% of
    # the 1024M limit below with 84k+ cgroup memory.max hits already
    # recorded (confirmed live) -- a listening socket says nothing about
    # memory headroom. Fails health at 90% of memory.max so the
    # autoheal=true label below actually gets a signal to restart before an
    # OOM kill instead of only after one. Falls through silently if those
    # files aren't present (e.g. a cgroup v1 host) -- this is additive, not
    # a replacement for the TCP check above.
    #
    # Gates on `anon` from memory.stat, not memory.current: memory.current
    # includes reclaimable page cache, and dionaea's own log files
    # (dionaea_incident.json, dionaea.json, dionaea-errors.log) fill that
    # cache. Live 2026-10-10: memory.current 99.5% of max, anon 32%, the
    # process itself not under pressure -- so the old gate reported
    # unhealthy while capture was normal (#3585).
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import socket
          socket.create_connection(('127.0.0.1', 445), 3).close()
          import os, sys
          stat_path = '/sys/fs/cgroup/memory.stat'
          max_path = '/sys/fs/cgroup/memory.max'
          if os.path.exists(stat_path) and os.path.exists(max_path):
              limit = open(max_path).read().strip()
              anon = 0
              for line in open(stat_path):
                  key, _, value = line.partition(' ')
                  if key == 'anon':
                      anon = int(value)
              if limit != 'max' and anon >= int(limit) * 0.9:
                  sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Restarted by the autoheal sidecar (main stack) on unhealthy -- same
    # reasoning as dnp3/conpot/dns-honeypot, see #119.
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 1024M

  # TFTP selects a dynamic server transfer port after the request. Relay that
  # exchange inside the Docker network so the WireGuard/public edge can retain
  # one stable UDP port while Dionaea remains the actual sensor and logger.
  tftp-relay:
    <<: *runtime-defaults
    build: ./tftp-relay
    container_name: hp-tftp-relay
    restart: unless-stopped
    environment:
      - TFTP_TARGET=dionaea:69
    ports:
      - ${HP_BIND:-10.8.0.2}:1069:1069/udp
    networks:
      - dionaea_net
    # #747: {relay_port, client_ip} per session, so ip-enrichment-worker can
    # correct dionaea's TFTP events -- dionaea only ever sees this relay's
    # own internal address, never the real attacker.
    volumes:
      - /opt/stacks/apiary/logs/tftp-relay:/logs
    # #2366: measured baseline, same "run it, then reduce" methodology as
    # #89/#118's cap_drop passes -- this service had none of no-new-
    # privileges/read_only/cap_drop at all. Verified locally: built this
    # image, ran it with all three added, and confirmed the relay still
    # starts and logs its listen line.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    depends_on:
      dionaea:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  # One honeypot per network (#235), each with no other honeypot as a peer --
  # a compromised honeypot has no network path to another honeypot's daemon.
  # tftp-relay is the one real exception: it has depends_on: dionaea and
  # actually forwards TFTP traffic to it, so those two share this network
  # instead of each getting their own. Private to this stack -- nothing
  # outside it ever referenced dionaea_net.
  #
  # #540: outbound is allowed by default, matching this stack's previous de
  # facto behavior. Confirmed live (dinotools/dionaea:latest, the image
  # dionaea/Dockerfile builds from): ihandlers-enabled/emuprofile.yaml
  # (libemu shellcode emulation -- detects and drives download-and-execute
  # patterns like URLDownloadToFileA in SMB/MSRPC exploit shellcode) and
  # ihandlers-enabled/tftp_download.yaml (fetches TFTP-referenced payloads)
  # both ship enabled by default, so Dionaea already captures the
  # attacker's actual malware sample this way, not just the exploit
  # attempt -- same tradeoff as Cowrie (#269/#538), same reasoning. Set
  # DIONAEA_AIR_GAPPED=true (.env) for a stricter, fully air-gapped Dionaea
  # that trades that capture capability away. internal: true still permits
  # tftp-relay's inbound forwarding on this same network (no outbound
  # route to the internet, not a block on local/inbound bridge traffic).
  # See docs/persona-design.md.
  dionaea_net:
    driver: bridge
    internal: ${DIONAEA_AIR_GAPPED:-false}

volumes:
  # Shared with arcane/home/honeypot-payload-analysis/compose.yml (#258) -- explicit fixed
  # name, matching docker-compose.yml's own historical declaration and the
  # same mechanism honeynet/es-data already use between APIARY and
  # honeypot-init. dionaea writes captured binaries/bistreams here;
  # payload-dedupe/yara-scanner (that other stack) only read.
  dionaea-lib:
    name: dionaea-lib
