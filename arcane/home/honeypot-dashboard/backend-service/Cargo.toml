# apiary-backend — the Rust service tier of the modernization port (#1608).
# Serves /api/v1 JSON to the Nitro BFF: Elasticsearch queries, correlation,
# the SSE event source, result spools, and (later) PDF generation. Chosen by
# the serving-quality decision matrix on #1608 (axum/tokio over Go/Node/
# Elixir for latency, CPU-bound correlation, memory predictability, and
# hostile-input correctness).
[package]
name = "apiary-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
elasticsearch = { version = "9.1.0-alpha.1", default-features = false, features = ["rustls-tls"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-stream = "0.3"
base64 = "0.23"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
# Payload Workbench (#1612 phase 3b): idempotency-key hashing and recipe-id
# generation. Both need to agree with the Go tier's algorithm (SHA-256 of
# the same material; crypto/rand-strength ids) while both write
# dashboard-workbench-runs-v1/-recipes-v1 during the cutover window.
sha2 = "0.11"
rand = "0.10"
# PDF report composer (#1612 follow-up): only the core Op/graphics/
# builtin-font API is used (no HTML layout, no raster image decoding — the
# two embedded emblems are hand-registered XObject::External stencil masks,
# see report_pdf.rs), so every optional feature (html/text_layout/images/
# svg/...) is disabled to skip printpdf's azul-layout+taffy+hyphenation
# dependency chain entirely.
printpdf = { version = "0.12.6", default-features = false }
# agent-intrusion-worker port (#1610): bounded_decode needs real gzip/zlib
# decompression (no equivalent in std) to verify a decoded payload actually
# unpacks, not just that it base64-decodes.
flate2 = "1"
# rule_encoded_egress_external needs base32 to try-decode a DNS query label
# (the campaign's own DNS-transport exfil shape uses base32, not base64).
data-encoding = "2"
mail-parser = "0.11.6"
# #3325: the /api contract, generated from the routes rather than
# transcribed beside them. `utoipa-axum` collects the `#[utoipa::path]`
# annotations off the handlers into the same `Router` the process serves,
# so the document and the router cannot describe different APIs.
#
# The `axum_extras` feature is deliberately *not* enabled. It would make
# `#[utoipa::path]` derive parameters and request bodies from each
# handler's extractor signature; every route here answers `Json<Value>` or
# a per-surface struct that nothing in the crate enforces, so the derived
# shapes would be a second, silently-different opinion about the same
# routes. With it off, the `params(...)` and `request_body(...)` in each
# annotation are the whole story -- see src/contract.rs for the parameter
# shapes they name.
utoipa = { version = "6", features = ["macros"] }
utoipa-axum = "0.3"
# #3577: Ed25519 verification of the BFF's actor assertions. Not a new
# crate: rustls already compiles ring 0.17 into this binary, so this names
# it directly instead of adding a second crypto library. The backend only
# verifies; the private key lives with the BFF.
ring = "0.17"

[dev-dependencies]
# #3577: drive the real router with `oneshot` in the trust-boundary tests.
# Already in the tree through axum.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
