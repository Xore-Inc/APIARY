# honeypot-dashboard — #258: dashboard + services-adapter split into their
# own Dockge-managed stack, deployed as /opt/stacks/honeypot-dashboard.
#
# Unlike the standalone honeypot personas already split out (conpot, cowrie,
# multipot, http, dnp3 -- see arcane/home/honeypot-conpot/compose.yml's header for that
# reasoning), this pair genuinely needs cross-stack access: dashboard talks
# to elasticsearch/filebeat by service-name DNS over the shared `honeynet`
# network, and reads/writes three named volumes the main stack also touches
# -- dionaea-lib and yara-results (dionaea/yara-scanner write, this stack
# only reads), and dashboard-state (genuinely shared both ways: payload-
# dedupe and yara-scanner in the main stack read/write retained script
# payloads under /payloads/scripts, the same subtree this stack's own
# SCRIPT_PAYLOAD_DIR=/state/script-payloads writes). This is the "harder
# case" #258 raised -- resolved the same way this repo already resolves it
# for honeypot-init (see docker-compose.yml's own networks: comment and
# arcane/home/honeypot-init/compose.yml's header): give the shared network/volumes an
# explicit, non-external `name:` in every stack that touches them. Compose
# creates a named resource if absent or transparently reuses it if a
# same-named one already exists -- no `external: true` pre-creation dance
# needed, and no --link/legacy networking either. Confirmed this already
# works live in production before relying on it here: honeypot-init's
# elasticsearch-setup job resolves `http://elasticsearch:9200` by bare
# service name across the project boundary, over this exact same honeynet,
# today.
#
# services-adapter moves together with dashboard, not out on its own: the
# two communicate over services-adapter-socket -- a volume that, at the time
# of this #258 split, genuinely nothing else touched (confirmed -- grepped
# for it across every compose file), so there was no reason to split them
# into separate projects. Originally left unnamed/project-scoped here -- a
# fresh volume in the new project, not migrated from the old one -- per
# explicit instruction that this split does not need to preserve existing
# state across the cutover. dashboard-state got the opposite treatment
# (explicit shared name) precisely because, unlike the socket at the time,
# other services still depended on it.
#
# That "nothing else touches it" premise no longer holds: #1622 moved
# backend-service (a third consumer of this same socket) into the sibling
# honeypot-dashboard-backend stack, so services-adapter-socket below now
# also carries an explicit shared `name:`, same mechanism as dionaea-lib/
# dashboard-state.
#
# The log-path half of this claim held; the EXPECTED_SENSORS half did not
# survive: that expectation list was removed when the cutover completed
# (commit 824aa33d, #1628), and source-health today derives sensor liveness
# from observed event.sensor values (backend-service/src/health.rs) rather
# than a static list (#2359). Every /logs-derived, host-bind-mounted path
# is unaffected by the move: the dashboard reads sensor activity from log
# files at their existing host paths regardless of which compose project
# produced them, exactly as already proven by the five sensor splits before
# this one.

name: honeypot-dashboard

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  oidc-sessions:
    <<: *runtime-defaults
    image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: hp-dashboard-oidc-sessions
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    networks: [oidc-session]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - autoheal=true
    read_only: true
    # #1026: quoted -- the unquoted form's comma between size= and mode=
    # was parsed by YAML as a flow-sequence separator, splitting this into
    # two invalid tmpfs entries ("/data:size=16m" and "mode=0700") and
    # making Docker reject "mode=0700" as a non-absolute mount path.
    tmpfs: ["/data:size=16m,mode=0700"]
    security_opt: [no-new-privileges:true]
    # #1026: the official image's entrypoint starts as root, chowns /data to
    # its own unprivileged user, then execs the server as that user --
    # cap_drop: [ALL] alone made the chown itself fail ("Operation not
    # permitted") and the container crash-looped before ever reaching
    # valkey-server. CHOWN/SETUID/SETGID restore exactly what that one-time
    # startup dance needs; valkey-server itself never uses them once running.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 320M}


  # ------------------------------------------------------------------
  # Modernization port (#1608) — cutover complete: this stack IS the
  # dashboard now, no profile gate, and the retired Go `dashboard`
  # service is gone from this file entirely (an older git commit is the
  # only way back, deliberately — no runtime fallback). The staging port
  # 19092 is no longer bound here: it belongs to the standalone
  # Xore/apiary-dashboard Arcane project, which runs beside this one
  # until its cutover's seven-day rollback window closes (that repo's
  # docs/cutover-plan.md). dashboard-next keeps production 19090.
  #
  # Cross-host readiness (per Xore): both tiers are stateless,
  # env-configured containers — session/OIDC state lives in the
  # oidc-sessions valkey (network-reachable, no localhost sockets), data
  # access goes through BACKEND_URL/BFF_INTERNAL_URL, so either tier can
  # move to another docker host by pointing those URLs across the
  # WireGuard mesh, and the BFF can scale horizontally (SERVE_MODE
  # splits frontend/bff; no compose resource limit on the BFF tier).
  #
  # That capability is genuinely real now, not just scaffolding: dashboard-
  # next's SERVE_MODE=frontend actually routes every serviceFetch/
  # serviceJSON call through the /bff/* proxy (frontend-next's
  # routes/bff.$.ts) on BFF_INTERNAL_URL instead of hitting BACKEND_URL
  # directly, and vps/traefik/dynamic.yml has a matching (today inert)
  # PathPrefix('/bff') router. Still one dashboard-next service pair below
  # — actually running a split frontend-only/bff-only pair on two docker
  # hosts, with their own compose services and socat bridges, is #1622's
  # job, not this one.
  #
  # #1622: `backend-service` itself moved out of this file into its own
  # Arcane-managed stack, arcane/home/honeypot-dashboard-backend/compose.yml
  # -- the compose-layer counterpart to this section's own "either tier can
  # move to another docker host" claim above, so it can actually be
  # restarted/redeployed independently of dashboard-next and everything
  # else here. `backend-service-mounted`, `backend-worker`,
  # `backend-worker-importer`, `backend-worker-enrichment`, and
  # `dashboard-next` below are unaffected -- still bundled in this file,
  # splitting those is further work, not done in this pass. dashboard-next's
  # BACKEND_URL=http://backend-service:8081 below still resolves: both
  # stacks attach to the same explicitly-named `honeynet` bridge, the same
  # cross-project DNS mechanism this file's own header documents.
  # ------------------------------------------------------------------
  # #1612 mounted worker role (phase 3a/3b): sandbox/ghidra/github-analysis
  # submission, the Payload Workbench orchestrator, and anything else that
  # needs to WRITE into a host-side request spool. Deliberately a separate
  # service from backend-service, not an extra mount bolted onto it: those
  # spool dirs are the dashboard's only path to root-owned host workers
  # (services-adapter is a narrow socket; these are real filesystem write
  # access), a distinct trust/mount boundary worth keeping visible in the
  # compose file rather than folding into backend-service's Phase-1 (state
  # + services-adapter-socket) scope. Also distinct from backend-worker:
  # this one serves HTTP request/response for submissions (LISTEN_ADDR is
  # network-reachable), where backend-worker only runs background loops and
  # binds loopback-only. Same image, same route table (routes aren't
  # container-specific — see main.rs) — reachable internally at
  # http://backend-service-mounted:8082; BFF wiring is a follow-up (owned
  # by the parallel frontend track).
  backend-service-mounted:
    <<: *runtime-defaults
    image: apiary-backend:latest
    # never: this image has no build: here on purpose (built by the sibling
    # honeypot-dashboard-backend stack's own backend-service service, shared
    # by local tag) and was never pushed to any registry -- Arcane's
    # redeploy does an unconditional `docker compose pull` across every
    # image in the file, which fails outright ("repository does not exist")
    # without this. Redeploying honeypot-dashboard-backend first keeps the
    # local tag current for every service below that references it.
    pull_policy: never
    container_name: hp-apiary-backend-mounted
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=0.0.0.0:8082
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # #1801: reconcile workbench runs nobody is looking at.
      #
      # reconcile_run already times out a child that outlives its queue
      # deadline, but it only ran inside get_run and child_action -- both
      # request-driven -- so a run whose worker never reported back sat in its
      # last-written state indefinitely. Measured on a real document:
      # updated_at still equal to created_at a day later, against a 30-minute
      # queue_deadline.
      #
      # It belongs on THIS tier and not on backend-worker: reconciliation
      # reads the analyzer spool directories to decide whether a request is
      # queued, claimed or finished, and those are mounted here. Anywhere else
      # every marker lookup returns nothing and the sweep concludes the
      # opposite of the truth about every run it touches.
      - WORKER_LOOPS=workbench-reconcile
      - WORKBENCH_RECONCILE_INTERVAL_SECONDS=${WORKBENCH_RECONCILE_INTERVAL_SECONDS:-60}
      # #1677: addresses belonging to this fleet, excluded from the
      # dashboard's attacker aggregations. Suricata records `source.ip` as
      # whichever end it saw as the source, so our own hosts appear as
      # "attackers" for both halves of every attacker session and for their
      # own outbound traffic -- the VPS's public address was the #2 attacker
      # at 607,288 events over 48h. The tunnel peer is always excluded
      # whether or not it is listed here. Comma-separated.
      - HONEYPOT_SELF_IPS=${HONEYPOT_SELF_IPS:-}
      # #2183: empty SERVICE_TOKEN refuses to boot with [E-SERVICE-TOKEN];
      # the override below is the one sanctioned dev escape hatch.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      - SANDBOX_REQUEST_DIR=/sandbox-requests
      - WINDOWS_SANDBOX_REQUEST_DIR=${WINDOWS_SANDBOX_REQUEST_DIR:-}
      - GHOSTS_SANDBOX_REQUEST_DIR=${GHOSTS_SANDBOX_REQUEST_DIR:-}
      - WINDOWS_SANDBOX_RESULTS_DIR=${WINDOWS_SANDBOX_RESULTS_DIR:-}
      - GHOSTS_SANDBOX_RESULTS_DIR=${GHOSTS_SANDBOX_RESULTS_DIR:-}
      - GHIDRA_REQUEST_DIR=${GHIDRA_REQUEST_DIR:-}
      - GHIDRA_RESULTS_DIR=${GHIDRA_RESULTS_DIR:-}
      - GITHUB_ANALYSIS_REQUEST_DIR=${GITHUB_ANALYSIS_REQUEST_DIR:-}
      # #1612 phase 3b: Payload Workbench orchestrator. REVDECK_RESULTS_DIR
      # is also fed by ghidra-worker.py's drain_revdeck() for the "ghidra"
      # analyzer's embedded RevDeck enrichment (read, not written, here) —
      # SANDBOX_RESULTS_DIR is read-write-adjacent: this service only reads
      # it (reconciliation), the host-side worker owns writing job results.
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - REVDECK_REQUEST_DIR=${REVDECK_REQUEST_DIR:-}
      - REVDECK_RESULTS_DIR=${REVDECK_RESULTS_DIR:-}
      - PAYLOAD_DIRS=/dionaea-lib/binaries,/cowrie-downloads
      - SCRIPT_PAYLOAD_DIR=/state/script-payloads
      # #1972: same durable per-request app log as backend-service (obs.rs,
      # see honeypot-dashboard-backend/compose.yml), own directory so the two
      # instances stay separate files for filebeat's registry while shipping
      # into the shared dashboard-backend-v1-* index family. Workbench/sandbox
      # submissions are exactly the requests you'll want a line for.
      - DASHBOARD_LOG_FILE=${DASHBOARD_LOG_FILE:-/logs/dashboard-backend-mounted/app.jsonl}
      - TZ=Europe/Berlin
    volumes:
      - dashboard-state:/state
      - dionaea-lib:/dionaea-lib:ro
      - /opt/stacks/apiary/logs/cowrie/downloads:/cowrie-downloads:ro
      # #1972 read-write: this instance CREATES its own app.jsonl, same
      # provisioning/chown posture as backend-service's (log-init step,
      # uid 65534).
      - /opt/stacks/apiary/logs/dashboard-backend-mounted:/logs/dashboard-backend-mounted
      # Read-write: this service is the one thing that CREATES these
      # markers. Windows/GHOSTS/Ghidra/GitHub-analysis/Rev·Deck stay inert
      # (empty env var above) until the operator has actually deployed that
      # host-side worker, same posture as every other optional spool in
      # this stack.
      - /var/lib/honeypot-sandbox/requests/pending:/sandbox-requests
      - /var/lib/honeypot-windows-sandbox/requests/pending:/windows-sandbox-requests
      - /var/lib/honeypot-ghosts-sandbox/requests/pending:/ghosts-sandbox-requests
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-ghidra/requests/pending:/ghidra-requests
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-github/requests/pending:/github-analysis-requests
      - /var/lib/honeypot-revdeck/requests/pending:/revdeck-requests
      - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
      # Read-only: reconciliation polls job-completion state directly off
      # disk (never through the ES mirror — see workbench_orchestrator.rs's
      # module comment), the same reasoning golden-image-status already
      # established for WINDOWS_SANDBOX_RESULTS_DIR above.
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
    networks:
      - honeynet
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

  # Worker role (#1610): the same apiary-backend image with WORKER_LOOPS
  # enabled and no service port — movable to any docker host that can
  # reach ES (stateless, env-configured). Scale by listing loops per
  # replica.
  #
  # reports-scheduler and user-retention-sweep are deliberately NOT in this
  # list (#2301 audited this file alone and concluded, wrongly, that
  # neither loop was wired anywhere): both moved with backend-service into
  # the sibling honeypot-dashboard-backend stack at the #1622 split and are
  # enabled there instead — see that stack's compose.yml WORKER_LOOPS= line
  # and its comment. Each is a non-atomic ES read-modify-write (due-
  # definitions render / users-doc sweep), so adding them here too would
  # run a second, uncoordinated consumer racing the existing one — the same
  # failure mode #2110 already fixed once for payload-inventory below.
  backend-worker:
    <<: *runtime-defaults
    image: apiary-backend:latest
    # never: see backend-service-mounted's own comment above -- same image,
    # no build: here, built by the sibling honeypot-dashboard-backend stack.
    pull_policy: never
    container_name: hp-apiary-worker
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=127.0.0.1:8099
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # #1677: addresses belonging to this fleet, excluded from the
      # dashboard's attacker aggregations. Suricata records `source.ip` as
      # whichever end it saw as the source, so our own hosts appear as
      # "attackers" for both halves of every attacker session and for their
      # own outbound traffic -- the VPS's public address was the #2 attacker
      # at 607,288 events over 48h. The tunnel peer is always excluded
      # whether or not it is listed here. Comma-separated.
      - HONEYPOT_SELF_IPS=${HONEYPOT_SELF_IPS:-}
      # #1610: attacker-identity is pure ES (no host mounts, no local
      # state — durable entities live in attackers-v1), so it fits this
      # already-stateless loop container directly, unlike es-results-
      # importer (needs root+DAC_READ_SEARCH for root-owned result dirs
      # plus a persistent dedup state file — its own separate service).
      # agent-intrusion (#1610): same "pure ES, no host mounts, no local
      # state" shape as attacker-identity above — durable campaign verdicts
      # live in agent-intrusion-campaigns, everything else is recomputed
      # from the rolling fetch window each cycle.
      # correlator (#1610): same shape again — campaigns-v1/attacker-
      # clusters-v1 are fully recomputed from scratch every cycle (pure ES
      # aggregations, no raw-document paging needed at all here, unlike its
      # two siblings above), so it fits this stateless loop container too.
      # threat-intel (#1659): reads THREAT_CIDRS_FILE off the mount below —
      # kept fresh by the threat-cidrs-refresh container in the honeypot-
      # init stack (profiles: [threat-intel], both bind the same host path).
      # zeek-proxy-attribution joins the list: it needs Elasticsearch and
      # nothing else -- no host mounts, no local state -- so it belongs on the
      # stateless worker tier rather than the mounted one.
      # zeek-proxy-attribution resolves the attacker behind a relayed flow.
      #
      # Enabled only after the join was made time-bounded. The first version
      # matched on the relayed key alone and attributed 12,647 documents to
      # whoever last reused the tunnel's ephemeral port; those writes were
      # reverted, and the rule that prevents a repeat is that a portbridge
      # dial must precede the flow it claims to explain. Where no candidate
      # survives that test, the tunnel address is left in place -- an
      # unattributed flow is honest, a wrong attacker is not.
      # #2299: the #2183 boot gate refuses any apiary-backend role that
      # boots without SERVICE_TOKEN, serving or not -- without this line
      # every loop below was restart-looping since its deploy. Same
      # credential the serving siblings already carry (line ~191), just
      # copied onto the loop-only replicas.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      # #2320: the other half of the same gate. Env forwarding is
      # per-service, so an empty-token deployment opts each role out
      # individually -- leaving this off loop-only roles made them
      # crash-loop on [E-SERVICE-TOKEN] while serving roles above booted
      # on APIARY_ALLOW_UNAUTH_DEV=1. check-backend-boot-contract.py
      # fails CI if any WORKER_LOOPS consumer drops either half again.
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      # dashboard-rollups (#2046): same pure-ES shape — writes the three
      # derived rollup indices the overview/map/kill-chain endpoints read;
      # nothing mounted, nothing local, fully disposable/rebuildable.
      - WORKER_LOOPS=alert-notifier,attacker-identity,agent-intrusion,correlator,dashboard-rollups,threat-intel,zeek-proxy-attribution
      - ROLLUP_RUN_INTERVAL_SECS=${ROLLUP_RUN_INTERVAL_SECS:-300}
      - ZEEK_PROXY_ATTRIBUTION_INTERVAL_SECONDS=${ZEEK_PROXY_ATTRIBUTION_INTERVAL_SECONDS:-120}
      - THREAT_CIDRS_FILE=/geoip/threat-cidrs.csv
      - EVIDENCE_WINDOW=${EVIDENCE_WINDOW:-6h}
      - ATTACKER_IDENTITY_RUN_INTERVAL=${ATTACKER_IDENTITY_RUN_INTERVAL:-15m}
      - AGENT_INTRUSION_POLL_INTERVAL=${AGENT_INTRUSION_POLL_INTERVAL:-300}
      - AGENT_INTRUSION_MAX_EVENTS_PER_SOURCE=${AGENT_INTRUSION_MAX_EVENTS_PER_SOURCE:-10000}
      - AGENT_INTRUSION_FETCH_WINDOW_DAYS=${AGENT_INTRUSION_FETCH_WINDOW_DAYS:-10}
      - CORRELATION_WINDOW=${CORRELATION_WINDOW:-168h}
      - CORRELATOR_RUN_INTERVAL=${CORRELATOR_RUN_INTERVAL:-15m}
      - ALERT_WEBHOOK_URL=${HONEYPOT_ALERT_WEBHOOK_URL:-}
      - ALERT_COOLDOWN=${HONEYPOT_ALERT_COOLDOWN:-6h}
      - ALERT_CAMPAIGN_SCORE=${HONEYPOT_ALERT_CAMPAIGN_SCORE:-80}
      # #1750 ingestion-lag alerting. The freshness thresholds are per
      # index and live in worker.rs (derived from each index's own history);
      # these two tune the volume-collapse half. FLOOR_PERCENT is how far
      # below its own weekly baseline an index's last hour may fall before
      # it counts as stalled -- the lowest hour any high-volume index
      # recorded across two healthy weeks was 37% of its median, so 10
      # leaves 3.7x of headroom. MIN_BASELINE is the rate below which a
      # percentage stops meaning anything and freshness alone covers the
      # index.
      - ALERT_INGEST_FLOOR_PERCENT=${HONEYPOT_ALERT_INGEST_FLOOR_PERCENT:-10}
      - ALERT_INGEST_MIN_BASELINE=${HONEYPOT_ALERT_INGEST_MIN_BASELINE:-1000}
      - SANDBOX_ALERT_RISK_SCORE=${SANDBOX_ALERT_RISK_SCORE:-50}
      - LLM_ANALYSIS_ALERT_SEVERITIES=${LLM_ANALYSIS_ALERT_SEVERITIES:-high,critical}
      # #1612 host-local alert signals: log-stream sizes, sandbox/ghidra/
      # cape/github-analysis spool health, and Filebeat stats all need
      # either a bind-mounted host directory or a service URL only this
      # worker container has (see volumes: below) — the Go dashboard read
      # the same paths directly. Windows/GHOSTS sandbox and the three
      # analysis spools stay off (empty var) unless the operator has
      # actually deployed that host-side worker, same as the Go tier.
      - LOG_DIR=/logs
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - SANDBOX_REQUEST_DIR=/sandbox-requests
      - WINDOWS_SANDBOX_RESULTS_DIR=${WINDOWS_SANDBOX_RESULTS_DIR:-}
      - WINDOWS_SANDBOX_REQUEST_DIR=${WINDOWS_SANDBOX_REQUEST_DIR:-}
      - GHOSTS_SANDBOX_RESULTS_DIR=${GHOSTS_SANDBOX_RESULTS_DIR:-}
      - GHOSTS_SANDBOX_REQUEST_DIR=${GHOSTS_SANDBOX_REQUEST_DIR:-}
      - GHIDRA_RESULTS_DIR=${GHIDRA_RESULTS_DIR:-}
      - GHIDRA_REQUEST_DIR=${GHIDRA_REQUEST_DIR:-}
      - GHIDRA_ALERT_RISK_LEVELS=${GHIDRA_ALERT_RISK_LEVELS:-high,critical}
      - GHIDRA_ALERT_ON_CRYPTO=${GHIDRA_ALERT_ON_CRYPTO:-false}
      - CAPE_RESULTS_DIR=${CAPE_RESULTS_DIR:-}
      - CAPE_REQUEST_DIR=${CAPE_REQUEST_DIR:-}
      - GITHUB_ANALYSIS_RESULTS_DIR=${GITHUB_ANALYSIS_RESULTS_DIR:-}
      - GITHUB_ANALYSIS_REQUEST_DIR=${GITHUB_ANALYSIS_REQUEST_DIR:-}
      - GITHUB_ANALYSIS_ALERT_POSITIVES=${GITHUB_ANALYSIS_ALERT_POSITIVES:-10}
      - FILEBEAT_URL=${FILEBEAT_URL:-http://filebeat:5066}
      - TZ=Europe/Berlin
    volumes:
      - type: bind
        source: /opt/stacks/apiary/logs
        target: /logs
        read_only: true
        bind:
          propagation: rslave
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
      - /var/lib/honeypot-sandbox/requests/pending:/sandbox-requests:ro
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-windows-sandbox/requests/pending:/windows-sandbox-requests:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/requests/pending:/ghosts-sandbox-requests:ro
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-ghidra/requests/pending:/ghidra-requests:ro
      - /var/lib/honeypot-cape/results:/cape-results:ro
      - /var/lib/honeypot-cape/requests/pending:/cape-requests:ro
      - /var/lib/honeypot-github/results:/github-analysis-results:ro
      - /var/lib/honeypot-github/requests/pending:/github-analysis-requests:ro
      - /opt/stacks/apiary/analysis/threat-intel:/geoip:ro
    networks:
      - honeynet
    # Every *-results dir above is root:root 0700 (same "old Go dashboard
    # ran as root and bypassed file permissions entirely" gap as backend-
    # worker-importer's identical comment below describes) -- root +
    # DAC_READ_SEARCH only, no DAC_OVERRIDE/write capability, matching that
    # service exactly: this one only ever reads results, same as it does.
    user: "0:0"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    deploy:
      resources:
        # 256M OOM-killed this container repeatedly against real production
        # ES data volume during #1628's first-ever live preflight (kernel
        # dmesg: memcg OOM, anon-rss ~254-260MB at kill time, right at the
        # ceiling) -- CI's fixture-sized ES indices never had enough data
        # for any of the four bundled loops (alert-notifier, attacker-
        # identity, agent-intrusion, correlator) to approach this limit.
        # The follow-up 512M bump (matching backend-service/backend-
        # service-mounted) was itself still not enough under sustained
        # real load: live `docker stats` showed it pinned at 508/512MB and
        # 50.22% CPU (its full 0.5-core quota) simultaneously, causing
        # /healthz to miss its 5s timeout on every check -- the container
        # wasn't crashing this time, just too CPU-starved under its own
        # four-loop-plus-HTTP-server workload to answer in time. cpus
        # raised to 1.0 (matching backend-service-mounted, the next
        # smallest allocation of the three backend-image consumers, and
        # this one runs continuous background loops where that one only
        # answers on-demand requests) and memory to 768M -- the host has
        # 16 cores/91G with 69G free, so there was no real reason either
        # limit was ever this tight.
        #
        # 768M itself then proved not enough either: confirmed live
        # (2026-08-22, dmesg cgroup OOM) killed every ~30s on a fresh
        # restart, anon-rss ~778-782MB every single time -- right at the
        # 786432KB (768MiB) ceiling, before a single cycle completed. A
        # fifth loop (threat-intel) had been added since the 768M number
        # above was set without a further bump, and this container gained
        # DAC_READ_SEARCH+root just above (a real, if usually small, extra
        # footprint). 1536M for real headroom this time rather than another
        # minimum-viable guess -- same "no real reason to keep this tight"
        # reasoning as the 768M bump itself already gave.
        limits: {cpus: "2.0", memory: 1536M}

  dashboard-next:
    <<: *runtime-defaults
    build:
      context: ./frontend-next
      # #3315: the revision this image is built from, baked into the served
      # /build.json and the image's org.opencontainers.image.revision label.
      # Read from this stack's .env, not invented here -- compose cannot run
      # `git rev-parse`, and this stack's synced directory carries no .git (see
      # docs/ARCANE-GIT-SYNC.md), so whatever builds the image has to say which
      # commit it is. Unset is the honest default and produces
      # {"revision":"unknown"} plus an `unknown` label rather than a build
      # failure: scripts/verify-deploy.sh reports an unstamped image as its own
      # finding, which is more use than a red build that gets reverted.
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: apiary-dashboard-next:latest
    # build: same "never pushed to any registry, Arcane's redeploy pulls
    # unconditionally" issue as apiary-backend:latest above -- this one has
    # its own build: right here though, so always build instead of pull.
    pull_policy: build
    container_name: hp-dashboard-next
    restart: unless-stopped
    depends_on:
      oidc-sessions:
        condition: service_healthy
    environment:
      - PORT=8080
      - SERVE_MODE=${DASHBOARD_SERVE_MODE:-all}
      - BACKEND_URL=http://backend-service:8081
      # #1612 phase 3a/3b wiring: sandbox/ghidra/github-analysis submission,
      # sandbox golden-image-status and vnc status, and the whole workbench
      # orchestrator surface only work against the write-capable mounted
      # instance below (main.rs's own comment on that route block explains
      # why: same route table as backend-service, but only this container
      # has the host-side request-spool mounts). serviceFetch/serviceJSON's
      # `{ mounted: true }` callers resolve to this URL, not BACKEND_URL.
      - BACKEND_MOUNTED_URL=http://backend-service-mounted:8082
      - BFF_INTERNAL_URL=${BFF_INTERNAL_URL:-}
      # #2183: empty SERVICE_TOKEN refuses to boot with [E-SERVICE-TOKEN];
      # the override below is the one sanctioned dev escape hatch, the same
      # env contract backend-service(-mounted) and this container share.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://auth.example.invalid/realms/apiary}
      # #1682: events.html's "Open in Kibana/EveBox/Arkime" per-event menu
      # (dashboard/links.go's investigationURL/investigationBase) — unset
      # by default, same as the Go tier, so no link renders until an
      # operator who has actually deployed arcane/home/honeypot-elk points
      # these at it. Per-tool var wins; HONEYPOT_DOMAIN derives
      # https://{kibana,evebox,arkime}.<domain> as a fallback.
      - HONEYPOT_DOMAIN=${HONEYPOT_DOMAIN:-}
      - KIBANA_PUBLIC_URL=${KIBANA_PUBLIC_URL:-}
      - EVEBOX_PUBLIC_URL=${EVEBOX_PUBLIC_URL:-}
      - ARKIME_PUBLIC_URL=${ARKIME_PUBLIC_URL:-}
      # #1628 staged/beta path: a dedicated var, not the shared
      # OIDC_EXTERNAL_URL production uses, since oidc.server.ts builds its
      # redirect_uri directly from this and Keycloak only accepts a
      # registered exact match — dashboard-next needs its own if it's ever
      # reachable at a different host than production (beta.honeypot.*)
      # without breaking either flow. Defaults to OIDC_EXTERNAL_URL so
      # today's behavior (same host as production) is unchanged until an
      # operator sets DASHBOARD_NEXT_OIDC_EXTERNAL_URL explicitly.
      - OIDC_EXTERNAL_URL=${DASHBOARD_NEXT_OIDC_EXTERNAL_URL:-${OIDC_EXTERNAL_URL:-https://honeypot.example.invalid}}
      - OIDC_CLIENT_ID=apiary-dashboard
      - OIDC_CLIENT_SECRET_FILE=/run/dashboard-secrets/oidc-client-secret
      - OIDC_SESSION_REDIS_URL=redis://oidc-sessions:6379/0
      - TZ=Europe/Berlin
      # #1616 scalability tuning — every var below has a code default
      # (cluster.mjs / backpressure.server.ts) and is safe to leave unset;
      # these overrides exist so an operator can retune without a rebuild.
      - WEB_CONCURRENCY=${DASHBOARD_WEB_CONCURRENCY:-}
      - BACKEND_MAX_INFLIGHT=${DASHBOARD_BACKEND_MAX_INFLIGHT:-}
      - BACKEND_MAX_QUEUE=${DASHBOARD_BACKEND_MAX_QUEUE:-}
      - BACKEND_HTTP_MAX_SOCKETS=${DASHBOARD_BACKEND_HTTP_MAX_SOCKETS:-}
      # #1972 durable BFF app log: named outcomes only (sign-in
      # started/failed/completed, and anything else that goes through obs
      # server's recordNamedEvent), not one line per request -- the Rust tier's
      # stream carries per-request volume, this one carries the events you
      # otherwise grep stdout for and lose on redeploy (#1942's invisible auth
      # failures were exactly that). Username is deliberately never among the
      # fields. File reopened per write, so rename rotation works without a
      # signal. Provisioned (mkdir + chown 1000) by honeypot-init's log-init.
      - DASHBOARD_BFF_LOG_FILE=${DASHBOARD_BFF_LOG_FILE:-/logs/dashboard-bff/app.jsonl}
    # 19090: the live production binding, moved here permanently by #1628's
    # cutover (previously a cutover-dashboard.sh-generated override.yml
    # layer, not checked in -- moved into the real compose.yml once the
    # cutover held through step 7's live validation, exactly as the
    # runbook itself anticipated: a live-only override risks a later
    # Arcane gitops-sync silently reverting it, and in fact did worse than
    # that live -- with `dashboard`'s now-removed conflicting ports: line
    # still present, a routine sync failed outright trying to rebind
    # 19090 out from under this container).
    ports:
      - "${HP_BIND:-10.8.0.2}:19090:8080"
    volumes:
      - ${DASHBOARD_SECRETS_DIR:-/var/dockge/stacks/honeypot-dashboard/secrets}:/run/dashboard-secrets:ro
      # #1972 read-write: appends DASHBOARD_BFF_LOG_FILE as the node user
      # (uid 1000 -- chowned by honeypot-init's log-init step, same story as
      # the group_add above but for a path that must stay writable).
      - /opt/stacks/apiary/logs/dashboard-bff:/logs/dashboard-bff
    # The secrets dir's own files are -r--rw---- github-deploy-runner:
    # deploy-runner (Arcane's own deploy-time provisioning owner). The old
    # Go dashboard reading the same mount never needed this: it runs as
    # root (no USER in its Dockerfile), which bypasses file permissions
    # entirely. dashboard-next correctly runs as the frontend-next
    # Dockerfile's unprivileged `node` user instead, so it needs actual
    # group membership -- confirmed live (EACCES reading oidc-client-
    # secret, #1628) that nothing had granted it that. group_add joins
    # the container process to deploy-runner's GID without loosening the
    # file's own permissions for anything else. It has to be a GID rather than
    # a name: /etc/group exists on the host, not inside this image.
    #
    # Interpolated, NOT the literal 980 it used to be. System GIDs are handed
    # out in creation order, so they are a property of how a host was built
    # rather than a constant. After the 2026-09-03 rebuild, 980 belonged to
    # github-ci-runner-3 and deploy-runner had become 977 -- so the container
    # joined an unrelated CI group, could not read the secret, and every
    # sign-in failed with EACCES while the UI blamed Keycloak. The installer
    # writes the host's real GID into this stack's .env; the 980 default only
    # preserves the historical value for a host that has not been through it.
    group_add:
      - "${DEPLOY_RUNNER_GID:-980}"
    networks:
      - honeynet
      - oidc-session
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # #1983: dashboard-next was the last service in this stack -- and the
    # only one repo-wide (32 other stacks scanned, YAML anchors and inline
    # flow-style maps accounted for) -- without any compose resource
    # ceiling, and it is precisely the component exposed to unauthenticated
    # internet traffic through the VPS gateway. Its RSS scales with both
    # request load and concurrent live streams (the BFF proxies/SSE-streams
    # backend responses), so runaway growth here previously ended at the
    # kernel OOM-killer picking *some* victim on this shared host --
    # possibly not this container, starving elasticsearch or postgres
    # instead. With a ceiling, exhaustion kills THIS container
    # (restart: unless-stopped recovers it) instead of its neighbours.
    #
    # Sizing is operator judgment, not a measured maximum: steady state on
    # the homeserver is ~80MiB (docker stats, 2026-08-26) at the default
    # WEB_CONCURRENCY=min(4, cpus) cluster workers, and the backpressure
    # knobs in the environment block above already bound inflight requests
    # and queue depth. 512M sits ~6x above today's footprint with room for
    # per-worker SSR plus live-stream headroom across all four workers;
    # if real traffic proves it tight, raise it deliberately -- the point
    # of the number is blast-radius containment, not thrift.
    #
    # #2051: HEALTHCHECK is baked into dashboard-next's Dockerfile itself,
    # invisible to a compose-only grep for healthcheck:.
    labels:
      - autoheal=true
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

  # #1610 worker migration: Rust port of the retired Python
  # es-results-importer (removed with the completed cutover — an older git
  # commit is the only way back, deliberately). A separate service from
  # backend-worker, not an extra WORKER_LOOPS entry bolted onto it: this
  # worker needs root + DAC_READ_SEARCH privilege escalation
  # (Ghidra/GitHub-analysis result directories are root-owned host bind
  # mounts a normal container user can't read) plus a persistent local
  # dedup-state file — backend-worker is deliberately unprivileged and
  # stateless-by-design (see its own compose comment: "movable to any
  # docker host... state in ES"), and every other loop running there
  # (alert-notifier, reports-scheduler, user-retention-sweep) needs neither.
  # Also separate from backend-service-mounted (that boundary is about
  # WRITE access to host request spools; this one only ever reads results).
  backend-worker-importer:
    <<: *runtime-defaults
    image: apiary-backend:latest
    # never: see backend-service-mounted's own comment above -- same image,
    # no build: here, built by the sibling honeypot-dashboard-backend stack.
    pull_policy: never
    container_name: hp-apiary-worker-importer
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=127.0.0.1:8098
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # #1677: addresses belonging to this fleet, excluded from the
      # dashboard's attacker aggregations. Suricata records `source.ip` as
      # whichever end it saw as the source, so our own hosts appear as
      # "attackers" for both halves of every attacker session and for their
      # own outbound traffic -- the VPS's public address was the #2 attacker
      # at 607,288 events over 48h. The tunnel peer is always excluded
      # whether or not it is listed here. Comma-separated.
      - HONEYPOT_SELF_IPS=${HONEYPOT_SELF_IPS:-}
      # #2299: loop-only role, still subject to the #2183 boot gate.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      # #2320: the other half of the same gate. Env forwarding is
      # per-service, so an empty-token deployment opts each role out
      # individually -- leaving this off loop-only roles made them
      # crash-loop on [E-SERVICE-TOKEN] while serving roles above booted
      # on APIARY_ALLOW_UNAUTH_DEV=1. check-backend-boot-contract.py
      # fails CI if any WORKER_LOOPS consumer drops either half again.
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      - WORKER_LOOPS=es-results-importer
      - IMPORT_INTERVAL=${ES_IMPORTER_INTERVAL:-300}
      - IMPORTER_STATE=/state-importer/es-results-importer.json
      - SHARD_COUNT=${ES_IMPORTER_SHARD_COUNT:-1}
      - GHIDRA_RESULTS_DIR=/ghidra-results
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - WINDOWS_SANDBOX_RESULTS_DIR=/windows-sandbox-results
      - GHOSTS_SANDBOX_RESULTS_DIR=/ghosts-sandbox-results
      - GITHUB_ANALYSIS_RESULTS_DIR=/github-analysis-results
      - REVDECK_RESULTS_DIR=/revdeck-results
      - CAPE_RESULTS_DIR=/cape-results
      - COWRIE_TTYLOG_DIR=/cowrie-tty
      # #1611 workstream B: mailoney's saved SMTP DATA bodies -- Rust-only,
      # no Python-importer.py equivalent, since src/mail.rs's
      # GET /api/v1/mail/{session_id} is itself new (#1611) functionality.
      - MAILONEY_MAIL_DIR=/mailoney-mail
      - REPORTER_METRICS_DIR=/reporter-data
      - YARA_RESULTS_DIR=/yara-results
      - TZ=Europe/Berlin
    volumes:
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-github/results:/github-analysis-results:ro
      - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
      - /var/lib/honeypot-cape/results:/cape-results:ro
      - es-importer-state:/state-importer
      - /opt/stacks/apiary/logs/cowrie/tty:/cowrie-tty:ro
      - /opt/stacks/apiary/logs/mailoney/mail:/mailoney-mail:ro
      - reporter-data:/reporter-data:ro
      - yara-results:/yara-results:ro
    networks:
      - honeynet
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # #1610: ip-enrichment-worker. Unlike every other backend-* service in
  # this file, this loop never touches Elasticsearch (or any network) at
  # all -- it tails raw sensor JSON logs and rewrites tunnel-peer-masked
  # src_ip fields via a portbridge via_port join, writing the result to
  # OUT_DIR for Filebeat to tail instead of the raw file. A distinct
  # compose service from backend-worker (whose other loops all need to
  # reach Elasticsearch) and backend-service-mounted (whose write access is
  # scoped to host-worker request spools, not raw sensor logs), same
  # "distinct trust/mount boundary, distinct service" precedent as
  # backend-worker-importer above -- network_mode: none is a deliberate
  # security posture carried over unchanged from the Go worker's own
  # compose service, matching services-adapter's identical reasoning below.
  # Read-only for every sensor's raw log directory and portbridge's own
  # connection log; a separate, more specific read-write mount for the one
  # subdirectory this worker actually writes to (Docker resolves the more
  # specific bind for overlapping paths).
  backend-worker-enrichment:
    <<: *runtime-defaults
    image: apiary-backend:latest
    # never: see backend-service-mounted's own comment above -- same image,
    # no build: here, built by the sibling honeypot-dashboard-backend stack.
    pull_policy: never
    container_name: hp-apiary-worker-enrichment
    restart: unless-stopped
    network_mode: none
    environment:
      # #2299: loop-only role (offline, network_mode: none), still subject
      # to the #2183 boot gate.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      # #2320: the other half of the same gate. Env forwarding is
      # per-service, so an empty-token deployment opts each role out
      # individually -- leaving this off loop-only roles made them
      # crash-loop on [E-SERVICE-TOKEN] while serving roles above booted
      # on APIARY_ALLOW_UNAUTH_DEV=1. check-backend-boot-contract.py
      # fails CI if any WORKER_LOOPS consumer drops either half again.
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      - WORKER_LOOPS=ip-enrichment
      - LOGS_DIR=/logs
      - OUT_DIR=/logs/enriched
      - STATE_DIR=/state/ip-enrichment-worker
      - REFRESH_INTERVAL=2s
      - PENDING_TIMEOUT=5s
      - OUTPUT_MAX_BYTES=${JSON_STREAM_MAX_BYTES:-67108864}
      - TZ=Europe/Berlin
    volumes:
      - /opt/stacks/apiary/logs:/logs:ro
      - /opt/stacks/apiary/logs/enriched:/logs/enriched:rw
      - /opt/stacks/apiary/state/ip-enrichment-worker:/state/ip-enrichment-worker:rw
    # /logs/enriched is github-deploy-runner:github-deploy-runner (994:979,
    # Arcane's own deploy-time provisioning owner) on disk, same as the
    # dashboard-secrets dir dashboard-next mounts above. This image runs
    # unprivileged (nobody), so without group membership every open() here
    # fails EACCES -- confirmed live: every single source failed to open
    # its output file from the container's first log line onward, silently
    # (WARN, not fatal), so the container reported healthy the entire time
    # while shipping zero enrichment output and every dependent sensor
    # (everything Filebeat tails from /logs/enriched/*.json -- see
    # honeypot-elk/analysis/filebeat.yml's own #746 comment for the full
    # list) went STALE the moment the retired Go worker's last write aged
    # out. Same group_add fix as dashboard-next's identical EACCES above -- and
    # the same interpolation, for the same reason. This was the literal 979,
    # which after the 2026-09-03 rebuild belonged to github-ci-runner-4 rather
    # than deploy-runner. The failure was exactly what this comment predicts:
    # 22 "open output failed ... Permission denied" WARNs, /logs/enriched empty,
    # and the container reporting healthy throughout while every Filebeat
    # consumer of /logs/enriched/*.json went stale.
    group_add:
      # Same value as dashboard-next's group_add above, deliberately. These two
      # disagreed (980 vs 979) while naming the same group, so whichever
      # fallback happened to be wrong on a given host silently mis-grouped one
      # of the two containers. Neither number is meaningful on its own: a GID
      # is host-specific, and step_pin_deploy_runner_gid writes the real one
      # into this stack's .env. The literal only covers a host that has not
      # been through that step, so both must at least agree.
      - "${DEPLOY_RUNNER_GID:-980}"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # #1610 worker migration, closing the last unwired gap: payload_inventory.rs
  # (payload-inventory-worker's Rust port) has existed since #1610 and even
  # had its own worker.rs match arm, but nothing ever set
  # WORKER_LOOPS=payload-inventory anywhere in THIS file -- so within this
  # stack the code shipped, compiled, and was dead, and the standalone Go
  # worker below stayed the only thing keeping dashboard-payload-inventory-v1/
  # dashboard-payload-bytes-v1 current. Found auditing #1630's "still-Go,
  # not yet ported" follow-up (#1649).
  #
  # That audit was scoped to this file and missed what ccc4cb61 (#1622) had
  # already done three days earlier: the sibling honeypot-dashboard-backend
  # stack wired the same loop into backend-service's WORKER_LOOPS. Both ran
  # until #2110 removed the sibling copy -- this dedicated service is now
  # the fleet's ONLY payload-inventory runner (isolated resource limits,
  # off the request/response tier), which is exactly where the loop belongs.
  #
  # Needs its own service rather than an entry bolted onto backend-worker,
  # same reasoning as backend-worker-importer/-enrichment above:
  # backend-worker is deliberately host-mount-free (see its own "movable to
  # any docker host" comment), and this loop needs read access to both
  # payload capture sources -- the exact PAYLOAD_DIRS mounts dashboard/
  # dashboard-next already carry -- plus a live ES connection (unlike
  # backend-worker-enrichment just above, which is network_mode: none).
  backend-worker-payload-inventory:
    <<: *runtime-defaults
    image: apiary-backend:latest
    # never: see backend-service-mounted's own comment above -- same image,
    # no build: here, built by the sibling honeypot-dashboard-backend stack.
    pull_policy: never
    container_name: hp-apiary-worker-payload-inventory
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=127.0.0.1:8097
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # #1677: addresses belonging to this fleet, excluded from the
      # dashboard's attacker aggregations. Suricata records `source.ip` as
      # whichever end it saw as the source, so our own hosts appear as
      # "attackers" for both halves of every attacker session and for their
      # own outbound traffic -- the VPS's public address was the #2 attacker
      # at 607,288 events over 48h. The tunnel peer is always excluded
      # whether or not it is listed here. Comma-separated.
      - HONEYPOT_SELF_IPS=${HONEYPOT_SELF_IPS:-}
      # #2299: loop-only role, still subject to the #2183 boot gate.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      # #2320: the other half of the same gate. Env forwarding is
      # per-service, so an empty-token deployment opts each role out
      # individually -- leaving this off loop-only roles made them
      # crash-loop on [E-SERVICE-TOKEN] while serving roles above booted
      # on APIARY_ALLOW_UNAUTH_DEV=1. check-backend-boot-contract.py
      # fails CI if any WORKER_LOOPS consumer drops either half again.
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      - WORKER_LOOPS=payload-inventory
      - PAYLOAD_DIRS=/dionaea-lib/binaries,/cowrie-downloads
      - SCAN_INTERVAL=${PAYLOAD_INVENTORY_SCAN_INTERVAL:-5m}
      - TZ=Europe/Berlin
    volumes:
      - dionaea-lib:/dionaea-lib:ro
      - /opt/stacks/apiary/logs/cowrie/downloads:/cowrie-downloads:ro
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  services-adapter:
    <<: *runtime-defaults
    build: ./services-adapter
    container_name: hp-services-adapter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - services-adapter-socket:/run/services-adapter
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    # Talks to the Docker daemon over docker.sock and to dashboard over the
    # services-adapter-socket volume only (confirmed: no TCP/HTTP client
    # anywhere in services-adapter.py) -- no network needed at all. Also
    # sidesteps this host's address-pool exhaustion (many Compose projects
    # already claim a bridge each; the implicit per-project default network
    # this service would otherwise get failed to create with "all predefined
    # address pools have been fully subnetted" the first time this stack was
    # deployed).
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  oidc-session:
    internal: true
  # Shared with the main stack -- explicit fixed name, not project-prefixed,
  # non-external. See this file's header.
  honeynet:
    name: honeynet
    driver: bridge

volumes:
  # Shared with the main stack (dionaea/yara-scanner write, this stack only
  # reads) -- explicit fixed name, matching docker-compose.yml's own
  # declaration exactly, same mechanism as honeynet above.
  dionaea-lib:
    name: dionaea-lib
  yara-results:
    name: yara-results
  # #666: shared with arcane/home/honeypot-utilities/compose.yml -- reporter writes,
  # backend-worker-importer here only reads. Same mechanism as dionaea-lib.
  reporter-data:
    name: reporter-data
  # Also shared with the main stack, both ways -- payload-dedupe and
  # yara-scanner there read/write retained script payloads under
  # /payloads/scripts, the same volume this stack's own /state resolves to.
  # See this file's header for why this one, unlike services-adapter-socket
  # below, cannot be left project-scoped.
  dashboard-state:
    name: dashboard-state
  # Was private/unnamed here ("nothing else references it") until #1622
  # moved backend-service (also a consumer, see that service's own
  # SERVICES_ADAPTER_SOCKET env var) into the sibling honeypot-dashboard-
  # backend stack -- now given an explicit shared name, same mechanism as
  # dionaea-lib/dashboard-state above, so both projects resolve the same
  # underlying Docker volume. honeypot-dashboard-backend/compose.yml
  # declares the identical name.
  services-adapter-socket:
    name: services-adapter-socket
  # #378: backend-worker-importer's last-imported-mtime bookkeeping. Private
  # to that service -- losing it just means the next pass re-sends every
  # result once (idempotent, deterministic _id), not a data loss.
  es-importer-state: null
