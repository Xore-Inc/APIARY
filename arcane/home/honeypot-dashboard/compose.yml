# honeypot-dashboard -- since #3749 (2026-10-30) this project carries only
# `backend-service-mounted`; the dashboard UI is Xore-Inc/apiary-dashboard
# (arcane/home/apiary-dashboard there) and the workers are
# honeypot-backend-workers. The history below explains the shared names.
#
# honeypot-dashboard — #258: dashboard + services-adapter split into their
# own Dockge-managed stack, deployed as /opt/stacks/honeypot-dashboard.
#
# Unlike the standalone honeypot personas already split out (conpot, cowrie,
# multipot, http, dnp3 -- see arcane/home/honeypot-conpot/compose.yml's header for that
# reasoning), this pair genuinely needs cross-stack access: dashboard talks
# to elasticsearch/filebeat by service-name DNS over the shared `honeynet`
# network, and reads/writes three named volumes the main stack also touches
# -- dionaea-lib and yara-results (dionaea/yara-scanner write, this stack
# only reads), and dashboard-state (genuinely shared both ways: payload-
# dedupe and yara-scanner in the main stack read/write retained script
# payloads under /payloads/scripts, the same subtree this stack's own
# SCRIPT_PAYLOAD_DIR=/state/script-payloads writes). This is the "harder
# case" #258 raised -- resolved the same way this repo already resolves it
# for honeypot-init (see docker-compose.yml's own networks: comment and
# arcane/home/honeypot-init/compose.yml's header): give the shared network/volumes an
# explicit, non-external `name:` in every stack that touches them. Compose
# creates a named resource if absent or transparently reuses it if a
# same-named one already exists -- no `external: true` pre-creation dance
# needed, and no --link/legacy networking either. Confirmed this already
# works live in production before relying on it here: honeypot-init's
# elasticsearch-setup job resolves `http://elasticsearch:9200` by bare
# service name across the project boundary, over this exact same honeynet,
# today.
#
# services-adapter moves together with dashboard, not out on its own: the
# two communicate over services-adapter-socket -- a volume that, at the time
# of this #258 split, genuinely nothing else touched (confirmed -- grepped
# for it across every compose file), so there was no reason to split them
# into separate projects. Originally left unnamed/project-scoped here -- a
# fresh volume in the new project, not migrated from the old one -- per
# explicit instruction that this split does not need to preserve existing
# state across the cutover. dashboard-state got the opposite treatment
# (explicit shared name) precisely because, unlike the socket at the time,
# other services still depended on it.
#
# That "nothing else touches it" premise no longer holds: #1622 moved
# backend-service (a third consumer of this same socket) into the sibling
# honeypot-dashboard-backend stack, so services-adapter-socket below now
# also carries an explicit shared `name:`, same mechanism as dionaea-lib/
# dashboard-state.
#
# The log-path half of this claim held; the EXPECTED_SENSORS half did not
# survive: that expectation list was removed when the cutover completed
# (commit 824aa33d, #1628), and source-health today derives sensor liveness
# from observed event.sensor values (backend-service/src/health.rs) rather
# than a static list (#2359). Every /logs-derived, host-bind-mounted path
# is unaffected by the move: the dashboard reads sensor activity from log
# files at their existing host paths regardless of which compose project
# produced them, exactly as already proven by the five sensor splits before
# this one.

name: honeypot-dashboard

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  # #3749: the legacy frontend (`dashboard-next`, frontend-next) and its
  # session valkey (`oidc-sessions`) were removed after production moved to
  # Xore-Inc/apiary-dashboard on 2026-10-30 (#3579 D4). Last legacy image:
  # sha256:f5116658b71b73b7576aa5fc923ad19676f840411627b2d790d1d5f755f379ce.
  #
  # #3575: backend-worker, backend-worker-importer, backend-worker-enrichment,
  # backend-worker-payload-inventory and services-adapter moved to
  # arcane/home/honeypot-backend-workers (GHCR image by digest, same container
  # and volume names). Do not add them back here: the fixed names would clash.

  # #1612 mounted worker role (phase 3a/3b): sandbox/ghidra/github-analysis
  # submission, the Payload Workbench orchestrator, and anything else that
  # needs to WRITE into a host-side request spool. Deliberately a separate
  # service from backend-service, not an extra mount bolted onto it: those
  # spool dirs are the dashboard's only path to root-owned host workers
  # (services-adapter is a narrow socket; these are real filesystem write
  # access), a distinct trust/mount boundary worth keeping visible in the
  # compose file rather than folding into backend-service's Phase-1 (state
  # + services-adapter-socket) scope. Also distinct from backend-worker:
  # this one serves HTTP request/response for submissions (LISTEN_ADDR is
  # network-reachable), where backend-worker only runs background loops and
  # binds loopback-only. Same image, same route table (routes aren't
  # container-specific — see main.rs) — reachable internally at
  # http://backend-service-mounted:8082; BFF wiring is a follow-up (owned
  # by the parallel frontend track).
  backend-service-mounted:
    <<: *runtime-defaults
    image: apiary-backend:latest
    # never: this image has no build: here on purpose (built by the sibling
    # honeypot-dashboard-backend stack's own backend-service service, shared
    # by local tag) and was never pushed to any registry -- Arcane's
    # redeploy does an unconditional `docker compose pull` across every
    # image in the file, which fails outright ("repository does not exist")
    # without this. Redeploying honeypot-dashboard-backend first keeps the
    # local tag current for every service below that references it.
    pull_policy: never
    container_name: hp-apiary-backend-mounted
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=0.0.0.0:8082
      # The mounted HTTP API can move separately from sensor-bound workers.
      # Override only after #3577 provides a private authenticated ES path.
      - ELASTICSEARCH_URL=${BACKEND_MOUNTED_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - HONEYPOT_TUNNEL_PEER_IP=${HONEYPOT_TUNNEL_PEER_IP:-10.8.0.1}
      - HONEYPOT_TUNNEL_SENSOR_IP=${HONEYPOT_TUNNEL_SENSOR_IP:-10.8.0.2}
      # #3685: the #1801 workbench-reconcile sweep no longer runs here -- it
      # moved to backend-worker (WORKER_LOOPS there), which already carries
      # every spool mount it reads, read-only, and sits on the homeserver
      # next to those spools. This service stays a pure HTTP API (no
      # WORKER_LOOPS), so it can move to the precision host later without
      # dragging a cross-host spool read along (#3592 decision 2). It keeps
      # its own spool mounts below: get_run/child_action still reconcile on
      # request and child_action removes cancelled .request markers.
      # #1677: addresses belonging to this fleet, excluded from the
      # dashboard's attacker aggregations. Suricata records `source.ip` as
      # whichever end it saw as the source, so our own hosts appear as
      # "attackers" for both halves of every attacker session and for their
      # own outbound traffic -- the VPS's public address was the #2 attacker
      # at 607,288 events over 48h. The tunnel peer is always excluded
      # whether or not it is listed here. Comma-separated.
      - HONEYPOT_SELF_IPS=${HONEYPOT_SELF_IPS:-}
      # #2183: empty SERVICE_TOKEN refuses to boot with [E-SERVICE-TOKEN];
      # the override below is the one sanctioned dev escape hatch.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      # #3577: rotation overlap and verified actor assertions. All optional;
      # unset keeps the pre-#3577 behaviour (ACTOR_ASSERTION_MODE=off).
      # Runbook: docs/BACKEND-TRUST-BOUNDARY.md.
      - SERVICE_TOKEN_PREVIOUS=${DASHBOARD_SERVICE_TOKEN_PREVIOUS:-}
      - SERVICE_TOKEN_PREVIOUS_UNTIL=${DASHBOARD_SERVICE_TOKEN_PREVIOUS_UNTIL:-}
      - ACTOR_ASSERTION_MODE=${ACTOR_ASSERTION_MODE:-off}
      - ACTOR_ASSERTION_PUBLIC_KEY=${ACTOR_ASSERTION_PUBLIC_KEY:-}
      - ACTOR_ASSERTION_PUBLIC_KEY_PREVIOUS=${ACTOR_ASSERTION_PUBLIC_KEY_PREVIOUS:-}
      - ACTOR_ASSERTION_PUBLIC_KEY_PREVIOUS_UNTIL=${ACTOR_ASSERTION_PUBLIC_KEY_PREVIOUS_UNTIL:-}
      - SANDBOX_REQUEST_DIR=/sandbox-requests
      - WINDOWS_SANDBOX_REQUEST_DIR=${WINDOWS_SANDBOX_REQUEST_DIR:-}
      - GHOSTS_SANDBOX_REQUEST_DIR=${GHOSTS_SANDBOX_REQUEST_DIR:-}
      - WINDOWS_SANDBOX_RESULTS_DIR=${WINDOWS_SANDBOX_RESULTS_DIR:-}
      - GHOSTS_SANDBOX_RESULTS_DIR=${GHOSTS_SANDBOX_RESULTS_DIR:-}
      - GHIDRA_REQUEST_DIR=${GHIDRA_REQUEST_DIR:-}
      - GHIDRA_RESULTS_DIR=${GHIDRA_RESULTS_DIR:-}
      - GITHUB_ANALYSIS_REQUEST_DIR=${GITHUB_ANALYSIS_REQUEST_DIR:-}
      # #1612 phase 3b: Payload Workbench orchestrator. REVDECK_RESULTS_DIR
      # is also fed by ghidra-worker.py's drain_revdeck() for the "ghidra"
      # analyzer's embedded RevDeck enrichment (read, not written, here) —
      # SANDBOX_RESULTS_DIR is read-write-adjacent: this service only reads
      # it (on-request reconciliation), the host-side worker owns writing
      # job results.
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - REVDECK_REQUEST_DIR=${REVDECK_REQUEST_DIR:-}
      - REVDECK_RESULTS_DIR=${REVDECK_RESULTS_DIR:-}
      - PAYLOAD_DIRS=/dionaea-lib/binaries,/cowrie-downloads
      - SCRIPT_PAYLOAD_DIR=/state/script-payloads
      # #1972: same durable per-request app log as backend-service (obs.rs,
      # see honeypot-dashboard-backend/compose.yml), own directory so the two
      # instances stay separate files for filebeat's registry while shipping
      # into the shared dashboard-backend-v1-* index family. Workbench/sandbox
      # submissions are exactly the requests you'll want a line for.
      - DASHBOARD_LOG_FILE=${DASHBOARD_LOG_FILE:-/logs/dashboard-backend-mounted/app.jsonl}
      - TZ=Europe/Berlin
    volumes:
      - dashboard-state:/state
      - dionaea-lib:/dionaea-lib:ro
      - /opt/stacks/apiary/logs/cowrie/downloads:/cowrie-downloads:ro
      # #1972 read-write: this instance CREATES its own app.jsonl, same
      # provisioning/chown posture as backend-service's (log-init step,
      # uid 65534).
      - /opt/stacks/apiary/logs/dashboard-backend-mounted:/logs/dashboard-backend-mounted
      # Read-write: this service is the one thing that CREATES these
      # markers. Windows/GHOSTS/Ghidra/GitHub-analysis/Rev·Deck stay inert
      # (empty env var above) until the operator has actually deployed that
      # host-side worker, same posture as every other optional spool in
      # this stack.
      - /var/lib/honeypot-sandbox/requests/pending:/sandbox-requests
      - /var/lib/honeypot-windows-sandbox/requests/pending:/windows-sandbox-requests
      - /var/lib/honeypot-ghosts-sandbox/requests/pending:/ghosts-sandbox-requests
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-ghidra/requests/pending:/ghidra-requests
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-github/requests/pending:/github-analysis-requests
      - /var/lib/honeypot-revdeck/requests/pending:/revdeck-requests
      - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
      # Read-only: on-request reconciliation polls job-completion state
      # directly off disk (never through the ES mirror — see
      # workbench_orchestrator.rs's module comment), the same reasoning
      # golden-image-status already established for
      # WINDOWS_SANDBOX_RESULTS_DIR above. The periodic sweep that does the
      # same for idle runs lives in backend-worker (#3685).
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
    networks:
      - honeynet
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

networks:
  # Shared with the main stack -- explicit fixed name, not project-prefixed,
  # non-external. See this file's header.
  honeynet:
    name: honeynet
    driver: bridge

volumes:
  # Shared with the main stack (dionaea/yara-scanner write, this stack only
  # reads) -- explicit fixed name, matching docker-compose.yml's own
  # declaration exactly, same mechanism as honeynet above.
  dionaea-lib:
    name: dionaea-lib
  # Also shared with the main stack, both ways -- payload-dedupe and
  # yara-scanner there read/write retained script payloads under
  # /payloads/scripts, the same volume this stack's own /state resolves to.
  # See this file's header for why this one cannot be left project-scoped.
  dashboard-state:
    name: dashboard-state
  # #3575: yara-results, reporter-data, services-adapter-socket and
  # es-importer-state are declared by honeypot-backend-workers, which owns
  # their consumers now.
