# honeypot-dashboard — #258: dashboard + services-adapter split into their
# own Dockge-managed stack, deployed as /opt/stacks/honeypot-dashboard.
#
# Unlike the standalone honeypot personas already split out (conpot, cowrie,
# multipot, http, dnp3 -- see arcane/home/honeypot-conpot/compose.yml's header for that
# reasoning), this pair genuinely needs cross-stack access: dashboard talks
# to elasticsearch/filebeat by service-name DNS over the shared `honeynet`
# network, and reads/writes three named volumes the main stack also touches
# -- dionaea-lib and yara-results (dionaea/yara-scanner write, this stack
# only reads), and dashboard-state (genuinely shared both ways: payload-
# dedupe and yara-scanner in the main stack read/write retained script
# payloads under /payloads/scripts, the same subtree this stack's own
# SCRIPT_PAYLOAD_DIR=/state/script-payloads writes). This is the "harder
# case" #258 raised -- resolved the same way this repo already resolves it
# for honeypot-init (see docker-compose.yml's own networks: comment and
# arcane/home/honeypot-init/compose.yml's header): give the shared network/volumes an
# explicit, non-external `name:` in every stack that touches them. Compose
# creates a named resource if absent or transparently reuses it if a
# same-named one already exists -- no `external: true` pre-creation dance
# needed, and no --link/legacy networking either. Confirmed this already
# works live in production before relying on it here: honeypot-init's
# elasticsearch-setup job resolves `http://elasticsearch:9200` by bare
# service name across the project boundary, over this exact same honeynet,
# today.
#
# services-adapter moves together with dashboard, not out on its own: the
# two communicate over services-adapter-socket -- a volume that, at the time
# of this #258 split, genuinely nothing else touched (confirmed -- grepped
# for it across every compose file), so there was no reason to split them
# into separate projects. Originally left unnamed/project-scoped here -- a
# fresh volume in the new project, not migrated from the old one -- per
# explicit instruction that this split does not need to preserve existing
# state across the cutover. dashboard-state got the opposite treatment
# (explicit shared name) precisely because, unlike the socket at the time,
# other services still depended on it.
#
# That "nothing else touches it" premise no longer holds: #1622 moved
# backend-service (a third consumer of this same socket) into the sibling
# honeypot-dashboard-backend stack, so services-adapter-socket below now
# also carries an explicit shared `name:`, same mechanism as dionaea-lib/
# dashboard-state.
#
# The log-path half of this claim held; the EXPECTED_SENSORS half did not
# survive: that expectation list was removed when the cutover completed
# (commit 824aa33d, #1628), and source-health today derives sensor liveness
# from observed event.sensor values (backend-service/src/health.rs) rather
# than a static list (#2359). Every /logs-derived, host-bind-mounted path
# is unaffected by the move: the dashboard reads sensor activity from log
# files at their existing host paths regardless of which compose project
# produced them, exactly as already proven by the five sensor splits before
# this one.

name: honeypot-dashboard

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  # #3575: backend-worker, backend-worker-importer, backend-worker-enrichment,
  # backend-worker-payload-inventory and services-adapter moved to
  # arcane/home/honeypot-backend-workers (GHCR image by digest, same container
  # and volume names). Do not add them back here: the fixed names would clash.
  oidc-sessions:
    <<: *runtime-defaults
    image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: hp-dashboard-oidc-sessions
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    networks: [oidc-session]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - autoheal=true
    read_only: true
    # #1026: quoted -- the unquoted form's comma between size= and mode=
    # was parsed by YAML as a flow-sequence separator, splitting this into
    # two invalid tmpfs entries ("/data:size=16m" and "mode=0700") and
    # making Docker reject "mode=0700" as a non-absolute mount path.
    tmpfs: ["/data:size=16m,mode=0700"]
    security_opt: [no-new-privileges:true]
    # #1026: the official image's entrypoint starts as root, chowns /data to
    # its own unprivileged user, then execs the server as that user --
    # cap_drop: [ALL] alone made the chown itself fail ("Operation not
    # permitted") and the container crash-looped before ever reaching
    # valkey-server. CHOWN/SETUID/SETGID restore exactly what that one-time
    # startup dance needs; valkey-server itself never uses them once running.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 320M}

  # ------------------------------------------------------------------
  # Modernization port (#1608) — cutover complete: this stack IS the
  # dashboard now, no profile gate, and the retired Go `dashboard`
  # service is gone from this file entirely (an older git commit is the
  # only way back, deliberately — no runtime fallback). The staging port
  # 19092 is no longer bound here: it belongs to the standalone
  # Xore/apiary-dashboard Arcane project, which runs beside this one
  # until its cutover's seven-day rollback window closes (that repo's
  # docs/cutover-plan.md). dashboard-next keeps production 19090.
  #
  # Cross-host readiness (per Xore): both tiers are stateless,
  # env-configured containers — session/OIDC state lives in the
  # oidc-sessions valkey (network-reachable, no localhost sockets), data
  # access goes through BACKEND_URL/BFF_INTERNAL_URL, so either tier can
  # move to another docker host by pointing those URLs across the
  # WireGuard mesh, and the BFF can scale horizontally (SERVE_MODE
  # splits frontend/bff; no compose resource limit on the BFF tier).
  #
  # That capability is genuinely real now, not just scaffolding: dashboard-
  # next's SERVE_MODE=frontend actually routes every serviceFetch/
  # serviceJSON call through the /bff/* proxy (frontend-next's
  # routes/bff.$.ts) on BFF_INTERNAL_URL instead of hitting BACKEND_URL
  # directly, and vps/traefik/dynamic.yml has a matching (today inert)
  # PathPrefix('/bff') router. Still one dashboard-next service pair below
  # — actually running a split frontend-only/bff-only pair on two docker
  # hosts, with their own compose services and socat bridges, is #1622's
  # job, not this one.
  #
  # #1622: `backend-service` itself moved out of this file into its own
  # Arcane-managed stack, arcane/home/honeypot-dashboard-backend/compose.yml
  # -- the compose-layer counterpart to this section's own "either tier can
  # move to another docker host" claim above, so it can actually be
  # restarted/redeployed independently of dashboard-next and everything
  # else here. `backend-service-mounted`, `backend-worker`,
  # `backend-worker-importer`, `backend-worker-enrichment`, and
  # `dashboard-next` below are unaffected -- still bundled in this file,
  # splitting those is further work, not done in this pass. dashboard-next's
  # BACKEND_URL=http://backend-service:8081 below still resolves: both
  # stacks attach to the same explicitly-named `honeynet` bridge, the same
  # cross-project DNS mechanism this file's own header documents.
  # ------------------------------------------------------------------
  # #1612 mounted worker role (phase 3a/3b): sandbox/ghidra/github-analysis
  # submission, the Payload Workbench orchestrator, and anything else that
  # needs to WRITE into a host-side request spool. Deliberately a separate
  # service from backend-service, not an extra mount bolted onto it: those
  # spool dirs are the dashboard's only path to root-owned host workers
  # (services-adapter is a narrow socket; these are real filesystem write
  # access), a distinct trust/mount boundary worth keeping visible in the
  # compose file rather than folding into backend-service's Phase-1 (state
  # + services-adapter-socket) scope. Also distinct from backend-worker:
  # this one serves HTTP request/response for submissions (LISTEN_ADDR is
  # network-reachable), where backend-worker only runs background loops and
  # binds loopback-only. Same image, same route table (routes aren't
  # container-specific — see main.rs) — reachable internally at
  # http://backend-service-mounted:8082; BFF wiring is a follow-up (owned
  # by the parallel frontend track).
  backend-service-mounted:
    <<: *runtime-defaults
    image: apiary-backend:latest
    # never: this image has no build: here on purpose (built by the sibling
    # honeypot-dashboard-backend stack's own backend-service service, shared
    # by local tag) and was never pushed to any registry -- Arcane's
    # redeploy does an unconditional `docker compose pull` across every
    # image in the file, which fails outright ("repository does not exist")
    # without this. Redeploying honeypot-dashboard-backend first keeps the
    # local tag current for every service below that references it.
    pull_policy: never
    container_name: hp-apiary-backend-mounted
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=0.0.0.0:8082
      # The mounted HTTP API can move separately from sensor-bound workers.
      # Override only after #3577 provides a private authenticated ES path.
      - ELASTICSEARCH_URL=${BACKEND_MOUNTED_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - HONEYPOT_TUNNEL_PEER_IP=${HONEYPOT_TUNNEL_PEER_IP:-10.8.0.1}
      - HONEYPOT_TUNNEL_SENSOR_IP=${HONEYPOT_TUNNEL_SENSOR_IP:-10.8.0.2}
      # #3685: the #1801 workbench-reconcile sweep no longer runs here -- it
      # moved to backend-worker (WORKER_LOOPS there), which already carries
      # every spool mount it reads, read-only, and sits on the homeserver
      # next to those spools. This service stays a pure HTTP API (no
      # WORKER_LOOPS), so it can move to the precision host later without
      # dragging a cross-host spool read along (#3592 decision 2). It keeps
      # its own spool mounts below: get_run/child_action still reconcile on
      # request and child_action removes cancelled .request markers.
      # #1677: addresses belonging to this fleet, excluded from the
      # dashboard's attacker aggregations. Suricata records `source.ip` as
      # whichever end it saw as the source, so our own hosts appear as
      # "attackers" for both halves of every attacker session and for their
      # own outbound traffic -- the VPS's public address was the #2 attacker
      # at 607,288 events over 48h. The tunnel peer is always excluded
      # whether or not it is listed here. Comma-separated.
      - HONEYPOT_SELF_IPS=${HONEYPOT_SELF_IPS:-}
      # #2183: empty SERVICE_TOKEN refuses to boot with [E-SERVICE-TOKEN];
      # the override below is the one sanctioned dev escape hatch.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      # #3577: rotation overlap and verified actor assertions. All optional;
      # unset keeps the pre-#3577 behaviour (ACTOR_ASSERTION_MODE=off).
      # Runbook: docs/BACKEND-TRUST-BOUNDARY.md.
      - SERVICE_TOKEN_PREVIOUS=${DASHBOARD_SERVICE_TOKEN_PREVIOUS:-}
      - SERVICE_TOKEN_PREVIOUS_UNTIL=${DASHBOARD_SERVICE_TOKEN_PREVIOUS_UNTIL:-}
      - ACTOR_ASSERTION_MODE=${ACTOR_ASSERTION_MODE:-off}
      - ACTOR_ASSERTION_PUBLIC_KEY=${ACTOR_ASSERTION_PUBLIC_KEY:-}
      - ACTOR_ASSERTION_PUBLIC_KEY_PREVIOUS=${ACTOR_ASSERTION_PUBLIC_KEY_PREVIOUS:-}
      - ACTOR_ASSERTION_PUBLIC_KEY_PREVIOUS_UNTIL=${ACTOR_ASSERTION_PUBLIC_KEY_PREVIOUS_UNTIL:-}
      - SANDBOX_REQUEST_DIR=/sandbox-requests
      - WINDOWS_SANDBOX_REQUEST_DIR=${WINDOWS_SANDBOX_REQUEST_DIR:-}
      - GHOSTS_SANDBOX_REQUEST_DIR=${GHOSTS_SANDBOX_REQUEST_DIR:-}
      - WINDOWS_SANDBOX_RESULTS_DIR=${WINDOWS_SANDBOX_RESULTS_DIR:-}
      - GHOSTS_SANDBOX_RESULTS_DIR=${GHOSTS_SANDBOX_RESULTS_DIR:-}
      - GHIDRA_REQUEST_DIR=${GHIDRA_REQUEST_DIR:-}
      - GHIDRA_RESULTS_DIR=${GHIDRA_RESULTS_DIR:-}
      - GITHUB_ANALYSIS_REQUEST_DIR=${GITHUB_ANALYSIS_REQUEST_DIR:-}
      # #1612 phase 3b: Payload Workbench orchestrator. REVDECK_RESULTS_DIR
      # is also fed by ghidra-worker.py's drain_revdeck() for the "ghidra"
      # analyzer's embedded RevDeck enrichment (read, not written, here) —
      # SANDBOX_RESULTS_DIR is read-write-adjacent: this service only reads
      # it (on-request reconciliation), the host-side worker owns writing
      # job results.
      - SANDBOX_RESULTS_DIR=/sandbox-results
      - REVDECK_REQUEST_DIR=${REVDECK_REQUEST_DIR:-}
      - REVDECK_RESULTS_DIR=${REVDECK_RESULTS_DIR:-}
      - PAYLOAD_DIRS=/dionaea-lib/binaries,/cowrie-downloads
      - SCRIPT_PAYLOAD_DIR=/state/script-payloads
      # #1972: same durable per-request app log as backend-service (obs.rs,
      # see honeypot-dashboard-backend/compose.yml), own directory so the two
      # instances stay separate files for filebeat's registry while shipping
      # into the shared dashboard-backend-v1-* index family. Workbench/sandbox
      # submissions are exactly the requests you'll want a line for.
      - DASHBOARD_LOG_FILE=${DASHBOARD_LOG_FILE:-/logs/dashboard-backend-mounted/app.jsonl}
      - TZ=Europe/Berlin
    volumes:
      - dashboard-state:/state
      - dionaea-lib:/dionaea-lib:ro
      - /opt/stacks/apiary/logs/cowrie/downloads:/cowrie-downloads:ro
      # #1972 read-write: this instance CREATES its own app.jsonl, same
      # provisioning/chown posture as backend-service's (log-init step,
      # uid 65534).
      - /opt/stacks/apiary/logs/dashboard-backend-mounted:/logs/dashboard-backend-mounted
      # Read-write: this service is the one thing that CREATES these
      # markers. Windows/GHOSTS/Ghidra/GitHub-analysis/Rev·Deck stay inert
      # (empty env var above) until the operator has actually deployed that
      # host-side worker, same posture as every other optional spool in
      # this stack.
      - /var/lib/honeypot-sandbox/requests/pending:/sandbox-requests
      - /var/lib/honeypot-windows-sandbox/requests/pending:/windows-sandbox-requests
      - /var/lib/honeypot-ghosts-sandbox/requests/pending:/ghosts-sandbox-requests
      - /var/lib/honeypot-windows-sandbox/export:/windows-sandbox-results:ro
      - /var/lib/honeypot-ghosts-sandbox/export:/ghosts-sandbox-results:ro
      - /var/lib/honeypot-ghidra/requests/pending:/ghidra-requests
      - /var/lib/honeypot-ghidra/results:/ghidra-results:ro
      - /var/lib/honeypot-github/requests/pending:/github-analysis-requests
      - /var/lib/honeypot-revdeck/requests/pending:/revdeck-requests
      - /var/lib/honeypot-revdeck/results:/revdeck-results:ro
      # Read-only: on-request reconciliation polls job-completion state
      # directly off disk (never through the ES mirror — see
      # workbench_orchestrator.rs's module comment), the same reasoning
      # golden-image-status already established for
      # WINDOWS_SANDBOX_RESULTS_DIR above. The periodic sweep that does the
      # same for idle runs lives in backend-worker (#3685).
      - /var/lib/honeypot-sandbox/export:/sandbox-results:ro
    networks:
      - honeynet
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

  dashboard-next:
    <<: *runtime-defaults
    build:
      context: ./frontend-next
      # #3315: the revision this image is built from, baked into the served
      # /build.json and the image's org.opencontainers.image.revision label.
      # Read from this stack's .env, not invented here -- compose cannot run
      # `git rev-parse`, and this stack's synced directory carries no .git (see
      # docs/ARCANE-GIT-SYNC.md), so whatever builds the image has to say which
      # commit it is. Unset is the honest default and produces
      # {"revision":"unknown"} plus an `unknown` label rather than a build
      # failure: scripts/verify-deploy.sh reports an unstamped image as its own
      # finding, which is more use than a red build that gets reverted.
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: apiary-dashboard-next:latest
    # build: same "never pushed to any registry, Arcane's redeploy pulls
    # unconditionally" issue as apiary-backend:latest above -- this one has
    # its own build: right here though, so always build instead of pull.
    pull_policy: build
    container_name: hp-dashboard-next
    restart: unless-stopped
    depends_on:
      oidc-sessions:
        condition: service_healthy
    environment:
      - PORT=8080
      - SERVE_MODE=${DASHBOARD_SERVE_MODE:-all}
      - BACKEND_URL=http://backend-service:8081
      # #1612 phase 3a/3b wiring: sandbox/ghidra/github-analysis submission,
      # sandbox golden-image-status and vnc status, and the whole workbench
      # orchestrator surface only work against the write-capable mounted
      # instance below (main.rs's own comment on that route block explains
      # why: same route table as backend-service, but only this container
      # has the host-side request-spool mounts). serviceFetch/serviceJSON's
      # `{ mounted: true }` callers resolve to this URL, not BACKEND_URL.
      - BACKEND_MOUNTED_URL=http://backend-service-mounted:8082
      - BFF_INTERNAL_URL=${BFF_INTERNAL_URL:-}
      # #2183: empty SERVICE_TOKEN refuses to boot with [E-SERVICE-TOKEN];
      # the override below is the one sanctioned dev escape hatch, the same
      # env contract backend-service(-mounted) and this container share.
      - SERVICE_TOKEN=${DASHBOARD_SERVICE_TOKEN:-}
      - APIARY_ALLOW_UNAUTH_DEV=${APIARY_ALLOW_UNAUTH_DEV:-}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://auth.example.invalid/realms/apiary}
      # #1682: events.html's "Open in Kibana/EveBox/Arkime" per-event menu
      # (dashboard/links.go's investigationURL/investigationBase) — unset
      # by default, same as the Go tier, so no link renders until an
      # operator who has actually deployed arcane/home/honeypot-elk points
      # these at it. Per-tool var wins; HONEYPOT_DOMAIN derives
      # https://{kibana,evebox,arkime}.<domain> as a fallback.
      - HONEYPOT_DOMAIN=${HONEYPOT_DOMAIN:-}
      - KIBANA_PUBLIC_URL=${KIBANA_PUBLIC_URL:-}
      - EVEBOX_PUBLIC_URL=${EVEBOX_PUBLIC_URL:-}
      - ARKIME_PUBLIC_URL=${ARKIME_PUBLIC_URL:-}
      # #1628 staged/beta path: a dedicated var, not the shared
      # OIDC_EXTERNAL_URL production uses, since oidc.server.ts builds its
      # redirect_uri directly from this and Keycloak only accepts a
      # registered exact match — dashboard-next needs its own if it's ever
      # reachable at a different host than production (beta.honeypot.*)
      # without breaking either flow. Defaults to OIDC_EXTERNAL_URL so
      # today's behavior (same host as production) is unchanged until an
      # operator sets DASHBOARD_NEXT_OIDC_EXTERNAL_URL explicitly.
      - OIDC_EXTERNAL_URL=${DASHBOARD_NEXT_OIDC_EXTERNAL_URL:-${OIDC_EXTERNAL_URL:-https://honeypot.example.invalid}}
      - OIDC_CLIENT_ID=apiary-dashboard
      - OIDC_CLIENT_SECRET_FILE=/run/dashboard-secrets/oidc-client-secret
      - OIDC_SESSION_REDIS_URL=redis://oidc-sessions:6379/0
      - TZ=Europe/Berlin
      # #1616 scalability tuning — every var below has a code default
      # (cluster.mjs / backpressure.server.ts) and is safe to leave unset;
      # these overrides exist so an operator can retune without a rebuild.
      - WEB_CONCURRENCY=${DASHBOARD_WEB_CONCURRENCY:-}
      - BACKEND_MAX_INFLIGHT=${DASHBOARD_BACKEND_MAX_INFLIGHT:-}
      - BACKEND_MAX_QUEUE=${DASHBOARD_BACKEND_MAX_QUEUE:-}
      - BACKEND_HTTP_MAX_SOCKETS=${DASHBOARD_BACKEND_HTTP_MAX_SOCKETS:-}
      # #1972 durable BFF app log: named outcomes only (sign-in
      # started/failed/completed, and anything else that goes through obs
      # server's recordNamedEvent), not one line per request -- the Rust tier's
      # stream carries per-request volume, this one carries the events you
      # otherwise grep stdout for and lose on redeploy (#1942's invisible auth
      # failures were exactly that). Username is deliberately never among the
      # fields. File reopened per write, so rename rotation works without a
      # signal. Provisioned (mkdir + chown 1000) by honeypot-init's log-init.
      - DASHBOARD_BFF_LOG_FILE=${DASHBOARD_BFF_LOG_FILE:-/logs/dashboard-bff/app.jsonl}
    # 19090: the live production binding, moved here permanently by #1628's
    # cutover (previously a cutover-dashboard.sh-generated override.yml
    # layer, not checked in -- moved into the real compose.yml once the
    # cutover held through step 7's live validation, exactly as the
    # runbook itself anticipated: a live-only override risks a later
    # Arcane gitops-sync silently reverting it, and in fact did worse than
    # that live -- with `dashboard`'s now-removed conflicting ports: line
    # still present, a routine sync failed outright trying to rebind
    # 19090 out from under this container).
    ports:
      - "${HP_BIND:-10.8.0.2}:19090:8080"
    volumes:
      - ${DASHBOARD_SECRETS_DIR:-/var/dockge/stacks/honeypot-dashboard/secrets}:/run/dashboard-secrets:ro
      # #1972 read-write: appends DASHBOARD_BFF_LOG_FILE as the node user
      # (uid 1000 -- chowned by honeypot-init's log-init step, same story as
      # the group_add above but for a path that must stay writable).
      - /opt/stacks/apiary/logs/dashboard-bff:/logs/dashboard-bff
    # The secrets dir's own files are -r--rw---- github-deploy-runner:
    # deploy-runner (Arcane's own deploy-time provisioning owner). The old
    # Go dashboard reading the same mount never needed this: it runs as
    # root (no USER in its Dockerfile), which bypasses file permissions
    # entirely. dashboard-next correctly runs as the frontend-next
    # Dockerfile's unprivileged `node` user instead, so it needs actual
    # group membership -- confirmed live (EACCES reading oidc-client-
    # secret, #1628) that nothing had granted it that. group_add joins
    # the container process to deploy-runner's GID without loosening the
    # file's own permissions for anything else. It has to be a GID rather than
    # a name: /etc/group exists on the host, not inside this image.
    #
    # Interpolated, NOT the literal 980 it used to be. System GIDs are handed
    # out in creation order, so they are a property of how a host was built
    # rather than a constant. After the 2026-09-03 rebuild, 980 belonged to
    # github-ci-runner-3 and deploy-runner had become 977 -- so the container
    # joined an unrelated CI group, could not read the secret, and every
    # sign-in failed with EACCES while the UI blamed Keycloak. The installer
    # writes the host's real GID into this stack's .env; the 980 default only
    # preserves the historical value for a host that has not been through it.
    group_add:
      - "${DEPLOY_RUNNER_GID:-980}"
    networks:
      - honeynet
      - oidc-session
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # #1983: dashboard-next was the last service in this stack -- and the
    # only one repo-wide (32 other stacks scanned, YAML anchors and inline
    # flow-style maps accounted for) -- without any compose resource
    # ceiling, and it is precisely the component exposed to unauthenticated
    # internet traffic through the VPS gateway. Its RSS scales with both
    # request load and concurrent live streams (the BFF proxies/SSE-streams
    # backend responses), so runaway growth here previously ended at the
    # kernel OOM-killer picking *some* victim on this shared host --
    # possibly not this container, starving elasticsearch or postgres
    # instead. With a ceiling, exhaustion kills THIS container
    # (restart: unless-stopped recovers it) instead of its neighbours.
    #
    # Sizing is operator judgment, not a measured maximum: steady state on
    # the homeserver is ~80MiB (docker stats, 2026-08-26) at the default
    # WEB_CONCURRENCY=min(4, cpus) cluster workers, and the backpressure
    # knobs in the environment block above already bound inflight requests
    # and queue depth. 512M sits ~6x above today's footprint with room for
    # per-worker SSR plus live-stream headroom across all four workers;
    # if real traffic proves it tight, raise it deliberately -- the point
    # of the number is blast-radius containment, not thrift.
    #
    # #2051: HEALTHCHECK is baked into dashboard-next's Dockerfile itself,
    # invisible to a compose-only grep for healthcheck:.
    labels:
      - autoheal=true
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

networks:
  oidc-session:
    internal: true
  # Shared with the main stack -- explicit fixed name, not project-prefixed,
  # non-external. See this file's header.
  honeynet:
    name: honeynet
    driver: bridge

volumes:
  # Shared with the main stack (dionaea/yara-scanner write, this stack only
  # reads) -- explicit fixed name, matching docker-compose.yml's own
  # declaration exactly, same mechanism as honeynet above.
  dionaea-lib:
    name: dionaea-lib
  # Also shared with the main stack, both ways -- payload-dedupe and
  # yara-scanner there read/write retained script payloads under
  # /payloads/scripts, the same volume this stack's own /state resolves to.
  # See this file's header for why this one cannot be left project-scoped.
  dashboard-state:
    name: dashboard-state
  # #3575: yara-results, reporter-data, services-adapter-socket and
  # es-importer-state are declared by honeypot-backend-workers, which owns
  # their consumers now.
