# honeypot-galah -- #1420: LLM-powered HTTP honeypot
# (github.com/0x4d31/galah, vendored -- see galah/Dockerfile). Same shape
# and reasoning as arcane/home/honeypot-beelzebub/compose.yml/arcane/home/honeypot-hellpot/compose.yml
# -- no depends_on, its own private network, only host bind mounts.
# Deployed as /opt/stacks/honeypot-galah.
#
# Scope decisions made integrating this sensor (see PR description for the
# full writeup):
#
# - Raw-port/portbridge-only, no Traefik hostname: galah's own
#   commonFields() (internal/logger/logger.go) resolves srcIP/srcPort
#   purely from r.RemoteAddr via net.SplitHostPort -- confirmed directly
#   against the vendored source, no X-Forwarded-For/X-Real-IP trust
#   anywhere. Same resolved-via-ip-enrichment-worker's-via_port-join
#   posture as beelzebub/hellpot.
# - galah-llm-broker is the sole bridge to the shared Ollama instance.
#   The sensor joins only the broker's front overlay; Ollama joins only its
#   back overlay. The legacy Compose broker remains defined for rollback.
# - LLM_MODEL=qwen2.5:7b-instruct-q4_K_M, not any of the Qwen3/3.5 models
#   already pulled on this host (qwen3:14b, and qwen3.5:4b which this PR
#   originally picked from docs/local-llm-model-evaluation.md's own
#   benchmark table before live-testing it): those benchmarks were run
#   with Ollama's `think: false` request field explicitly set, and
#   galah's vendored LLM client (langchaingo v0.1.10) has no support for
#   that field at all -- confirmed against its source, no "think"/"Think"
#   anywhere. Found live: a direct qwen3.5:4b /api/chat call with no
#   think field ran for the full 90s test window without stopping
#   (n_decoded reached 1413 tokens, no natural stop) -- Qwen3.5's
#   thinking mode, unsuppressable through this client, blows past any
#   realistic response deadline. galah's HTTP server hardcodes a 10s
#   WriteTimeout (internal/server/server.go, not configurable) and
#   returns a bare 500 on any LLM error including a timeout -- confirmed
#   no fallback/static response exists for that path. qwen2.5:7b-instruct
#   has no thinking-mode toggle to begin with (confirmed live: real
#   requests return done_reason:"stop" with a clean, complete JSON body,
#   ~1s warm) and was already evaluated favorably in
#   docs/local-llm-model-evaluation.md, so this is a fourth distinct
#   model on the shared OLLAMA_MAX_LOADED_MODELS=1 slot -- an accepted
#   cost given none of the three already-pulled models were actually
#   usable here. Response caching (built into galah, event_log.json shows
#   responseMetadata.generationSource) means only the first hit on a given
#   request shape pays the LLM cost at all.

name: honeypot-galah

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  galah:
    <<: *runtime-defaults
    build: ./galah
    container_name: hp-galah
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
      - LLM_SERVER_URL=http://galah-llm-broker:11434
    ports:
      - ${HP_BIND:-10.8.0.2}:8888:8888
      # #1891: the Traefik-only door (see config.yaml). Bound to the same
      # tunnel address as 8888, so it is reachable from the VPS and from
      # nowhere else.
      - ${HP_BIND:-10.8.0.2}:8890:8890
    volumes:
      - /opt/stacks/apiary/logs/galah:/var/log/honeypot
      - /opt/stacks/apiary/state/init-markers:/markers:ro
    # #2366: measured baseline, same "run it, then reduce" methodology as
    # #89/#118's cap_drop passes. Verified locally: built this image, ran
    # it with cap_drop: [ALL] added on top of the existing
    # no-new-privileges/read_only posture, and confirmed both HTTP servers
    # (8888, 8890) start and the SQLite cache database (bind-mounted, so
    # unaffected by read_only) opens successfully.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks: [galah_net, broker_front]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  galah-llm-broker:
    <<: *runtime-defaults
    build: ./galah-llm-broker
    container_name: hp-galah-llm-broker
    restart: unless-stopped
    profiles: [legacy]
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LISTEN_ADDR=:11434
      - MAX_BODY_BYTES=65536
      # #1513: was 8 -- confirmed live that a cold-loaded
      # qwen2.5:7b-instruct-q4_K_M (Ollama's default keep_alive unloads it
      # after 5 minutes idle, the normal case for a honeypot) took 15.1s of
      # load_duration alone in one live sample (19.28s total for a trivial
      # prompt), and over 40s in a second sample under real GPU contention
      # from this host's other Ollama consumers (llm-worker, ml-worker,
      # rex86-eval) -- the cold-load cost is genuinely variable, not a fixed
      # ~19s. 8s guaranteed a broker-side timeout on every request after any
      # quiet period, the root cause of galah returning HTTP 500 instead of
      # a real decoy response. 90s gives real margin past either single
      # observation rather than just the first one; galah's own WriteTimeout
      # is patched to 100s alongside this (galah/timeout_patch.py) so
      # galah's own deadline doesn't cut the connection before the broker's
      # does.
      - UPSTREAM_TIMEOUT_SECONDS=90
      # #3448: prompt-injection detection on the text galah hands the local
      # model. Empty means every shape is enabled; comma-separated to run a
      # subset. Deliberately NO count and NO rate: the research note puts
      # this class at 3 requests in 84 days on the sensors it measured, none
      # of which is galah, so a rate gate would suppress the one event it
      # exists to catch and gate on a number nobody has measured. What is
      # configurable is whether a shape runs at all, because the
      # false-positive rate of these shapes on this sensor is UNMEASURED and
      # an operator should not need a rebuild to find out.
      - INJECTION_SHAPES=
    # #2366: measured baseline, same "run it, then reduce" methodology as
    # #89/#118's cap_drop passes. Verified locally: built this image, ran
    # it with cap_drop: [ALL] added on top of the existing
    # no-new-privileges/read_only posture, confirmed it still starts and
    # answers HTTP requests.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      galah_net:
      llm_clients:
        aliases: [galah-llm-broker]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11434"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  galah_net:
    driver: bridge
  broker_front:
    name: galah-broker_front
    external: true
  # Shared with analysis/ghidra/docker-compose.ghidra.yml's own ollama
  # service (that file creates the real network: internal: true,
  # confirmed there). galah itself never joins this network -- only the
  # broker above does, and only the broker.
  llm_clients:
    name: honeypot-llm
    external: true
