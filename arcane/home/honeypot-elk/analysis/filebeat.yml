# Filebeat — tail the shared honeypot JSON logs and ship to Elasticsearch.
#
# Mapping strategy:
#   Sensor logs   → honeypot-YYYY.MM.DD    (fields namespaced under honeypot.*)
#   Suricata EVE  → suricata-YYYY.MM.DD    (fields namespaced under suricata.*)
#   Portbridge    → portbridge-YYYY.MM.DD  (fields namespaced under portbridge.*)
#
# Using separate namespaces prevents field-type collisions when two sensors
# write the same key (e.g. "type", "src_ip") with different value types.
# Elasticsearch 400s are almost always caused by merging all sources into root.

filebeat.inputs:
  # Honeypot sensor logs. Only the sensors the enrichment worker does NOT
  # rewrite keep their raw path in this input (api-honeypot / dnp3 /
  # dicompot / endlessh / canarytokens -- see below); every watched sensor
  # is read from /logs/enriched/ instead.
  # Each sensor writes to its own subdirectory: /logs/<service>/<file>.json
  #
  # #37/#38: cowrie, dionaea, every conpot persona, dns-honeypot, and
  # cisco-asa-honeypot aren't PROXY-protocol wrapped, so their own raw logs
  # only ever carry the tunnel peer address (10.8.0.1), never the real
  # attacker IP -- that used to be joined against portbridge's connection
  # log at dashboard read time. The enrichment worker now does that join at
  # ingest time instead and writes an already-correct copy to
  # /logs/enriched/*.json. The watch list has since grown well past those
  # five: elasticpot and mailoney's logs match the same flat
  # src_ip/src_port shape and get the same generic join; dionaea-incident
  # gets the nested-shape variant (#623); beelzebub, sentrypeer, hellpot
  # and galah get bespoke enrichers that derive their own address field
  # and join -- or, on hellpot/galah's Traefik-proxied door, adjudicate
  # the forwarded-header claim instead of joining at all.
  #
  # #1217: multipot/tanner/http-honeypot/citrix-honeypot/rdp-honeypot, plus
  # sonicwall-sma-honeypot (#3033), already get the real attacker IP
  # directly via PROXY protocol (no join needed) but are ALSO now watched,
  # purely to
  # promote canonical_* creds/command/fingerprint fields (see
  # backend-service/src/ip_enrichment/canonical.rs) -- their enriched copies land in
  # /logs/enriched/ too (multipot.json, tanner.json, http-honeypot.json,
  # citrix-honeypot.json, rdp-honeypot.json, sonicwall-sma-honeypot.json).
  #
  # Every watched sensor's own raw path is deliberately absent
  # from this list -- only /logs/enriched/*.json is tailed for them, so no
  # event is ever shipped twice. That set is the #37/#38 five above plus
  # elasticpot, mailoney, the four bespoke joiners, dionaea-incident and
  # the #1217 six -- 17 named sources plus every conpot persona found on
  # disk; backend-service/src/ip_enrichment/mod.rs's discover_sources is
  # the authoritative roster. api-honeypot/dnp3/dicompot/endlessh are
  # NOT watched at all (#1217 is exactly the six named above, no more)
  # and keep tailing their raw path as before, as does canarytokens
  # (#1426, below).
  - type: filestream
    # #2212: file_identity is pinned rather than left to the default, the
    # same reason as the #1776/#2189 siblings below. /logs/enriched/*.json
    # is rotated by ip-enrichment-worker's OutputWriter
    # (backend-service/src/ip_enrichment/rotate.rs) via the same
    # rename-aside-and-reopen pattern portbridge/zeek/huginn/traefik/suricata
    # use, so an identity scheme is not a detail to leave implicit here
    # either -- even though rename-aside happens to be stable under either
    # scheme, which is why this went unnoticed for so long.
    id: honeypot-json
    file_identity.fingerprint: ~
    prospector.scanner.fingerprint.enabled: true
    paths:
      - /logs/*.json
      - /logs/api-honeypot/*.json
      - /logs/dnp3/*.json
      - /logs/dicompot/*.json
      - /logs/endlessh/*.json
      # #1426: canarytokens-adapter already writes fully-correct fields
      # (sensor/src_ip/timestamp/etc, canarytokens-adapter/main.go's
      # buildEvent) straight to /logs/canarytokens/canarytokens.json --
      # nothing for ip-enrichment-worker to join or promote, same "not in
      # its scope, tail the raw path directly" bucket as api-honeypot/
      # dnp3/dicompot/endlessh above.
      - /logs/canarytokens/*.json
      - /logs/enriched/*.json
    # Keep an extra guard for a top-level Suricata mount. Explicit per-sensor
    # paths above ensure incidents and portbridge metadata cannot be decoded
    # into the shared honeypot namespace.
    exclude_files: ['suricata']
    parsers:
      - ndjson:
          target: "honeypot"   # nest parsed fields under honeypot.* to avoid root collisions
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: sensors
    fields_under_root: true

  # #565: dionaea_incident.json is dionaea's own log_incident ihandler --
  # every record is {timestamp, name, origin, data}, confirmed directly
  # against upstream dionaea/lib/dionaea/python/dionaea/log_incident.py's
  # handle_incident(). timestamp/name/origin are consistent across every
  # incident; data is not -- different origins (SMB/SIP/UPnP/TFTP/exploit/
  # download incidents) reuse the same keys with incompatible value types,
  # so it lands in its own dionaea-incidents-v1-* index/template (typed
  # timestamp/name/origin, data: flattened -- same flattened-for-heterogeneous-
  # keys approach honeypot-v2-*'s own honeypot field already uses) rather
  # than the shared honeypot-v2-* stream. dashboard/classify.go's own
  # dionaea-incident handler (~line 427) reads this file directly off disk,
  # unaffected by this -- purely additive for any ES-only consumer.
  #
  # #623: incident records carry no top-level src_ip -- the tunnel peer
  # address is buried in data (under a key that varies by incident origin,
  # e.g. data.connection.remote_ip, or data.child/data.parent for
  # dionaea.connection.link), so it was out of ip-enrichment-worker's
  # original flat-src_ip-field scope entirely. ip-enrichment-worker now
  # walks the whole record for that shape and writes an already-correct
  # copy to /logs/enriched/dionaea-incident.json -- tailed here instead of
  # the raw path, the same "enriched supersedes raw" pattern the honeypot-json
  # input above already uses for every sensor it watches.
  - type: filestream
    # #2212: file_identity is pinned rather than left to the default, for
    # the same reason as honeypot-json above -- this path is also rotated
    # by ip-enrichment-worker's OutputWriter (rotate.rs), and rotating
    # files don't get to leave their identity scheme implicit (#1776/#2189).
    id: dionaea-incidents-raw-v1
    file_identity.fingerprint: ~
    prospector.scanner.fingerprint.enabled: true
    paths:
      - /logs/enriched/dionaea-incident.json
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: dionaea-incidents
      sensor: dionaea
      event_format: incident-json
    fields_under_root: true

  # Portbridge tunnel-connection metadata: real attacker IP, the honeypot
  # port it dialed, and (when available) a live p0f OS guess. #354:
  # previously local-disk-only -- dashboard/classify.go's buildViaMap reads
  # these files directly off disk, joined once per ~15s rebuild cycle
  # against only the current + previous log-rotation generation. Shipping
  # to Elasticsearch gives a durable, full-history, queryable record of
  # every tunnel connection instead. Only the live, actively-growing file
  # is tailed -- portbridge.json.1 (the copytruncate rotation target) is
  # deliberately not globbed here: unlike a rename-on-rotate pattern
  # (stable under either identity scheme -- a rename keeps both the inode
  # and the leading bytes; see the suricata-eve comment below), copytruncate
  # overwrites .1 wholesale on every rotation, which a filestream input
  # would see as a brand-new file each time and re-ingest in full,
  # duplicating everything already shipped while portbridge.json was still
  # the active file. buildViaMap's own file-tail join is unaffected by any
  # of this and keeps running exactly as before -- this input is additive.
  - type: filestream
    # #1776: renamed from portbridge-json to abandon the split registry state
    # that made every line arrive twice. Two harvester states existed for this
    # one path -- one carrying a fingerprint identity and one predating it --
    # and both shipped every appended line, so 99.9% of portbridge documents
    # were exact duplicate pairs differing only in log.file.fingerprint.
    #
    # The cause was a copytruncate sidecar (removed in vps/docker-compose.yml)
    # rotating a file this input tails: truncation reset the live harvester to
    # offset 0 while the rewritten head produced a new fingerprint and a second
    # state. portbridge rotates itself by rename-and-reopen, which is stable
    # under either identity scheme, so nothing recreates the split now.
    #
    # file_identity is pinned rather than left to the default: this input was
    # written when filestream defaulted to inode+device, and Filebeat 9 changed
    # that default to fingerprint underneath it. An identity scheme is not a
    # detail to leave implicit for a file that rotates.
    id: portbridge-json-v2
    file_identity.fingerprint: ~
    prospector.scanner.fingerprint.enabled: true
    paths:
      - /logs/portbridge/portbridge.json
    parsers:
      - ndjson:
          target: "portbridge"
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: portbridge
    fields_under_root: true

  # #1742/S5: Zeek. One input for every Zeek log type -- conn, ssl, ssh, http,
  # dns, files, x509, the JA4+ logs and the ICSNPP ones -- because they share a
  # shape (JSON, uid, id.orig_h/id.resp_h) and differ only in which extra
  # fields they carry. The pipeline derives event.category from the filename,
  # so a new Zeek log type starts working without touching this file.
  #
  # Deliberately kept alongside Suricata rather than replacing it: the two see
  # different things on the same wire, which is the whole point of S5.
  - type: filestream
    # #1776 pinned this to fingerprint (rather than leaving the Filebeat 9
    # default implicit) because Zeek rotates by rename-and-reopen, which is
    # stable under either identity scheme -- see the zeek-proxy-logs input
    # below for the fuller reasoning. #2708 found that fingerprint itself is
    # the wrong scheme here: it hashes a fixed byte window of the file, and
    # for high-column-count logs like modbus_detailed that window landed
    # entirely inside the static #separator/#path/#fields/#types header,
    # which is byte-identical across every hourly rotation. Filebeat then
    # treated every rotation after the first as "already known" and silently
    # skipped it -- 22,807 skip warnings/hour, none of those files ever
    # reaching Elasticsearch. Pinned to native (inode+device) instead: each
    # hourly rotation is a brand-new file with a brand-new inode (Zeek never
    # truncates in place), so native identity can't collide the way a
    # content-hash window can.
    id: zeek-logs
    file_identity.native: ~
    # #3284: this directory accumulates ~13,700 hourly rotation files (2026-09-03
    # onward) and nothing prunes them, so every restart made filestream open a
    # harvester per file until the Go runtime hit its 10000-thread limit. The
    # cap is the fix, not GODEBUG: one harvester per log type is plenty, because
    # Zeek writes one file per type per hour and only the newest is still being
    # appended to. Older rotations are finished by definition.
    harvester_limit: 64
    # 72h is ~3 days of hourly rotations per log type, comfortably past any
    # backlog while keeping the scanner off the 13,700 accumulated files. A
    # rotation older than this is finished; nothing appends to it again.
    ignore_older: 72h
    paths:
      - /logs/zeek/*.log
    parsers:
      - ndjson:
          target: "zeek"
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: zeek
    fields_under_root: true

  # #1742 decision 8: the decoy-side Zeek on the homeserver. Same shape as the
  # VPS sensor's logs, separate logset so the two are distinguishable -- this
  # one's peer is the tunnel, so its source addresses mean something different
  # and must never be mistaken for attacker IPs.
  - type: filestream
    # #2708: native rather than fingerprint, for the same reason as the
    # zeek-logs input above -- this directory carries the loudest instance of
    # the collision (modbus_detailed: 20,838 skip warnings/hour), and native
    # identity is immune to it because it never hashes file content.
    id: zeek-proxy-logs
    file_identity.native: ~
    # #3284: same cap as zeek-logs, same reason -- this glob matches 834
    # accumulated hourly rotations and one harvester per file is what exhausts
    # the runtime's thread limit on restart.
    harvester_limit: 64
    ignore_older: 72h
    paths:
      - /logs/zeek-proxy/*.log
    parsers:
      - ndjson:
          target: "zeek"
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: zeek-proxy
    fields_under_root: true

  # #1742/S5: huginn-sidecar. Per-flow TCP/TLS/HTTP fingerprints with a
  # confidence tier, already de-duplicated per flow by the sidecar itself --
  # raw output ran 193x redundant on tcp_syn_ack, so the volume here is what
  # survives that filter.
  - type: filestream
    # #1776: pinned, and the copy-truncate rotation this file used to get
    # is gone (vps/docker-compose.yml). Copy-truncate is what splits the
    # registry: truncation resets the live harvester to offset 0 while the
    # rewritten head hashes to a new fingerprint and starts a second one,
    # and both then ship every appended line. huginn-sidecar now rotates
    # itself by rename-and-reopen, the way portbridge does.
    id: huginn-sidecar
    file_identity.fingerprint: ~
    prospector.scanner.fingerprint.enabled: true
    paths:
      - /logs/huginn/huginn.json
    parsers:
      - ndjson:
          target: "huginn"
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: huginn
    fields_under_root: true

  # #1739: Traefik access log. Traefik terminates TLS for the Host-routed
  # decoys (hellpot, galah), so this is the only place their requests
  # exist in cleartext -- a wire sensor sees the ClientHello and then
  # ciphertext. Until now the log went to container stdout with no filePath
  # and no input here, so zero Traefik records reached Elasticsearch.
  #
  # Only the live file is tailed, not access.json.1: same copytruncate
  # reasoning as the portbridge input above -- the rotation target is
  # overwritten wholesale each cycle, which a filestream input would re-ingest
  # in full every time.
  - type: filestream
    # #1776: pinned, and copy-truncate rotation replaced with
    # rename-then-SIGUSR1 (vps/docker-compose.yml) so Traefik reopens the
    # path itself. Same reasoning as the huginn input above.
    id: traefik-access
    file_identity.fingerprint: ~
    prospector.scanner.fingerprint.enabled: true
    paths:
      - /logs/traefik/access.json
    parsers:
      - ndjson:
          target: "traefik"
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: traefik
    fields_under_root: true

  # Suricata IDS events (alerts, http, dns, tls, flow).
  # #79: eve output rotates hourly server-side (vps/suricata/suricata.yaml's
  # rotate-interval) into eve-<timestamp>.json instead of growing forever,
  # so this can no longer be a single literal filename.
  - type: filestream
    # #1776/#2189: file_identity is pinned rather than left to the default.
    # This comment spent years justifying rotation safety with "file_identity
    # defaults to inode/device" -- Filebeat 9 changed that default to
    # fingerprint underneath it (the same drift that split portbridge's
    # registry into two harvester states above), leaving suricata the one
    # rotating family whose identity scheme was still implicit, defended by
    # text describing pre-FB9 behavior.
    #
    # fingerprint is pinned here because it is both correct for how suricata
    # rotates and what has actually been running since Filebeat 9 landed:
    # rotate-interval closes the finished hour and opens the next timestamped
    # name -- nothing ever truncates an existing generation, so a file's
    # leading bytes (the whole fingerprint) are fixed once written and survive
    # unchanged through renames and beat restarts while this glob picks up
    # each newly created hourly file. Pinning native/inode instead would
    # orphan every fingerprint registry entry already in use and re-ingest
    # each retained hourly generation from offset 0; path identity was never
    # viable either way, since every renamed hour would look like a brand-new
    # path and double-ship its already-read lines.
    id: suricata-eve
    file_identity.fingerprint: ~
    prospector.scanner.fingerprint.enabled: true
    paths:
      - /var/log/suricata/eve-*.json
    parsers:
      - ndjson:
          # suricata.eve.* is the layout EveBox reads in --ecs mode, and it is
          # the same nesting Elastic's own Suricata module uses. EveBox is the
          # only consumer of this shape; queries elsewhere use the promoted ECS
          # fields (source.ip, destination.ip, network.transport) that the
          # geoip-honeypot pipeline derives from it.
          target: "suricata.eve"
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: suricata
    fields_under_root: true

  # #263: disk-space-check.sh's own alert lines. Already-structured JSON at
  # ECS-ish top level (disk.*, event.module, level) rather than nested under
  # a source namespace like the sensor logs above -- there's exactly one
  # producer, so no field-collision risk to guard against. Routed into the
  # same honeypot-v2-* index/ILM policy as the sensor logsets rather than a
  # dedicated index: low, bursty volume that doesn't warrant its own
  # template/ILM policy to manage. Filter on event.module:disk-space-check
  # to alert on it specifically.
  - type: filestream
    id: disk-space-diagnostics
    paths:
      - /logs/diagnostics/disk-space.json
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: sensors
    fields_under_root: true

  # #1972 serving-tier app logs -- three producers, three directories, two
  # index families (the two backend-service instances share one family; see
  # the indices routing below). Each stream is one producer writing
  # already-structured JSON lines that ARE the final ECS-ish shape (same
  # reasoning as disk-space above: one producer, no namespace needed),
  # appended by obs.rs / the BFF's obs.server.ts onto their own writable
  # subdirectory of the shared logs root.
  #
  # #1776/#2189: file_identity pinned explicitly rather than left implicit,
  # same posture as every input added since the Filebeat 9 default flip --
  # these files are append-only from byte zero (writers reopen per line), so
  # the fingerprint of the leading bytes never changes and survives restarts;
  # if rename rotation lands later (follow-up noted in #1972), a rotated
  # generation's fresh inode + fresh bytes legitimately reads as a new file,
  # which is the desired ingest-from-its-start behavior.
  - type: filestream
    id: dashboard-backend-app
    file_identity.fingerprint: ~
    prospector.scanner.fingerprint.enabled: true
    paths:
      - /logs/dashboard-backend/app.jsonl
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: dashboard-backend
    fields_under_root: true

  - type: filestream
    id: dashboard-backend-mounted-app
    file_identity.fingerprint: ~
    prospector.scanner.fingerprint.enabled: true
    paths:
      - /logs/dashboard-backend-mounted/app.jsonl
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: dashboard-backend-mounted
    fields_under_root: true

  # The BFF tier's stream carries named outcomes (auth started/failed/
  # completed and everything else routed through recordNamedEvent), not one
  # line per request; username deliberately never appears among the fields.
  # *.jsonl, not app.jsonl: during the standalone dashboard's cutover both
  # frontends write here, dashboard-next to app.jsonl and Xore/apiary-dashboard
  # to rewrite.jsonl, one file each so neither races the other's rotation.
  # Rotated generations (*.jsonl.1) do not match, so nothing is read twice.
  - type: filestream
    id: dashboard-bff-app
    file_identity.fingerprint: ~
    prospector.scanner.fingerprint.enabled: true
    paths:
      - /logs/dashboard-bff/*.jsonl
    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
    fields:
      logset: dashboard-bff
    fields_under_root: true

processors:
  # #1742/S5: derive the Zeek log type from the filename, client-side.
  #
  # It has to happen here rather than in the ingest pipeline: Filebeat resolves
  # the output index name before it ships anything, so a field the pipeline
  # sets server-side does not exist yet at that point. The pipeline sets
  # event.category from the same path for querying; this copy exists purely so
  # zeek-v1-<type>-* can be addressed.
  # The tokenizer stops at the FIRST dot, not at ".log". Zeek rotates hourly
  # by renaming conn.log to conn.2026-08-23-15-46-44.log, so a tokenizer
  # anchored on ".log" would read the whole timestamped stem as the log type
  # and mint a fresh index -- zeek-v1-files.2026-08-23-15-46-44-* -- on every
  # rotation, for every log type. Caught by running the extraction fixture,
  # whose short capture triggers a rotation on close.
  - dissect:
      tokenizer: "/logs/zeek/%{zeek_log}.%{_zeek_suffix}"
      field: "log.file.path"
      target_prefix: ""
      ignore_failure: true
      when.equals:
        logset: "zeek"
  - dissect:
      tokenizer: "/logs/zeek-proxy/%{zeek_log}.%{_zeek_suffix}"
      field: "log.file.path"
      target_prefix: ""
      ignore_failure: true
      when.equals:
        logset: "zeek-proxy"

  # Lifecycle records use an empty src_ip. Remove that field before the
  # Elasticsearch IP mapping/GeoIP processor sees it; the record remains
  # searchable and no longer enters the dead-letter index.
  - drop_fields:
      fields: ["honeypot.src_ip"]
      ignore_missing: true
      when.equals:
        honeypot.src_ip: ""
  # Attach stable defender-side identity to formats that cannot emit persona
  # metadata themselves. Conditions use the mounted source path, never
  # attacker-controlled content.
  #
  # #746: cowrie/dionaea/every conpot persona route through ip-enrichment-worker
  # (#37/#38), which rewrites their raw /logs/<service>/ logs into
  # /logs/enriched/<name>.json before Filebeat ever sees them -- so
  # log.file.path for these events is always under /logs/enriched/, never the
  # raw per-service directory these when.contains conditions were originally
  # written against. Confirmed live: zero honeypot.persona_id documents existed
  # anywhere for cowrie or conpot before this fix. Matching against the
  # enriched filename instead (backend-service/src/ip_enrichment/mod.rs's
  # discover_sources names each output "<persona>.json") fixes all of them in one pass.
  # #2189 correction: dionaea's own dionaea_incident.json IS rewritten by
  # ip-enrichment-worker too (#623 -- src_ip is buried under a data.* key
  # that varies by incident origin, so its enrich function walks the whole
  # record) and the corrected copy lands at /logs/enriched/dionaea-incident.json,
  # tailed by the separate dionaea-incidents input above. That filename does
  # not contain "enriched/dionaea.json", so incident records deliberately stay
  # outside the dionaea persona rule just below -- that rule attaches identity
  # to dionaea's normal, enriched connection-log events only.
  - add_fields:
      target: honeypot
      fields: {persona_id: nexusai-gpu01, site_id: nexusai-berlin-ml, asset_id: gpu01, organization: NexusAI Research GmbH}
      when.contains: {log.file.path: "enriched/cowrie.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: meridian-legacy, site_id: meridian-hamburg-dc1, asset_id: legacy-svc-02, organization: Meridian Retail Systems Ltd.}
      # #2189: a twin of this rule matching log.file.path "/logs/dionaea/" --
      # written back when dionaea events were expected from the raw per-service
      # directory -- was deleted here: no input has tailed /logs/dionaea/* since
      # ip-enrichment-worker took over (#37/#38), so it could never fire.
      when.contains: {log.file.path: "enriched/dionaea.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: rheinwerk-water-s7-1200, site_id: rheinwerk-treatment, asset_id: plc-filter-02, organization: Rheinwerk Municipal Water}
      when.contains: {log.file.path: "enriched/conpot-s7-1200.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: nordchem-s7-1500, site_id: nordchem-reactor-4, asset_id: plc-reactor-04, organization: NordChem Process Industries}
      when.contains: {log.file.path: "enriched/conpot-s7-1500.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: elbegrid-iec104, site_id: elbegrid-substation-17, asset_id: rtu-sub17-a, organization: ElbeGrid Distribution}
      when.contains: {log.file.path: "enriched/conpot-iec104.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: northfuel-guardian, site_id: northfuel-station-042, asset_id: tankmon-042, organization: NorthFuel Service GmbH}
      when.contains: {log.file.path: "enriched/conpot-guardian.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: stadtwaerme-kamstrup, site_id: stadtwaerme-loop-west, asset_id: heatmeter-west-0382, organization: Stadtwaerme Nord}
      when.contains: {log.file.path: "enriched/conpot-kamstrup.json"}
  - add_fields:
      target: honeypot
      fields: {persona_id: rheinwerk-water-s7-200, site_id: rheinwerk-intake, asset_id: plc-intake-01, organization: Rheinwerk Municipal Water}
      when.contains: {log.file.path: "enriched/conpot.json"}
  # #1099: tanner_report.json has no "sensor" field of its own (unlike the
  # Go-based sensors, which self-report one) -- geoip-honeypot's ingest
  # pipeline only ever promotes event.sensor from honeypot.sensor (or a
  # couple of hardcoded /conpot, /dionaea path fallbacks tanner isn't part
  # of), so every tanner event landed unclassified: present in
  # honeypot-v2-*, but invisible to any event.sensor-scoped view (the
  # Sensors card, Event Explorer's sensor filter, and at the time the
  # dashboard's EXPECTED_SENSORS freshness tracking -- that expectation
  # list has since been removed by commit 824aa33d/#1628, with its
  # freshness role absorbed by source-health alone; see #2359).
  # Confirmed live (2026-08-09). Fixed at the source
  # here rather than adding a third hardcoded path fallback to the ingest
  # pipeline's already-accumulating special cases.
  # #1217: tanner_report.json now routes through ip-enrichment-worker like
  # cowrie/dionaea/conpot do (field normalization only, not IP resolution --
  # see canonical.go), so log.file.path is always under /logs/enriched/ by
  # the time Filebeat sees it, never the raw /logs/tanner/ path -- same
  # #746 fix applied here as the cowrie/dionaea/conpot rules above.
  - add_fields:
      target: honeypot
      fields: {sensor: tanner, persona_id: meridian-customer-portal, site_id: meridian-public-web, asset_id: customer-portal-02, organization: Meridian Retail Systems Ltd.}
      when.contains: {log.file.path: "enriched/tanner.json"}
  # #1418: beelzebub.json has no "sensor" field of its own either (a
  # vendored, unmodified binary with no knowledge of this repo's
  # convention) -- backend-service/src/ip_enrichment/sensors.rs's
  # enrich_beelzebub_line already writes
  # sensor/src_ip/src_port as flat lowercase fields onto every line before
  # Filebeat ever sees it, same "enriched supersedes raw" path as
  # cowrie/dionaea/conpot/tanner above, so this only needs to attach
  # defender-side persona identity, same as every other rule in this block.
  - add_fields:
      target: honeypot
      fields: {persona_id: nexusai-directory, site_id: nexusai-berlin-core, asset_id: directory-estate, organization: NexusAI Research GmbH}
      when.contains: {log.file.path: "enriched/beelzebub.json"}
  # #1419: hellpot.json has no "sensor" field of its own either, same
  # reasoning as beelzebub above -- sensors.rs's enrich_hellpot_line already
  # writes sensor/src_ip/src_port as flat lowercase fields before Filebeat
  # ever sees it.
  - add_fields:
      target: honeypot
      fields: {persona_id: meridian-legacy-web, site_id: meridian-legacy-infra, asset_id: web-legacy-04, organization: Meridian Retail Systems Ltd.}
      when.contains: {log.file.path: "enriched/hellpot.json"}
  # #1420: event_log.json has no "sensor" field of its own either, same
  # reasoning as beelzebub/hellpot above -- sensors.rs's enrich_galah_line
  # already writes sensor/src_ip/src_port as flat fields before Filebeat
  # ever sees it.
  - add_fields:
      target: honeypot
      fields: {persona_id: meridian-staff-console, site_id: meridian-internal-tools, asset_id: staff-console-07, organization: Meridian Retail Systems Ltd.}
      when.contains: {log.file.path: "enriched/galah.json"}
  # #1423: elasticpot.json DOES already carry its own native "sensor"
  # field (elasticpot/honeypot.cfg's sensor_name override sets it to the
  # literal "elasticpot", unlike beelzebub/hellpot above which needed
  # ip-enrichment-worker to inject one) -- this rule only attaches
  # defender-side persona identity, same as every other rule in this block.
  - add_fields:
      target: honeypot
      fields: {persona_id: nexusai-analytics-legacy, site_id: nexusai-berlin-analytics, asset_id: analytics-es-04, organization: NexusAI Research GmbH}
      when.contains: {log.file.path: "enriched/elasticpot.json"}
  # #1424: sentrypeer.json has no "sensor" field of its own either, same
  # reasoning as beelzebub/hellpot above -- sensors.rs's
  # enrich_sentrypeer_line already writes sensor/src_ip/src_port as flat
  # fields before Filebeat
  # ever sees it.
  - add_fields:
      target: honeypot
      fields: {persona_id: harborline-pbx, site_id: harborline-dispatch-office, asset_id: pbx-trunk-02, organization: Harborline Logistics AG}
      when.contains: {log.file.path: "enriched/sentrypeer.json"}
  # (the enriched/wordpot.json add_fields block went with wordpot's
  # retirement, #2381; its meridian-legacy-web persona stays on hellpot.)
  # NOTE on stats events: they carry ~600 engine-internal counter fields and
  # once exhausted the shared daily index's field limit (2026-07-19 outage).
  # With per-event-type indices (see output below) they are contained in
  # their own suricata-stats-* index, so they are shipped again. The
  # suricata-* index template raises total_fields.limit to 5000.
  - add_fields:
      target: ""
      fields:
        pipeline: honeypot
  # Strip filebeat internal fields that can collide with honeypot field names
  - drop_fields:
      fields: ["agent", "ecs", "input", "log.offset"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  # Suricata events are split per event type (suricata-alert-*, suricata-dns-*,
  # suricata-flow-*, ...). EveBox reads the whole suricata-v2-* set through one
  # index prefix; the generic suricata-* data view still matches all of them.
  indices:
    - index: "suricata-v2-%{[suricata.eve.event_type]}-%{+yyyy.MM.dd}"
      when.equals:
        logset: "suricata"
    - index: "honeypot-v2-%{+yyyy.MM.dd}"
      when.equals:
        logset: "sensors"
    - index: "portbridge-v2-%{+yyyy.MM.dd}"
      when.equals:
        logset: "portbridge"
    - index: "dionaea-incidents-v1-%{+yyyy.MM.dd}"
      when.equals:
        logset: "dionaea-incidents"
    # #1739: its own index family rather than honeypot-v2-*. These are HTTP
    # request records with a field set that overlaps nothing else here, and
    # they need their own retention: the decoys behind Traefik are quiet
    # (96 of 14 164 connections in a measured sample) but every one of those
    # requests is invisible to every other sensor.
    - index: "traefik-v1-%{+yyyy.MM.dd}"
      when.equals:
        logset: "traefik"
    # #1742/S5: Zeek is split per log type the same way Suricata is, so a
    # query can hit zeek-v1-conn-* alone instead of scanning every protocol
    # log. event.category is set by the pipeline from the source filename.
    #
    # #3283: one index per log type per MONTH, not per day. 84 zeek log types
    # x one index a day was ~90 of the cluster's new shards every day -- at
    # 30-day retention ~2,700 shards on a single node capped at 1,500, which
    # is what dead-lettered all ingest on 2026-09-21. The ".01" literal keeps
    # the yyyy.MM.dd shape every consumer relies on (zeek-v1-<type>-* patterns,
    # backend-service's flow_family() date-tail regex): zeek-v1-conn-2026.10.01
    # holds all of October. Retention for it is zeek-60d (see
    # elasticsearch-setup.sh), so each month is kept 30-60 days.
    - index: "zeek-v1-%{[zeek_log]}-%{+yyyy.MM}.01"
      when.equals:
        logset: "zeek"
    # Its own family: same fields, different vantage point. Mixing them would
    # make "which sensor saw this" unanswerable at query time.
    - index: "zeek-proxy-v1-%{[zeek_log]}-%{+yyyy.MM}.01"
      when.equals:
        logset: "zeek-proxy"
    - index: "huginn-v1-%{+yyyy.MM.dd}"
      when.equals:
        logset: "huginn"
    # #1972: the dashboard's own serving tiers. Two index families, three
    # logsets -- both backend-service instances (regular + -mounted; same
    # image, same route table) ship into one shared family because their
    # per-request records are identical in shape and lifetime, and every
    # "what did the API serve / since when" question spans both tiers; the
    # logset value kept on each document still answers which instance
    # answered. The BFF's named-event stream gets its own family. HTTP
    # request records and app events, not sensor data -- traefik-v1-*'s
    # #1739 reasoning applies to each.
    - index: "dashboard-backend-v1-%{+yyyy.MM.dd}"
      when.equals:
        logset: "dashboard-backend"
    - index: "dashboard-backend-v1-%{+yyyy.MM.dd}"
      when.equals:
        logset: "dashboard-backend-mounted"
    - index: "dashboard-bff-v1-%{+yyyy.MM.dd}"
      when.equals:
        logset: "dashboard-bff"

  # Preserve the original event if Elasticsearch ever rejects it despite the
  # flattened mapping. This prevents silent data loss and records the cause.
  non_indexable_policy.dead_letter_index:
    index: "dead-letter-honeypot"

  # Four bulk workers let Elasticsearch catch up after an outage without
  # sacrificing durable Filebeat registry checkpoints.
  worker: 4
  bulk_max_size: 4096
  compression_level: 1

queue.mem:
  events: 32768
  flush.min_events: 4096
  flush.timeout: 2s

# Disable Filebeat's automatic template / ILM management. elasticsearch-setup
# installs the versioned honeypot template; Suricata retains its own template.
setup.template.enabled: false
setup.ilm.enabled: false

# In Kibana: create data views for honeypot-*, suricata-*, and portbridge-*
# Useful fields: honeypot.src_ip, honeypot.username, honeypot.password,
#                honeypot.proto, honeypot.category, honeypot.input
#                suricata.src_ip, suricata.alert.signature, suricata.event_type
#                portbridge.src_ip, portbridge.os, portbridge.via_port, portbridge.port
logging.level: warning

# Internal monitoring is reachable only on the private Compose network. The
# custom dashboard uses it to surface publisher acknowledgements/failures.
http.enabled: true
http.host: 0.0.0.0
http.port: 5066
