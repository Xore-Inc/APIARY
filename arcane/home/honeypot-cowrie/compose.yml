# honeypot-cowrie — #258: cowrie split into its own Dockge-managed stack.
#
# Same shape and same reasoning as arcane/home/honeypot-conpot/compose.yml (see that file's
# header for the full #258 writeup): cowrie has no depends_on relationship on
# any other honeypot, its own fully private network (cowrie_net), and every
# volume here is a host bind mount, not a Docker named volume -- so no
# external: true network/volume machinery is needed. Deployed as
# /opt/stacks/honeypot-cowrie.
#
# The config-file mounts below (cowrie.cfg, userdb.txt, the fakefs DMI nodes)
# used relative ./cowrie/... paths when this lived in docker-compose.yml --
# relative to *that* file's own directory. Moved to absolute paths into the
# APIARY checkout, matching arcane/home/honeypot-init/compose.yml's snare-clone
# build-context precedent and arcane/home/honeypot-conpot/compose.yml's own build: path.
#
# cowrie-downloads (the captured-payload directory under logs/cowrie) is
# still a bind mount into the same host path other stacks already read from
# (dashboard's PAYLOAD_DIRS, yara-scanner) -- unaffected by this move.

name: honeypot-cowrie

x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "3"

services:
  cowrie:
    <<: *runtime-defaults
    build: ./cowrie
    container_name: hp-cowrie
    restart: unless-stopped
    # #128: waits on the marker directly instead of depends_on-ing
    # init-wait-log (same-project-only mechanism). Reproduces the
    # Dockerfile's own ENTRYPOINT (checked directly:
    # ["/cowrie/cowrie-git/bin/entrypoint.sh"]) with the wait spliced in.
    entrypoint:
      - /bin/sh
      - -c
      - >
        until [ -f /markers/log-init.done ]; do sleep 3; done;
        exec /cowrie/cowrie-git/bin/entrypoint.sh
    ports:
      - ${HP_BIND:-10.8.0.2}:19022:2222
      - ${HP_BIND:-10.8.0.2}:19023:2223
    volumes:
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - /opt/stacks/apiary/logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      # #239: cowrie writes its SSH host keys (ssh_host_{rsa,ecdsa,ed25519}_key
      # (.pub)), its own uuid file, and auth_random.json directly into
      # var/lib/cowrie -- not a subdirectory, so the more specific
      # downloads/tty mounts below layer on top of this one rather than
      # replacing it. Found live via a real read_only:true test run
      # (getRSAKeys() failed outright with a read-only-filesystem error
      # against the pre-#239 mount set): without this, host keys regenerate
      # on every container recreate, which is a real deception problem
      # independent of read_only -- a returning attacker (or an
      # intrusion-detection tool fingerprinting by host key) sees the
      # honeypot's identity change on every redeploy. Bind-mounted for the
      # same persistence reason as downloads/tty below, not tmpfs.
      - /opt/stacks/apiary/logs/cowrie/lib-cowrie:/cowrie/cowrie-git/var/lib/cowrie
      # Cowrie saves every uploaded/downloaded file by SHA-256, including shell,
      # PowerShell, VBS, Python and JavaScript payloads.
      - /opt/stacks/apiary/logs/cowrie/downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads
      # #611: TTY session recordings (cowrie.log.closed's ttylog field) --
      # previously only in the container's writable layer, lost on every
      # recreate/redeploy. Same reasoning as the downloads mount above.
      - /opt/stacks/apiary/logs/cowrie/tty:/cowrie/cowrie-git/var/lib/cowrie/tty
      # Hardware identity overrides for sysfs DMI nodes — these are outside
      # /proc so runc proc-safety does not apply.
      - ./cowrie/fakefs/sys/class/dmi/id/product_name:/sys/class/dmi/id/product_name:ro
      - ./cowrie/fakefs/sys/class/dmi/id/sys_vendor:/sys/class/dmi/id/sys_vendor:ro
      - ./cowrie/fakefs/sys/class/dmi/id/board_name:/sys/class/dmi/id/board_name:ro
      - /opt/stacks/apiary/state/init-markers:/markers:ro
      # #1487: honeyfs-implant's write target. Bind-mounted (not baked into
      # the image, see the Dockerfile's honeyfs.dist comment) so a token or
      # credential can be planted into this persona's fake filesystem live,
      # picked up by entrypoint.sh's sync-fs.py re-merge on the next
      # autoheal-triggered restart (see healthcheck below), without a
      # rebuild/redeploy. Host paths need creating with uid:gid 2000:2000
      # (cowrie's own user, matching read_only:true's write-access model
      # below) before first boot -- entrypoint.sh seeds them from the
      # image's honeyfs.dist/fs.pickle.dist on an empty first run.
      - /opt/stacks/apiary/state/honeyfs/cowrie:/cowrie/cowrie-git/honeyfs
      - /opt/stacks/apiary/state/honeyfs/cowrie-share:/cowrie/cowrie-git/share/cowrie
    environment:
      # #185: cowrie's own twisted/plugins/cowrie_plugin.py reads
      # [honeypot] timezone from cowrie.cfg (unset here, so it falls back
      # to "UTC") and does `os.environ["TZ"] = tz` at startup -- but never
      # calls time.tzset() afterwards. On glibc that mutation doesn't
      # retroactively change how the C library resolves local time, so
      # with TZ=Europe/Berlin at container start, cowrie went on
      # formatting real CEST wall-clock time while its own env-derived
      # code path (which DOES read os.environ directly, not through
      # glibc) believed TZ was "UTC" and appended a bare "Z" suffix --
      # every event timestamp was mislabeled UTC while actually running
      # +2h ahead, which silently dropped cowrie from the dashboard's 24h
      # activity chart (negative age = "future" event). Setting TZ=UTC
      # here matches cowrie's own default exactly, so the mutation is a
      # no-op and the Z label is finally true.
      - TZ=UTC
      - COWRIE_HOSTNAME=gpu01
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # #239: measured via a real read_only:true run against the actual
    # compose service definition, not assumed. Every other write cowrie
    # makes lands in one of the bind mounts above; the one remaining path,
    # bin/gen-dynamic-txtcmds.py's per-boot regenerated free/df/ss/top/proc/*
    # output (txtcmds/), is deliberately ephemeral -- fresh values every
    # container start is the whole point (see that script's own header) --
    # so tmpfs, not a persistent mount. #2926: this tmpfs also masks the
    # image's static overlay entries, so entrypoint.sh seeds it from
    # txtcmds.dist before the generator runs.
    read_only: true
    tmpfs:
      - /cowrie/cowrie-git/txtcmds:uid=2000,gid=2000
    networks:
      - cowrie_net
    # Two conjuncts, both of which must pass for a healthy verdict:
    #
    # 1. #1487: fails while honeyfs-implant's marker (var/lib/cowrie,
    # already bind-mounted above) is present -- autoheal (honeypot-utilities'
    # willfarrell/autoheal, watching every autoheal=true container via
    # docker-socket-proxy, same trust boundary as everywhere else this repo
    # uses it) restarts this container on the next unhealthy check, and
    # entrypoint.sh clears the marker once it's re-synced fs.pickle. No new
    # docker.sock/proxy access needed here -- this container only ever
    # writes the marker file, autoheal does the actual restart.
    #
    # 2. #2107: bin/healthcheck-probe.py completes an SSH version-string
    # exchange against 127.0.0.1:2222. Until #2107 the check was the marker
    # stat alone, which samples nothing about process state: a Twisted
    # reactor wedged busy-looping the way conpot's gevent loop did in #111
    # still passes a stat test (and would pass a plain TCP connect too --
    # the kernel backlog answers without the process). The banner exchange
    # requires a reactor that is actually scheduling; it is the same
    # protocol-level doctrine as honeypot-conpot/conpot/healthcheck.py.
    # Probe cost and its log-noise accounting are documented in that
    # script's docstring (~2880 loopback sessions/day at this interval,
    # auto-marked honeypot.internal_probe at enrichment and excluded from
    # every dashboard consumer by the #1677 doctrine).
    healthcheck:
      test: ["CMD-SHELL", "test ! -f /cowrie/cowrie-git/var/lib/cowrie/.implant-pending && /cowrie/cowrie-env/bin/python3 /cowrie/cowrie-git/bin/healthcheck-probe.py"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 30s
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # #1487: honeyfs-implant plants a dashboard-created token/credential into
  # cowrie's fake filesystem live -- see honeyfs-implant/main.go's package
  # doc for the full mechanism (deliberately does not touch fs.pickle
  # itself; cowrie's own entrypoint.sh does that on the restart this
  # service's marker forces). WireGuard-tunnel-only (matches
  # canarytokens-frontend's own internal-API posture); the dashboard's
  # backend is the only intended caller. Shares cowrie's own uid:gid
  # (2000:2000) so both containers can write the same bind-mounted honeyfs/
  # directory without a permissions mismatch.
  honeyfs-implant:
    <<: *runtime-defaults
    build: ./honeyfs-implant
    container_name: hp-honeyfs-implant
    restart: unless-stopped
    depends_on: [cowrie]
    environment:
      - HONEYFS_DIR=/data/honeyfs
      - MARKER_PATH=/data/lib/.implant-pending
      # Optional defense-in-depth bearer token, layered under the primary
      # WireGuard-only network boundary -- see main.go's requireToken doc.
      # Empty by default, matching every other internal-only API in this
      # repo (network reachability is the trust boundary).
      # The token may instead come from IMPLANT_TOKEN_FILE (#3690), a path
      # inside the container, so a file must be mounted there to be useful.
      # Setting both, or naming an unreadable/empty file, makes the service
      # exit non-zero ([E-IMPLANT-TOKEN]); it never falls back to no auth.
      - IMPLANT_TOKEN=${HONEYFS_IMPLANT_TOKEN:-}
      - IMPLANT_TOKEN_FILE=${HONEYFS_IMPLANT_TOKEN_FILE:-}
    ports:
      - ${HP_BIND:-10.8.0.2}:19428:8091
    volumes:
      # Same host path as cowrie's own honeyfs mount above -- this service
      # and cowrie must see the identical live directory.
      - /opt/stacks/apiary/state/honeyfs/cowrie:/data/honeyfs
      # Same lib-cowrie mount as cowrie's own var/lib/cowrie bind above,
      # just remounted at a shorter container path -- this is where the
      # implant-pending marker (cowrie's HEALTHCHECK target) gets written.
      - /opt/stacks/apiary/logs/cowrie/lib-cowrie:/data/lib
    networks: [cowrie_net]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Every write this service makes lands in one of the two bind mounts
    # above; nothing else needs a writable root filesystem (also a scratch
    # image -- see honeyfs-implant/Dockerfile -- so there's no writable
    # root filesystem to speak of regardless).
    read_only: true
    # HEALTHCHECK is baked into honeyfs-implant/Dockerfile itself (scratch
    # image, no shell/curl available for a compose-level CMD check --
    # same reasoning as canarytokens-adapter's own compose entry).
    labels:
      - autoheal=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  # #269: outbound is allowed by default, matching this repo's previous de
  # facto behavior (no honeypot's network has ever set internal: true) and
  # T-Pot's own explicitly-named design choice for the same reason -- Cowrie
  # only captures the attacker's actual malware, not just the download
  # attempt, if its fake shell's wget/curl/tftp can really reach the
  # internet to fetch it. Set COWRIE_AIR_GAPPED=true (.env) for a stricter,
  # fully air-gapped deployment that trades that capability away; see
  # docs/persona-design.md for the full tradeoff.
  cowrie_net:
    driver: bridge
    internal: ${COWRIE_AIR_GAPPED:-false}
